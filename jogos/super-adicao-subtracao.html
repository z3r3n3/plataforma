<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Matemática QVL - Celular e PC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5em;
            margin-bottom: 15px;
            margin-top: 5px;
            background: linear-gradient(45deg, #ff007f, #ffea00, #00f0ff, #ff007f);
            background-size: 300% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: brilhoAnimado 3s linear infinite;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.1));
            letter-spacing: 2px;
        }

        @keyframes brilhoAnimado {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .hud {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .badge {
            background: #fff;
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            font-weight: bold;
            color: #2f3542;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
        }

        select, input[type="number"] {
            font-family: 'Nunito', sans-serif;
            font-size: 1em;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #ced4da;
            cursor: pointer;
            outline: none;
        }

        input[type="number"] { cursor: text; text-align: center; }

        .btn-pequeno {
            background-color: #2ed573;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 0 #25a85a;
            transition: transform 0.1s;
        }
        .btn-pequeno:active { transform: translateY(4px); box-shadow: none; }

        #btn-fullscreen {
            background-color: #9b59b6;
            box-shadow: 0 4px 0 #8e44ad;
        }

        #desafio-container {
            font-size: 2.8em;
            font-family: 'Fredoka One', cursive;
            background-color: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            box-shadow: 0 6px 0 #dfe4ea;
            display: inline-block;
            margin-bottom: 15px;
            color: #3742fa;
            min-width: 250px;
        }

        #banco-numeros {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .numero {
            width: 55px;
            height: 55px;
            background-color: #ffa502;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-family: 'Fredoka One', cursive;
            color: #fff;
            cursor: pointer; 
            box-shadow: 0 5px 0 #eccc68;
            transition: all 0.2s;
            touch-action: manipulation; 
        }

        .numero:active { transform: translateY(5px); box-shadow: 0 0 0 #eccc68; }

        .numero.selecionado {
            background-color: #ff4757;
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 10px 15px rgba(255, 71, 87, 0.5);
            border: 3px solid #fff;
            z-index: 20;
        }

        .qvl-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .qvl {
            display: inline-block;
            background-color: #fff;
            border: 5px solid #7bed9f;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* AJUSTADO PARA 8 COLUNAS DE NÚMEROS + 1 DO SINAL */
        .qvl-row {
            display: grid;
            grid-template-columns: 40px repeat(8, 50px);
            gap: 5px;
            margin-bottom: 8px;
            align-items: center;
        }

        .qvl-header div {
            font-family: 'Fredoka One', cursive;
            font-size: 1em;
            color: #fff;
            border-radius: 8px;
            padding: 5px 0;
        }

        .reserva-zone, .dropzone {
            background-color: #f1f2f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka One', cursive;
            transition: all 0.2s;
            cursor: pointer;
        }

        .reserva-zone {
            width: 45px; height: 35px;
            border: 2px dashed #ff7f50;
            font-size: 1.3em; color: #ff4757;
            margin: 0 auto;
        }

        .dropzone {
            width: 50px; height: 50px;
            border: 3px dashed #ced4da;
            font-size: 2em; color: #2f3542;
        }

        .dropzone.dragover, .reserva-zone.dragover { background-color: #e2f0cb; border-color: #2ed573; }
        .cortado { text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: #ff4757; color: #a4b0be; background-color: #f1f2f6; }
        .operador-sinal { font-size: 2.5em; font-family: 'Fredoka One', cursive; color: #ff4757; }
        .linha-resultado { height: 5px; background-color: #2f3542; margin: 10px 0; border-radius: 3px; }

        .controles { margin-top: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; position: relative; z-index: 10; }
        
        button.btn-grande {
            font-family: 'Nunito', sans-serif;
            font-size: 1.3em;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        button.btn-grande:active:not(:disabled) { transform: translateY(5px); box-shadow: none; }
        button.btn-grande:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        
        #btn-conferir { background-color: #1e90ff; }
        #btn-pular { background-color: #ff9f43; }
        #btn-novo { background-color: #ff4757; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #mensagem { font-size: 1.6em; font-family: 'Fredoka One', cursive; margin-top: 15px; height: 40px; position: relative; z-index: 10; padding: 0 10px;}
        .sucesso { color: #2ed573; animation: pular 0.5s ease; }
        .erro { color: #ff4757; }

        @keyframes pular { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .confete { position: fixed; top: -20px; z-index: 9999; animation: cair linear forwards; border-radius: 2px; pointer-events: none; }
        @keyframes cair { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        /* RESPONSIVIDADE ADAPTADA PARA 8 COLUNAS */
        @media (max-width: 650px) {
            h1 { font-size: 2.2em; margin-top: 15px;}
            .badge { font-size: 0.9em; padding: 6px 10px; }
            #desafio-container { font-size: 2em; padding: 10px 15px; margin-bottom: 10px;}
            .numero { width: 40px; height: 40px; font-size: 1.5em; border-radius: 8px;}
            .qvl { padding: 8px; border-width: 3px; border-radius: 12px; }
            .qvl-row { grid-template-columns: 20px repeat(8, 36px); gap: 3px; }
            .qvl-header div { font-size: 0.8em; padding: 3px 0;}
            .dropzone { width: 36px; height: 36px; font-size: 1.4em; border-width: 2px; border-radius: 8px;}
            .reserva-zone { width: 32px; height: 26px; font-size: 1em; border-width: 2px; border-radius: 8px;}
            .operador-sinal { font-size: 1.6em; }
            button.btn-grande { font-size: 1.1em; padding: 10px 15px; }
            #mensagem { font-size: 1.3em; }
        }
        
        @media (max-width: 380px) {
            .qvl-row { grid-template-columns: 15px repeat(8, 30px); gap: 3px; }
            .dropzone { width: 30px; height: 30px; font-size: 1.2em; }
            .reserva-zone { width: 26px; height: 22px; font-size: 0.9em; }
            .numero { width: 35px; height: 35px; font-size: 1.3em; }
        }
    </style>
</head>
<body>

    <h1>Super Matemática!</h1>
    
    <div class="hud">
        <button id="btn-fullscreen" class="btn-pequeno" onclick="toggleFullScreen()">Tela Cheia 🔲</button>
        
        <div class="badge">
            Modo:
            <select id="seletor-modo" onchange="mudarModo()">
                <option value="auto">Automático</option>
                <option value="manual">Professor</option>
            </select>
        </div>

        <div class="badge" id="painel-auto">
            <select id="seletor-op" onchange="gerarNovoDesafioAuto()">
                <option value="+">Adição (+)</option>
                <option value="-">Subtração (-)</option>
            </select>
            <span style="margin: 0 5px;">|</span>
            Nível: 
            <select id="seletor-nivel" onchange="gerarNovoDesafioAuto()">
                <option value="1">1 (Dezenas)</option>
                <option value="2">2 (Centenas)</option>
                <option value="3">3 (Unid. Milhar)</option>
                <option value="4">4 (Cent. Milhar)</option>
            </select>
        </div>

        <div class="badge" id="painel-manual" style="display: none;">
            <input type="number" id="manual-n1" placeholder="Nº 1" style="width: 60px;">
            <select id="manual-op">
                <option value="+">+</option>
                <option value="-">-</option>
            </select>
            <input type="number" id="manual-n2" placeholder="Nº 2" style="width: 60px;">
            <button class="btn-pequeno" onclick="iniciarDesafioManual()">Vai!</button>
        </div>

        <div class="badge">⏱️ <span id="tempo">00:00</span></div>
        <div class="badge">⭐ Pontos: <span id="pontuacao">0</span></div>
    </div>

    <div id="desafio-container">
        <span id="desafio-texto">...</span>
    </div>

    <div id="banco-numeros"></div>

    <div class="qvl-container">
        <div class="qvl">
            <div class="qvl-row qvl-header">
                <div></div>
                <div style="background-color: #16a085;">DMi</div>
                <div style="background-color: #1abc9c;">UMi</div>
                <div style="background-color: #9b59b6;">CM</div>
                <div style="background-color: #e056fd;">DM</div>
                <div style="background-color: #f39c12;">UM</div>
                <div style="background-color: #f1c40f;">C</div>
                <div style="background-color: #e74c3c;">D</div>
                <div style="background-color: #3498db;">U</div>
            </div>

            <div class="qvl-row">
                <div></div>
                <div class="reserva-zone" data-pos="res-dmi"></div>
                <div class="reserva-zone" data-pos="res-umi"></div>
                <div class="reserva-zone" data-pos="res-cm"></div>
                <div class="reserva-zone" data-pos="res-dm"></div>
                <div class="reserva-zone" data-pos="res-um"></div>
                <div class="reserva-zone" data-pos="res-c"></div>
                <div class="reserva-zone" data-pos="res-d"></div>
                <div class="reserva-zone" data-pos="res-u"></div>
            </div>

            <div class="qvl-row">
                <div></div>
                <div class="dropzone" data-pos="dmi1"></div>
                <div class="dropzone" data-pos="umi1"></div>
                <div class="dropzone" data-pos="cm1"></div>
                <div class="dropzone" data-pos="dm1"></div>
                <div class="dropzone" data-pos="um1"></div>
                <div class="dropzone" data-pos="c1"></div>
                <div class="dropzone" data-pos="d1"></div>
                <div class="dropzone" data-pos="u1"></div>
            </div>

            <div class="qvl-row">
                <div class="operador-sinal" id="sinal-operacao">+</div>
                <div class="dropzone" data-pos="dmi2"></div>
                <div class="dropzone" data-pos="umi2"></div>
                <div class="dropzone" data-pos="cm2"></div>
                <div class="dropzone" data-pos="dm2"></div>
                <div class="dropzone" data-pos="um2"></div>
                <div class="dropzone" data-pos="c2"></div>
                <div class="dropzone" data-pos="d2"></div>
                <div class="dropzone" data-pos="u2"></div>
            </div>

            <div class="linha-resultado"></div>

            <div class="qvl-row">
                <div></div>
                <div class="dropzone" data-pos="dmir"></div>
                <div class="dropzone" data-pos="umir"></div>
                <div class="dropzone" data-pos="cmr"></div>
                <div class="dropzone" data-pos="dmr"></div>
                <div class="dropzone" data-pos="umr"></div>
                <div class="dropzone" data-pos="cr"></div>
                <div class="dropzone" data-pos="dr"></div>
                <div class="dropzone" data-pos="ur"></div>
            </div>
        </div>
    </div>

    <div class="controles">
        <button id="btn-pular" class="btn-grande" onclick="acaoPular()">Pular / Limpar 🔄</button>
        <button id="btn-conferir" class="btn-grande" onclick="conferirResposta()">Conferir Conta!</button>
        <button id="btn-novo" class="btn-grande" onclick="acaoProximo()" style="display:none;">Próximo Desafio ➡️</button>
    </div>

    <div id="mensagem"></div>

    <script>
        let desafioAtual = null;
        let pontos = 0;
        let timerInterval;
        let segundos = 0;
        let jogoTravado = false; 
        
        let numeroSelecionadoMobile = null; 

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); } 
                else if (document.documentElement.msRequestFullscreen) { document.documentElement.msRequestFullscreen(); } 
                else if (document.documentElement.mozRequestFullScreen) { document.documentElement.mozRequestFullScreen(); } 
                else if (document.documentElement.webkitRequestFullscreen) { document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT); }
                document.getElementById('btn-fullscreen').innerHTML = "Sair Tela Cheia ✖️";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.msExitFullscreen) { document.msExitFullscreen(); } 
                else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); } 
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                document.getElementById('btn-fullscreen').innerHTML = "Tela Cheia 🔲";
            }
        }

        function inicializarAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function tocarSom(tipo) {
            inicializarAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            if (tipo === 'acerto') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (tipo === 'erro') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function lancarConfetes() {
            const cores = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff007f', '#00f0ff', '#fff200'];
            for (let i = 0; i < 100; i++) {
                let confete = document.createElement('div');
                confete.classList.add('confete');
                confete.style.left = Math.random() * 100 + 'vw';
                confete.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
                confete.style.width = (Math.random() * 10 + 5) + 'px';
                confete.style.height = (Math.random() * 15 + 5) + 'px';
                confete.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confete.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confete);
                setTimeout(() => confete.remove(), 5000);
            }
        }

        function atualizarTempo() {
            segundos++;
            let min = Math.floor(segundos / 60).toString().padStart(2, '0');
            let seg = (segundos % 60).toString().padStart(2, '0');
            document.getElementById('tempo').textContent = `${min}:${seg}`;
        }
        function iniciarCronometro() { clearInterval(timerInterval); segundos = 0; document.getElementById('tempo').textContent = "00:00"; timerInterval = setInterval(atualizarTempo, 1000); }
        function pararCronometro() { clearInterval(timerInterval); }

        function removerSelecaoBanco() {
            numeroSelecionadoMobile = null;
            document.querySelectorAll('#banco-numeros .numero').forEach(n => n.classList.remove('selecionado'));
        }

        function criarBancoNumeros() {
            const banco = document.getElementById('banco-numeros');
            banco.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const numDiv = document.createElement('div');
                numDiv.classList.add('numero'); 
                numDiv.textContent = i; 
                numDiv.setAttribute('draggable', true);
                
                numDiv.addEventListener('dragstart', e => { 
                    if (jogoTravado) { e.preventDefault(); return; } 
                    removerSelecaoBanco();
                    e.dataTransfer.setData('text/plain', e.target.textContent); 
                    inicializarAudio(); 
                });

                numDiv.addEventListener('click', function() {
                    if (jogoTravado) return;
                    inicializarAudio();
                    if (numeroSelecionadoMobile === this.textContent) {
                        removerSelecaoBanco();
                    } else {
                        removerSelecaoBanco();
                        numeroSelecionadoMobile = this.textContent;
                        this.classList.add('selecionado');
                    }
                });

                banco.appendChild(numDiv);
            }
        }

        function configurarDropzones() {
            document.querySelectorAll('.dropzone, .reserva-zone').forEach(zone => {
                
                zone.addEventListener('dragover', e => { 
                    if (jogoTravado) return; 
                    e.preventDefault(); 
                    zone.classList.add('dragover'); 
                });
                zone.addEventListener('dragleave', e => zone.classList.remove('dragover'));
                zone.addEventListener('drop', e => {
                    e.preventDefault(); zone.classList.remove('dragover');
                    if(!desafioAtual || jogoTravado) return; 
                    
                    let num = e.dataTransfer.getData('text/plain');
                    if (zone.classList.contains('reserva-zone')) {
                        if (zone.textContent.length < 2) zone.textContent += num; else zone.textContent = num;
                    } else { zone.textContent = num; zone.classList.remove('cortado'); }
                });

                zone.addEventListener('click', function() {
                    if (!desafioAtual || jogoTravado) return; 
                    
                    if (numeroSelecionadoMobile !== null) {
                        if (this.classList.contains('reserva-zone')) {
                            if (this.textContent.length < 2) this.textContent += numeroSelecionadoMobile; 
                            else this.textContent = numeroSelecionadoMobile;
                        } else { 
                            this.textContent = numeroSelecionadoMobile; 
                            this.classList.remove('cortado'); 
                        }
                        removerSelecaoBanco();
                        return;
                    }

                    if (this.textContent === '') return; 
                    if (this.dataset.pos && this.dataset.pos.endsWith('1')) {
                        if (!this.classList.contains('cortado')) this.classList.add('cortado');
                        else { this.textContent = ''; this.classList.remove('cortado'); }
                    } else { this.textContent = ''; this.classList.remove('cortado'); }
                });
            });
        }

        function limparQuadro() {
            jogoTravado = false; 
            removerSelecaoBanco();
            document.querySelectorAll('.dropzone, .reserva-zone').forEach(z => { z.textContent = ''; z.classList.remove('cortado'); });
            document.getElementById('mensagem').textContent = '';
        }

        function restaurarBotoes() {
            document.getElementById('btn-conferir').disabled = false;
            document.getElementById('btn-conferir').style.display = 'inline-block';
            document.getElementById('btn-pular').style.display = 'inline-block';
            document.getElementById('btn-novo').style.display = 'none';
        }

        function mudarModo() {
            const modo = document.getElementById('seletor-modo').value;
            if (modo === 'auto') {
                document.getElementById('painel-auto').style.display = 'flex';
                document.getElementById('painel-manual').style.display = 'none';
                gerarNovoDesafioAuto();
            } else {
                document.getElementById('painel-auto').style.display = 'none';
                document.getElementById('painel-manual').style.display = 'flex';
                prepararModoManual();
            }
        }

        function gerarNovoDesafioAuto() {
            limparQuadro(); restaurarBotoes();
            const nivel = document.getElementById('seletor-nivel').value;
            const op = document.getElementById('seletor-op').value;
            
            let geradorN1 = (n) => {
                if(n==="1") return Math.floor(Math.random() * 90) + 10; 
                if(n==="2") return Math.floor(Math.random() * 900) + 100; 
                if(n==="3") return Math.floor(Math.random() * 9000) + 1000; 
                return Math.floor(Math.random() * 900000) + 100000; 
            };
            
            let geradorN2 = (n) => {
                if(n==="1") return Math.floor(Math.random() * 99) + 1; 
                if(n==="2") return Math.floor(Math.random() * 999) + 1; 
                if(n==="3") return Math.floor(Math.random() * 9999) + 1; 
                return Math.floor(Math.random() * 999999) + 1; 
            };

            let n1 = geradorN1(nivel);
            let n2 = geradorN2(nivel);

            if (op === '-' && n2 > n1) { let temp = n1; n1 = n2; n2 = temp; }

            desafioAtual = { num1: n1, num2: n2, operacao: op, resultado: op === '+' ? n1 + n2 : n1 - n2 };
            document.getElementById('desafio-texto').textContent = `${n1.toLocaleString('pt-BR')} ${op} ${n2.toLocaleString('pt-BR')}`;
            document.getElementById('sinal-operacao').textContent = op;
            iniciarCronometro();
        }

        function prepararModoManual() {
            limparQuadro(); restaurarBotoes(); pararCronometro();
            document.getElementById('tempo').textContent = "00:00";
            document.getElementById('desafio-texto').textContent = "Aguardando...";
            document.getElementById('sinal-operacao').textContent = "?";
            document.getElementById('manual-n1').value = '';
            document.getElementById('manual-n2').value = '';
            desafioAtual = null; 
        }

        function iniciarDesafioManual() {
            let n1 = parseInt(document.getElementById('manual-n1').value);
            let n2 = parseInt(document.getElementById('manual-n2').value);
            let op = document.getElementById('manual-op').value;

            if (isNaN(n1) || isNaN(n2)) { alert("Digite os dois números da conta!"); return; }
            if (op === '-' && n2 > n1) { alert("Na subtração, o primeiro número deve ser maior ou igual ao segundo!"); return; }

            limparQuadro(); restaurarBotoes();
            desafioAtual = { num1: n1, num2: n2, operacao: op, resultado: op === '+' ? n1 + n2 : n1 - n2 };
            document.getElementById('desafio-texto').textContent = `${n1.toLocaleString('pt-BR')} ${op} ${n2.toLocaleString('pt-BR')}`;
            document.getElementById('sinal-operacao').textContent = op;
            iniciarCronometro(); 
        }

        function acaoPular() {
            const modo = document.getElementById('seletor-modo').value;
            if (modo === 'auto') gerarNovoDesafioAuto();
            else prepararModoManual(); 
        }

        function acaoProximo() { acaoPular(); }

        // NOVA FUNÇÃO LER LINHA COMPLETA COM VALOR POSICIONAL TRAVADO E 8 ORDENS
        function lerLinhaCompleta(sufixo) {
            let ler = p => document.querySelector(`[data-pos="${p}"]`).textContent;
            
            let dmi = ler('dmi'+sufixo);
            let umi = ler('umi'+sufixo);
            let cm = ler('cm'+sufixo);
            let dm = ler('dm'+sufixo);
            let um = ler('um'+sufixo);
            let c = ler('c'+sufixo);
            let d = ler('d'+sufixo);
            let u = ler('u'+sufixo);

            // Verifica se o aluno deixou a linha inteira em branco
            if (dmi === '' && umi === '' && cm === '' && dm === '' && um === '' && c === '' && d === '' && u === '') {
                return NaN;
            }

            // Se o aluno deixar casinhas vazias no meio ou na direita, elas viram "0" automaticamente.
            // Exemplo: se ele colocar 6 na C e 8 na D, o U fica como 0, virando "680" na leitura do sistema.
            let val = (dmi || '0') + (umi || '0') + (cm || '0') + (dm || '0') + (um || '0') + (c || '0') + (d || '0') + (u || '0');
            
            return parseInt(val, 10);
        }

        function conferirResposta() {
            if (!desafioAtual || jogoTravado) return; 
            
            const msg = document.getElementById('mensagem');
            removerSelecaoBanco(); 
            
            let val1 = lerLinhaCompleta('1'), val2 = lerLinhaCompleta('2'), resAluno = lerLinhaCompleta('r');

            if (isNaN(val1) || isNaN(val2) || isNaN(resAluno)) {
                tocarSom('erro'); msg.textContent = "Arme e coloque o resultado antes!"; msg.className = "erro"; return;
            }

            let termosCorretos = false;
            if (desafioAtual.operacao === '+') {
                if ((val1 === desafioAtual.num1 && val2 === desafioAtual.num2) || 
                    (val1 === desafioAtual.num2 && val2 === desafioAtual.num1)) {
                    termosCorretos = true;
                }
            } else {
                if (val1 === desafioAtual.num1 && val2 === desafioAtual.num2) {
                    termosCorretos = true;
                }
            }

            if (!termosCorretos) {
                tocarSom('erro'); msg.textContent = "Use os números certos nas casinhas corretas (verifique as ordens)!"; msg.className = "erro"; return;
            }

            if (resAluno === desafioAtual.resultado) {
                pararCronometro(); tocarSom('acerto'); lancarConfetes();
                msg.textContent = "🎉 CORRETO! Chame o professor. 🎉"; msg.className = "sucesso";
                pontos += 10; document.getElementById('pontuacao').textContent = pontos;
                
                jogoTravado = true; 

                document.getElementById('btn-conferir').disabled = true;
                document.getElementById('btn-conferir').style.display = 'none';
                document.getElementById('btn-pular').style.display = 'none';
                document.getElementById('btn-novo').style.display = 'inline-block';
            } else {
                tocarSom('erro'); msg.textContent = "Ops! Verifique o cálculo. Cuidado com a reserva!"; msg.className = "erro";
            }
        }

        criarBancoNumeros();
        configurarDropzones();
        gerarNovoDesafioAuto();
    </script>
</body>
