<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedição Corpo Humano</title>
<meta name="description" content="Jogo de Ciências para o 6º ano: níveis de organização, sistema nervoso, visão e lentes corretivas, ossos e músculos. Habilidades MS.EF06CI06, MS.EF06CI07, MS.EF06CI08 e MS.EF06CI09.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>

:root{
  --agua:#0B5563; --agua2:#0E7490; --agua-claro:#CFF0F2; --mata:#2F6B2A; --mata2:#4D8B31; --ipe:#F5B700; --ipe-e:#C78F00;
  --terra:#9A3412; --creme:#FFFBF0; --borda:#E6DABC; --tinta:#1B2A26; --suave:#56645E;
  --ok:#15803D; --ok-f:#DCFCE7; --erro:#DC2626; --erro-f:#FEE2E2;
  --titulo:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --texto:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;font-family:var(--texto);font-size:17px;color:var(--tinta);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,#E3F4EE 0%,#F6F1DF 100%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.btn{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .12s;text-decoration:none;color:var(--tinta)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ipe{background:var(--ipe);border-color:var(--ipe-e);box-shadow:0 4px 0 var(--ipe-e)}
.btn.agua{background:var(--agua2);border-color:var(--agua);color:#fff;box-shadow:0 4px 0 var(--agua)}
.btn.grande{font-size:20px;padding:16px 26px;font-family:var(--titulo)}
.btn.icone{padding:10px 14px}
.selo{display:inline-block;font-family:var(--titulo);font-weight:800;letter-spacing:2px;font-size:12px;color:var(--terra);background:#9A341214;padding:5px 12px;border-radius:30px}

/* HOME */
.home{max-width:1100px;margin:auto;padding:22px 20px 34px}
.voltar-plat{font-weight:700;color:var(--agua);text-decoration:none;font-size:15px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;margin-top:10px}
.hero h1{font-size:clamp(44px,7vw,76px);font-weight:800;margin:12px 0 8px;letter-spacing:-1px;color:var(--agua)}
.hero h1 span{color:var(--mata2)}
.lead{font-size:19px;line-height:1.6;max-width:540px;margin:0 0 16px;color:#34463F}
.campos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;color:var(--suave)}
.campos input{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:10px 12px;width:190px;font-size:17px}
.campos label:last-child input{width:110px}
.acoes{display:flex;flex-wrap:wrap;gap:10px}
.cena{border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 40px #0b556333}
.cena svg{display:block;width:100%;height:auto}
.info{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.info div{flex:1;min-width:150px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--suave)}
.info b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.rodape{font-size:13px;color:var(--suave);line-height:1.6;margin-top:12px}

/* TOPO */
.topo{position:sticky;top:0;z-index:25;background:#F2F8F2ee;backdrop-filter:blur(6px);border-bottom:2px solid #CFE3D6;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topo .tit{flex:1;min-width:0}
.topo h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{color:var(--suave);font-size:13px}
.topo .btn{min-height:42px;padding:8px 12px}
.chip-topo{font-family:var(--titulo);font-weight:800;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:6px 12px;white-space:nowrap}

/* MAPA */
.mapa{max-width:1000px;margin:auto;padding:22px 16px 40px}
.missoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.missao{position:relative;text-align:left;background:#fff;border:3px solid var(--borda);border-radius:22px;padding:18px;min-height:210px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.missao:hover:not(:disabled){transform:translateY(-3px)}
.missao:disabled{opacity:.5;cursor:not-allowed}
.missao .ic{font-size:40px;line-height:1}
.missao .num{font-family:var(--titulo);font-weight:800;color:var(--terra);letter-spacing:1px;font-size:14px}
.missao h3{font-size:24px}
.missao p{margin:0;color:var(--suave);font-size:15px}
.missao .hab{font-size:12px;color:var(--suave)}
.missao .est{margin-top:auto;font-size:22px;letter-spacing:3px;color:#E2D8C2}
.missao .est .on{color:var(--ipe)}
.missao .cad{position:absolute;top:14px;right:16px;font-size:20px}
.missao.atual{border-color:var(--mata2);box-shadow:0 0 0 4px #4D8B3133}
.nota{color:var(--suave);font-size:13px;margin-top:16px;line-height:1.5}

/* JOGO */
.jogo{max-width:880px;margin:auto;padding:14px 16px 40px}
.barra{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--suave)}
.trilho{flex:1;height:10px;border-radius:10px;background:#D9E7DD;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--mata2);transition:width .3s}
.painel{background:var(--creme);border:3px solid var(--borda);border-radius:22px;padding:18px}
.enunciado{font-family:var(--titulo);font-size:22px;margin:0 0 4px}
.legenda{font-size:14px;color:var(--suave);margin:0 0 12px}

/* cadeia */
.cadeia{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.elo{width:118px;min-height:118px;border-radius:16px;border:3px dashed #B9CBBE;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.elo .em{font-size:38px;line-height:1.1}
.elo.sol{border-style:solid;border-color:#F6D776;background:#FFF8DA}
.elo.cheio{border-style:solid;border-color:var(--agua2)}
.elo.certo{border-color:var(--ok);background:var(--ok-f)}
.elo.errado{border-color:var(--erro);background:var(--erro-f);animation:treme .3s}
.elo .papel{font-size:11px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.3px}
.elo .vz{font-size:30px;color:#B9CBBE}
.seta{display:flex;align-items:center;font-size:26px;color:var(--agua2);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;border-radius:18px;background:#EEF6F0;border:2px solid #D3E6D8}
.carta{width:118px;min-height:110px;border-radius:16px;border:2px solid var(--borda);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-weight:700;font-size:14px;line-height:1.2;text-align:center;box-shadow:0 4px 0 #E2D6BB;transition:transform .1s}
.carta .em{font-size:38px;line-height:1.1}
.carta:hover:not(:disabled){transform:translateY(-3px)}
.carta:disabled{visibility:hidden}
.decomp{margin-top:12px;font-size:15px;background:#F3EBDD;border-radius:12px;padding:10px 12px}
@keyframes treme{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* classificar / situação */
.ficha{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--borda);border-radius:18px;padding:18px;margin-bottom:14px}
.ficha .em{font-size:56px;line-height:1;flex:none}
.ficha .txt{font-size:clamp(20px,3vw,25px);font-weight:700;line-height:1.35}
.biomas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bioma{border:0;border-radius:16px;padding:14px 10px;color:#fff;font-family:var(--titulo);font-weight:800;font-size:22px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 #0003;transition:transform .1s}
.bioma small{font-family:var(--texto);font-weight:400;font-size:12px;opacity:.9}
.bioma:hover:not(:disabled){transform:translateY(-3px)}
.bioma.p{background:var(--agua2)}.bioma.c{background:#B45309}.bioma.d{background:var(--mata)}
.bioma:disabled{opacity:.4;cursor:default}
.bioma.marcado{opacity:1;outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
.contexto{background:#E6F2F4;border-left:6px solid var(--agua2);border-radius:0 16px 16px 0;padding:14px 16px;margin-bottom:12px;font-size:18px;line-height:1.5}
.contexto b.ev{display:block;font-family:var(--titulo);font-size:21px;color:var(--agua);margin-bottom:2px}
.teia{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:15px}
.teia span{background:#fff;border:1.5px solid #B7D3DA;border-radius:10px;padding:2px 8px;white-space:nowrap}
.pergunta{font-family:var(--titulo);font-size:21px;margin:6px 0 10px}
.opcoes{display:grid;gap:8px}
.op{text-align:left;border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.op b{flex:none;width:28px;height:28px;border-radius:8px;background:#EEF6F0;display:grid;place-items:center;font-family:var(--titulo)}
.op:hover:not(:disabled){border-color:var(--agua2)}
.op.certa{border-color:var(--ok);background:var(--ok-f)}
.op.errada{border-color:var(--erro);background:var(--erro-f);text-decoration:line-through;opacity:.8}
.op:disabled{cursor:default}
.retorno{margin-top:14px;border-radius:16px;padding:14px 16px;line-height:1.55;border:2px solid var(--borda);background:#fff}
.retorno.ok{border-color:#86EFAC;background:#F0FDF4}
.retorno.no{border-color:#FCA5A5;background:#FFF5F5}
.retorno .t{display:block;font-family:var(--titulo);font-size:21px;margin-bottom:4px}
.seguir{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:#0b2a2ab8;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--creme);border-radius:24px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:24px;border:3px solid var(--borda);box-shadow:0 30px 80px #0006}
.modal h2{font-size:30px;margin-bottom:8px}
.modal p{line-height:1.6;margin:8px 0}
.modal .acoes{margin-top:18px}
.lista{display:grid;gap:8px;margin-top:10px}
.lista div{background:#fff;border:2px solid var(--borda);border-radius:12px;padding:9px 12px;line-height:1.45}
.mini{font-size:13px;color:var(--suave)}
.big-est{font-size:58px;letter-spacing:8px;text-align:center}
.big-est span{display:inline-block;color:#E2D8C2;opacity:0;transform:scale(.4);animation:surge .5s forwards}
.big-est span.on{color:var(--ipe)}
.big-est span:nth-child(2){animation-delay:.25s}.big-est span:nth-child(3){animation-delay:.5s}
@keyframes surge{to{opacity:1;transform:scale(1)}}
.resumo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.resumo div{background:#fff;border:2px solid var(--borda);border-radius:14px;padding:8px 14px;text-align:center;font-size:13px;color:var(--suave)}
.resumo b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.cfg-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 14px;margin:8px 0}
.cfg-linha small{display:block;color:var(--suave);font-size:13px}
.troca{position:relative;width:56px;height:32px;flex:none;border-radius:20px;border:0;background:#D6CAB5}
.troca::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.troca[aria-checked="true"]{background:var(--ok)}
.troca[aria-checked="true"]::after{left:28px}

/* RELATÓRIO */
.pg{max-width:860px;margin:auto;padding:20px 16px 40px}
.cartao{background:#fff;border:3px solid var(--borda);border-radius:20px;padding:18px;margin-bottom:16px}
.cartao h3{font-size:22px;margin-bottom:10px}
.cat{display:grid;grid-template-columns:minmax(190px,1.3fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}
.cat:last-child{border-bottom:0}
.bar{height:14px;border-radius:10px;background:#EEE6D3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--mata2)}
.cat .n{font-weight:700;white-space:nowrap}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:60;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .cena{order:-1}
  .topo{padding:8px 10px;gap:6px}
  .topo small{display:none}
  .topo h2{font-size:17px}
  .chip-topo{padding:4px 8px;font-size:14px}
  .elo,.carta{width:96px;min-height:96px;font-size:13px}
  .elo .em,.carta .em{font-size:30px}
  .seta{font-size:20px}
  .biomas{grid-template-columns:1fr}
  .bioma{min-height:60px;flex-direction:row;gap:10px;font-size:20px}
  .ficha{padding:14px;gap:12px}
  .ficha .em{font-size:44px}
  .cat{grid-template-columns:1fr auto}
  .cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--agua:#9F1239;--agua2:#BE123C;--mata2:#0F766E;--terra:#0F766E}
body{background:linear-gradient(180deg,#FFE4E6 0%,#F7F3EA 100%)}
.topo{background:#FFF1F2ee;border-bottom-color:#FBCFD6}
.trilho{background:#FBD5DB}
.bar i{background:var(--agua2)}
.voltar-plat{color:var(--agua2)}
.selo{background:#0F766E14}
.pool{background:#FFF1F2;border-color:#FBCFD6}
.pool[hidden]{display:none}
.elo .vz{color:#E8B4BD}
.elo{border-color:#E8B4BD}
.escala{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--suave);max-width:640px;margin:0 auto -4px}

.figura{background:#fff;border:2px solid var(--borda);border-radius:18px;padding:10px;margin-bottom:14px}
.figura svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}
.figura .leg{text-align:center;font-size:15px;color:var(--suave);margin:4px 0 0}
.dim{opacity:.28}
.dest{stroke:#F5B700!important;stroke-width:6!important;animation:pisca 1.1s ease-in-out infinite}
@keyframes pisca{50%{stroke:#FDE68A}}
.lado{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center}
.lado svg{width:100%;height:auto;display:block}

.niveis{display:flex;flex-wrap:wrap;gap:8px}
.niveis .op{flex:1 1 120px;justify-content:center;font-weight:700}
.sn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sn button{border:0;border-radius:16px;min-height:80px;color:#fff;font-family:var(--titulo);font-weight:800;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #0003;padding:6px}
.sn button small{font-family:var(--texto);font-weight:400;font-size:13px;opacity:.95}
.sn .sim{background:#0F766E}.sn .nao{background:#BE123C}
.sn button:disabled{opacity:.4;cursor:default}
.sn button.marcado{opacity:1;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--ok)}
.metodos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metodo{border:2px solid var(--borda);background:#fff;border-radius:16px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;transition:transform .1s}
.metodo .em{font-size:32px;flex:none}
.metodo small{display:block;font-weight:400;color:var(--suave);font-size:13px}
.metodo:hover:not(:disabled){transform:translateY(-3px);border-color:var(--agua2)}
.metodo.certa{border-color:var(--ok);background:var(--ok-f)}
.metodo.errada{border-color:var(--erro);background:var(--erro-f);opacity:.75}
.metodo:disabled{cursor:default}
.paciente{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--borda);border-radius:18px;padding:16px;margin-bottom:14px}
.paciente .em{font-size:52px;line-height:1;flex:none}
.paciente b{font-family:var(--titulo);font-size:21px;display:block}
.paciente p{margin:4px 0 0;font-size:18px;line-height:1.45}
@media (max-width:820px){
  .metodos{grid-template-columns:1fr}
  .escala{display:none}
  .lado{grid-template-columns:110px 1fr}
  .paciente .em{font-size:40px}
  .paciente p{font-size:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   EXPEDIÇÃO CORPO HUMANO — JRM • Aventuras Educativas
   Ciências · 6º ano
   MS.EF06CI06 níveis de organização (com MS.EF06CI05)
   MS.EF06CI07 sistema nervoso: coordenação, atos reflexos
   MS.EF06CI08 visão: partes do olho, defeitos e lentes
   MS.EF06CI09 ossos, músculos e sistema nervoso no movimento
   ========================================================= */

/* ---------- MISSÃO 1: níveis de organização ---------- */
const NIVEIS = ['Célula','Tecido','Órgão','Sistema','Organismo'];
const CADEIAS = [
  {p:[['🔬','Célula muscular cardíaca'],['🔬','Tecido muscular cardíaco'],['🫀','Coração'],['🩸','Sistema cardio\u00ADvascular'],['🧍','Ser humano']], x:'As células do coração formam um tecido que se contrai sozinho. O coração bombeia o sangue pelo sistema cardiovascular.'},
  {p:[['🔬','Neurônio'],['🔬','Tecido nervoso'],['🧠','Encéfalo'],['⚡','Sistema nervoso'],['🧍','Ser humano']], x:'O neurônio é a célula que conduz as mensagens nervosas. Milhões deles formam o tecido nervoso do encéfalo.'},
  {p:[['🔬','Célula óssea'],['🔬','Tecido ósseo'],['🦴','Fêmur (osso da coxa)'],['🩻','Sistema esquelético'],['🧍','Ser humano']], x:'Cada osso é um órgão. O fêmur é o maior osso do corpo humano.'},
  {p:[['🔬','Célula do pulmão'],['🔬','Tecido epitelial'],['🫁','Pulmão'],['🌬️','Sistema respiratório'],['🧍','Ser humano']], x:'O pulmão tem milhões de alvéolos, revestidos por um tecido bem fino por onde o oxigênio passa para o sangue.'},
  {p:[['🔬','Fibra muscular'],['🔬','Tecido muscular esque\u00ADlético'],['💪','Bíceps'],['🏋️','Sistema muscular'],['🧍','Ser humano']], x:'A fibra muscular é uma célula comprida que se contrai. Juntas, elas formam os músculos que movem o esqueleto.'}
];

/* ---------- MISSÃO 2: sistema nervoso ---------- */
const SN = {
  cerebro:{n:'Cérebro', e:'🧠', d:'pensamento, memória, fala e movimentos que você decide fazer'},
  cerebelo:{n:'Cerebelo', e:'🤸', d:'equilíbrio e coordenação dos movimentos'},
  tronco:{n:'Tronco encefálico', e:'💓', d:'respiração, batimentos do coração e outras funções automáticas'},
  medula:{n:'Medula espinal', e:'⚡', d:'leva mensagens entre o corpo e o encéfalo e comanda reflexos rápidos'}
};

/* Olho em corte lateral. o = {dest:parte, foco:'normal'|'antes'|'depois'|'astig', lente:'div'|'conv'|'cil'} */
function olho(o={}){
  const cx=195, cy=100, R=78, RET=269, CRI=148;
  const d=k=>o.dest?(o.dest===k?' dest':' dim'):'';
  let raios=''; const A=15, dy=A-A*(RET-CRI)/(330-CRI);
  if(o.foco){
    const k = o.lente==='div'?1.25 : o.lente==='conv'?0.8 : 1;
    const ys=[100-A,100,100+A];
    ys.forEach((y0,i)=>{
      let xf;
      if(o.lente) xf=RET;
      else if(o.foco==='antes') xf=226;
      else if(o.foco==='depois') xf=330;
      else if(o.foco==='astig') xf=[232,255,RET][i];
      else xf=RET;
      const xl = o.lente?58:CRI;
      let pts=`0,${y0} ${xl},${y0}`;
      const ya = o.lente? 100+(y0-100)*k : y0;
      if(o.lente) pts+=` ${CRI},${ya}`;
      let fim;
      if(xf<=RET){ const yEnd = 100+(100-ya)*(RET-xf)/(xf-CRI); fim=`${xf},100 ${RET},${yEnd}`; }
      else { const yEnd = ya+(100-ya)*(RET-CRI)/(xf-CRI); fim=`${RET},${yEnd}`; }
      raios+=`<polyline points="${pts} ${fim}" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linejoin="round"/>`;
    });
    if(o.lente||o.foco==='normal') raios+=`<circle cx="${RET}" cy="100" r="6" fill="#16A34A" stroke="#fff" stroke-width="2"/>`;
    else if(o.foco==='antes') raios+=`<circle cx="226" cy="100" r="5" fill="#DC2626"/>`;
    else if(o.foco==='astig') raios+=`<circle cx="232" cy="100" r="4" fill="#DC2626"/><circle cx="255" cy="100" r="4" fill="#DC2626"/>`;
    else if(o.foco==='depois') raios+=`<g fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4"><line x1="${RET}" y1="${100+dy}" x2="318" y2="100"/><line x1="${RET}" y1="${100-dy}" x2="318" y2="100"/></g><circle cx="318" cy="100" r="5" fill="#DC2626"/>`;
  }
  let oculos='';
  if(o.lente==='div') oculos=`<path d="M48 52 Q60 100 48 148 H68 Q56 100 68 52Z" fill="#BAE6FD" stroke="#0369A1" stroke-width="2.5"/>`;
  else if(o.lente==='conv') oculos=`<path d="M58 50 Q78 100 58 150 Q38 100 58 50Z" fill="#BAE6FD" stroke="#0369A1" stroke-width="2.5"/>`;
  else if(o.lente==='cil') oculos=`<rect x="50" y="52" width="16" height="96" rx="8" fill="#BAE6FD" stroke="#0369A1" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 330 200" role="img" aria-label="Desenho do olho em corte">
    <path class="${d('nervo').trim()}" d="M262 90 L326 84 L326 118 L262 110Z" fill="#FCD34D" stroke="#B45309" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="#FFF7F8" stroke="#F4A3B4" stroke-width="4" class="${o.dest?'dim':''}"/>
    <path class="${d('retina').trim()}" d="M236 37 A74 74 0 0 1 236 163" fill="none" stroke="#E11D48" stroke-width="7" stroke-linecap="round"/>
    <path class="${d('cornea').trim()}" d="M136 46 Q78 100 136 154" fill="#E0F2FE" fill-opacity=".6" stroke="#38BDF8" stroke-width="4"/>
    <g class="${d('iris').trim()}" fill="#A16207" stroke="#713F12" stroke-width="2"><rect x="127" y="56" width="9" height="24" rx="3"/><rect x="127" y="120" width="9" height="24" rx="3"/></g>
    <rect class="${d('pupila').trim()}" x="128" y="81" width="7" height="38" rx="3" fill="#111827" stroke="#111827" stroke-width="1"/>
    <ellipse class="${d('cristalino').trim()}" cx="${CRI}" cy="100" rx="11" ry="31" fill="#FDE68A" fill-opacity=".8" stroke="#D97706" stroke-width="2.5"/>
    ${oculos}${raios}
  </svg>`;
}
/* Encéfalo e medula, vista lateral simplificada */

      <span class="est">${[0,1,2].map(i=>`<span class="${i<(r.estrelas||0)?'on':''}">★</span>`).join('')}</span></button>`; }).join('')}</div>
  <p class="nota">Complete uma missão para liberar a próxima. Professor(a): em ⚙️ dá para liberar todas.</p></section>`;
}

/* ---------- MISSÃO ---------- */
let M=null;
function iniciar(idx){
  const m=MISSOES[idx]; let itens;
  if(m.tipo==='niveis') itens=embaralhar(CADEIAS).map(c=>({...c, alvo:Math.floor(Math.random()*4)}));
  else if(m.tipo==='nervoso') itens=embaralhar(ATOS).slice(0,10).map(a=>({...a, ordem:embaralhar(Object.keys(SN))}));
  else if(m.tipo==='olho') itens=[...embaralhar(Object.keys(PARTES)).map(k=>({tipo:'parte', k, ops:embaralhar([k,...embaralhar(Object.keys(PARTES).filter(x=>x!==k)).slice(0,3)])})),
                                  ...embaralhar(PACIENTES).map(p=>({...p, tipo:'paciente', etapa:'diag'}))];
  else itens=embaralhar(MOV).slice(0,10).map(q=>({...q, ordem:embaralhar(q.o.map((_,j)=>j))}));
  M={m, itens, i:0, ok:0, total:0, primeira:{}};
  telaMissao();
  const intro={
    niveis:`<p>O corpo humano é organizado em <b>níveis</b>, do menor para o maior:</p><div class="lista"><div>🔬 <b>Célula</b>: a menor unidade com vida.</div><div>🔬 <b>Tecido</b>: um grupo de células parecidas que fazem o mesmo trabalho.</div><div>🫀 <b>Órgão</b>: tecidos diferentes juntos, com uma função (coração, pulmão…).</div><div>🩸 <b>Sistema</b>: órgãos que trabalham juntos.</div><div>🧍 <b>Organismo</b>: o ser vivo completo.</div></div><p class="mini">Toque nas cartas na ordem, do menor para o maior.</p>`,
    nervoso:`<div class="lado"><div>${encefalo()}</div><div class="lista" style="margin:0">${Object.values(SN).map(s=>`<div>${s.e} <b>${s.n}</b>: ${s.d}.</div>`).join('')}</div></div><p><b>Voluntário</b>: você decide fazer. <b>Involuntário</b>: acontece sozinho, como os reflexos.</p>`,
    olho:`<p>Primeiro, conheça as partes do olho. Depois, atenda os pacientes: descubra o problema de visão e escolha a lente certa.</p><div class="figura">${olho({foco:'normal'})}<p class="leg">A luz entra pela pupila, o cristalino foca e a imagem se forma na retina.</p></div>`,
    mov:`<p>Para o corpo se mexer, três sistemas trabalham juntos:</p><div class="lista"><div>⚡ <b>Nervoso</b>: dá a ordem.</div><div>💪 <b>Muscular</b>: contrai e puxa.</div><div>🦴 <b>Esquelético</b>: sustenta, protege e é puxado pelos músculos.</div></div>`
  }[m.tipo];
  abrirModal(`<span class="selo">MISSÃO ${m.idx+1} · ${m.hab}</span><h2 style="margin-top:10px">${m.ic} ${esc(m.titulo)}</h2>${intro}<div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Vamos lá! 🧭</button></div>`);
}
function registrar(chave, cat, ok){
  if(M.primeira[chave]!=null) return; M.primeira[chave]=ok; M.total++; if(ok) M.ok++;
  S.stats[cat]=S.stats[cat]||{ok:0,total:0}; S.stats[cat].total++; if(ok) S.stats[cat].ok++; salvar();
}
function telaMissao(){
  const m=M.m;
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="mapa" aria-label="Voltar">←</button><div class="tit"><h2>${m.ic} ${esc(m.titulo)}</h2><small>Missão ${m.idx+1} · ${m.hab}</small></div><button class="btn icone" data-acao="config" aria-label="Configurações">⚙️</button></header>
  <section class="jogo"><div class="barra"><span id="cont"></span><div class="trilho"><i id="trilho"></i></div></div><div class="painel" id="area"></div></section>`;
  desenhar();
}
function desenhar(){
  $('#cont').textContent=`${M.i+1}/${M.itens.length}`; $('#trilho').style.width=(100*M.i/M.itens.length)+'%';
  ({niveis:desenharNiveis, nervoso:desenharNervoso, olho:desenharOlho, mov:desenharMov})[M.m.tipo]();
  const b=$('[data-acao="seguir"]'); if(b) b.focus();
}
function botaoSeguir(){ return `<div class="seguir"><button class="btn agua" data-acao="seguir">${M.i<M.itens.length-1?'Próximo ➔':'Concluir missão ✔'}</button></div>`; }
function seguir(){ M.i++; if(M.i>=M.itens.length) return concluir(); desenhar(); window.scrollTo(0,0); }
const item=()=>M.itens[M.i];

/* --- 1. níveis --- */
function desenharNiveis(){
  const it=item();
  if(!it.pool){ it.pool=embaralhar([0,1,2,3,4]); it.slots=[null,null,null,null,null]; it.estado='montar'; it.erradas=[]; }
  const montado=it.estado!=='montar';
  const elos=it.slots.map((s,k)=>{ const cls=['elo', s!=null?'cheio':'', montado?'certo':'', it.erradas.includes(k)?'errado':''].filter(Boolean).join(' ');
    return `${k?'<span class="seta" aria-hidden="true">→</span>':''}<button class="${cls}" data-slot="${k}" ${montado?'disabled':''} aria-label="Posição ${k+1}${s!=null?': '+it.p[s][1]:': vazia'}">
      ${s!=null?`<span class="em">${it.p[s][0]}</span>${esc(it.p[s][1])}${it.estado==='fim'?`<span class="papel">${NIVEIS[s]}</span>`:''}`:'<span class="vz">?</span>'}</button>`; }).join('');
  let baixo='';
  if(it.estado==='montar'){
    baixo=`<div class="pool" aria-label="Cartas" ${it.slots.every(s=>s!=null)?'hidden':''}>${it.pool.map(s=>`<button class="carta" data-carta="${s}" ${it.slots.includes(s)?'disabled':''}><span class="em">${it.p[s][0]}</span>${esc(it.p[s][1])}</button>`).join('')}</div>
      <div id="ret">${it.msg||''}</div>
      <div class="seguir"><button class="btn" data-acao="limpar">↺ Limpar</button><button class="btn agua" data-acao="conferir" ${it.slots.every(s=>s!=null)?'':'disabled'}>✔ Conferir</button></div>`;
  } else if(it.estado==='nivel'){
    baixo=`<div class="retorno ok"><span class="t">✅ Ordem certa!</span>Agora, uma pergunta rápida:</div>
      <p class="pergunta">${esc(it.p[it.alvo][1])} é um(a)…</p>
      <div class="niveis">${NIVEIS.map((n,j)=>`<button class="op ${(it.errN||[]).includes(j)?'errada':''}" data-nivel="${j}" ${(it.errN||[]).includes(j)?'disabled':''}>${n}</button>`).join('')}</div><div id="ret">${it.msg||''}</div>`;
  } else {
    baixo=`<div class="retorno ok"><span class="t">✅ ${esc(it.p[it.alvo][1])}: ${NIVEIS[it.alvo].toLowerCase()}.</span>${esc(it.x)}</div>${botaoSeguir()}`;
  }
  $('#area').innerHTML=`<p class="enunciado">${montado?'Do menor para o maior':'Monte do menor para o maior (toque na carta para tirar)'}</p>
    <div class="escala"><span>menor</span><span>maior</span></div><div class="cadeia">${elos}</div>${baixo}`;
}
function colocar(s){ const it=item(); const k=it.slots.indexOf(null); if(k<0) return; it.slots[k]=s; it.erradas=[]; it.msg=''; som('toc'); desenharNiveis(); }
function tirar(k){ const it=item(); if(it.slots[k]==null) return; it.slots[k]=null; it.erradas=[]; it.msg=''; desenharNiveis(); }
function conferir(){
  const it=item(); const err=it.slots.map((s,k)=>s===k?-1:k).filter(k=>k>=0);
  if(!err.length){ registrar('o'+M.i,'ordem',true); som('ok'); it.estado='nivel'; it.msg=''; }
  else { registrar('o'+M.i,'ordem',false); som('erro'); it.erradas=err;
    it.msg=`<div class="retorno no"><span class="t">Quase! ${err.length===1?'Uma carta está':'Algumas cartas estão'} fora do lugar.</span>Lembre: várias <b>células</b> formam um <b>tecido</b>; tecidos formam um <b>órgão</b>; órgãos formam um <b>sistema</b>. Os espaços em vermelho precisam mudar.</div>`; }
  desenharNiveis();
}
function responderNivel(j){ const it=item();
  if(j===it.alvo){ registrar('n'+M.i,'nivel',true); som('ok'); it.estado='fim'; it.msg=''; }
  else { registrar('n'+M.i,'nivel',false); som('erro'); it.errN=(it.errN||[]).concat(j); it.msg=`<div class="retorno no"><span class="t">Não é ${NIVEIS[j].toLowerCase()}.</span>Olhe a posição dessa carta na fileira que você montou.</div>`; }
  desenharNiveis();
}

/* --- 2. sistema nervoso --- */
function desenharNervoso(){
  const it=item(); let baixo='';
  const snB=(dis)=>`<div class="sn"><button class="sim ${dis&&it.v?'marcado':''}" data-sn="1" ${dis?'disabled':''}>Voluntário<small>você decide fazer</small></button><button class="nao ${dis&&!it.v?'marcado':''}" data-sn="0" ${dis?'disabled':''}>Involuntário<small>acontece sozinho</small></button></div>`;
  if(it.v1==null) baixo=`<p class="pergunta">Esse ato é voluntário ou involuntário?</p>${snB(false)}`;
  else {
    const ok1=it.v1===it.v;
    baixo=snB(true)+`<div class="retorno ${ok1?'ok':'no'}" style="margin-bottom:12px"><span class="t">${ok1?'✅ Isso!':'❌ Não é bem assim.'} É ${it.v?'voluntário':'involuntário'}.</span>${it.feito?'':'Agora, quem está no comando?'}</div>`;
    if(!it.feito){
      baixo+=`<p class="pergunta">Que parte do sistema nervoso comanda essa ação?</p><div class="metodos">${it.ordem.map(k=>{ const s=SN[k], er=(it.err||[]).includes(k);
        return `<button class="metodo ${er?'errada':''}" data-sn-parte="${k}" ${er?'disabled':''}><span class="em" aria-hidden="true">${s.e}</span><span>${s.n}<small>${s.d}</small></span></button>`; }).join('')}</div><div id="ret">${it.msg||''}</div>`;
    } else {
      baixo+=`<div class="figura"><div class="lado"><div>${encefalo(it.p)}</div><div><span class="t" style="font-family:var(--titulo);font-size:21px;display:block">${SN[it.p].e} ${SN[it.p].n}</span><p style="margin:4px 0 0;line-height:1.5">${esc(it.x)}</p></div></div></div>${botaoSeguir()}`;
    }
  }
  $('#area').innerHTML=`<p class="enunciado">Observe a ação</p><div class="ficha"><span class="em" aria-hidden="true">${it.e}</span><span class="txt">${esc(it.t)}</span></div>${baixo}`;
}
function responderAto(v){ const it=item(); it.v1=!!v; const ok=it.v1===it.v; registrar('a'+M.i,'ato',ok); som(ok?'ok':'erro'); desenharNervoso(); }
function responderParte(k){ const it=item();
  if(k===it.p){ registrar('p'+M.i,'parte',true); som('ok'); it.feito=true; }
  else { registrar('p'+M.i,'parte',false); som('erro'); it.err=(it.err||[]).concat(k);
    it.msg=`<div class="retorno no"><span class="t">Não é o ${SN[k].n.toLowerCase()}.</span>${it.v?'Pense: essa ação precisa mais de pensamento ou de equilíbrio?':'Pense: é uma resposta rápida de proteção ou uma função automática do corpo?'}</div>`; }
  desenharNervoso();
}

/* --- 3. olho --- */
function desenharOlho(){
  const it=item(); let h='';
  if(it.tipo==='parte'){
    h=`<p class="enunciado">Que parte do olho está piscando?</p><div class="figura">${olho({dest:it.k})}</div>
      <div class="opcoes">${it.ops.map((k,j)=>{ const er=(it.err||[]).includes(k), ok=it.feito&&k===it.k;
        return `<button class="op ${er?'errada':''} ${ok?'certa':''}" data-parte="${k}" ${er||it.feito?'disabled':''}><b>${'ABCD'[j]}</b><span>${PARTES[k].n}</span></button>`; }).join('')}</div>
      <div id="ret">${it.feito?`<div class="retorno ok"><span class="t">✅ ${PARTES[it.k].n}!</span>${esc(PARTES[it.k].f)}</div>${botaoSeguir()}`:(it.msg||'')}</div>`;
  } else {
    const D=DEF[it.d];
    h=`<p class="enunciado">🩺 Paciente na clínica</p><div class="paciente"><span class="em" aria-hidden="true">${it.e}</span><div><b>${esc(it.nome)}</b><p>${esc(it.t)}</p></div></div>`;
    if(it.etapa==='diag'){
      h+=`<p class="pergunta">Qual é o provável problema de visão?</p><div class="opcoes">${Object.keys(DEF).map((k,j)=>{ const er=(it.errD||[]).includes(k);
        return `<button class="op ${er?'errada':''}" data-diag="${k}" ${er?'disabled':''}><b>${'ABCD'[j]}</b><span>${DEF[k].n}</span></button>`; }).join('')}</div><div id="ret">${it.msg||''}</div>`;
    } else if(it.etapa==='lente'){
      h+=`<div class="retorno ok" style="margin:0 0 12px"><span class="t">✅ ${D.n}.</span>Veja o que acontece com a luz no olho de ${esc(it.nome.split(',')[0])}:</div>
        <div class="figura">${olho({foco:D.foco})}<p class="leg">${esc(D.leg)}</p></div>
        <p class="pergunta">Qual lente vai corrigir?</p><div class="metodos">${Object.keys(LENTES).map(k=>{ const L=LENTES[k], er=(it.errL||[]).includes(k);
          return `<button class="metodo ${er?'errada':''}" data-lente="${k}" ${er?'disabled':''}><span class="em" aria-hidden="true" style="font-family:var(--titulo);font-weight:800;color:#0369A1;min-width:36px;text-align:center">${L.e}</span><span>${L.n}<small>${L.d}</small></span></button>`; }).join('')}</div><div id="ret">${it.msg||''}</div>`;
    } else {
      h+=`<div class="figura">${olho({foco:D.foco, lente:D.lente})}<p class="leg">Com a ${LENTES[D.lente].n.toLowerCase()}, a imagem se forma na retina. ✅</p></div>
        <div class="retorno ok"><span class="t">✅ ${LENTES[D.lente].n}!</span>${esc(it.x)}</div>${botaoSeguir()}`;
    }
  }
  $('#area').innerHTML=h;
}
function responderParteOlho(k){ const it=item();
  if(k===it.k){ registrar('e'+M.i,'olho',true); som('ok'); it.feito=true; }
  else { registrar('e'+M.i,'olho',false); som('erro'); it.err=(it.err||[]).concat(k); it.msg=`<div class="retorno no"><span class="t">Não é a ${PARTES[k].n.toLowerCase()}.</span>${esc(PARTES[k].f)}</div>`; }
  desenharOlho();
}
const DICA_DIAG={miopia:'Na miopia, a pessoa vê bem de perto e mal de longe.', hiper:'Na hipermetropia, a pessoa costuma ver bem de longe e ter dificuldade de perto, com cansaço ao ler.', astig:'No astigmatismo, a imagem fica distorcida tanto de perto quanto de longe.', presbi:'A presbiopia aparece com a idade, geralmente depois dos 40 anos.'};
function responderDiag(k){ const it=item();
  if(k===it.d){ registrar('d'+M.i,'diag',true); som('ok'); it.etapa='lente'; it.msg=''; }
  else { registrar('d'+M.i,'diag',false); som('erro'); it.errD=(it.errD||[]).concat(k); it.msg=`<div class="retorno no"><span class="t">Ainda não.</span>${DICA_DIAG[k]} Releia o que o paciente contou: ele vê mal de perto, de longe, ou distorcido?</div>`; }
  desenharOlho();
}
function responderLente(k){ const it=item(), D=DEF[it.d];
  if(k===D.lente){ registrar('l'+M.i,'lente',true); som('ok'); it.etapa='fim'; it.msg=''; }
  else { registrar('l'+M.i,'lente',false); som('erro'); it.errL=(it.errL||[]).concat(k);
    it.msg=`<div class="retorno no"><span class="t">Essa lente não resolve.</span>${D.foco==='antes'?'A luz está se juntando cedo demais, antes da retina. A lente precisa espalhar um pouco a luz.':D.foco==='depois'?'A luz ainda não se juntou quando chega na retina. A lente precisa ajudar a juntar a luz mais cedo.':'A luz está focando em pontos diferentes. A lente precisa compensar a curvatura irregular.'}</div>`; }
  desenharOlho();
}

/* --- 4. movimento --- */
function desenharMov(){
  const it=item();
  $('#area').innerHTML=`<p class="enunciado">Pergunta da expedição</p><div class="ficha"><span class="em" aria-hidden="true">${it.e}</span><span class="txt">${esc(it.t)}</span></div>
    <div class="opcoes">${it.ordem.map((j,pos)=>{ const er=(it.err||[]).includes(j), ok=it.feito&&j===0;
      return `<button class="op ${er?'errada':''} ${ok?'certa':''}" data-mov="${j}" ${er||it.feito?'disabled':''}><b>${'ABCD'[pos]}</b><span>${esc(it.o[j])}</span></button>`; }).join('')}</div>
    <div id="ret">${it.feito?`<div class="retorno ok"><span class="t">✅ Isso mesmo!</span>${esc(it.x)}</div>${botaoSeguir()}`:(it.msg||'')}</div>`;
}
function responderMov(j){ const it=item();
  if(j===0){ registrar('v'+M.i,'mov',true); som('ok'); it.feito=true; }
  else { registrar('v'+M.i,'mov',false); som('erro'); it.err=(it.err||[]).concat(j); it.msg=`<div class="retorno no"><span class="t">Pense de novo.</span>Lembre do trabalho em equipe: o sistema nervoso manda, os músculos puxam e os ossos sustentam.</div>`; }
  desenharMov();
}

function concluir(){
  const acc=M.total? M.ok/M.total : 1; const est=acc>=.9?3:acc>=.7?2:1;
  const m=M.m, a=S.missoes[m.id]||{}; S.missoes[m.id]={feita:true, estrelas:Math.max(a.estrelas||0,est), vezes:(a.vezes||0)+1}; salvar();
  som('fim');
  const prox=m.idx<MISSOES.length-1;
  abrirModal(`<h2 style="text-align:center">Missão concluída! 🧭</h2><div class="big-est">${estrelasHtml(est)}</div>
    <div class="resumo"><div><b>${M.ok}/${M.total}</b>acertos de primeira</div><div><b>${patente().split(' ').slice(1).join(' ')}</b>seu título</div></div>
    <p class="mini" style="text-align:center">3 estrelas: 90% ou mais de primeira · 2 estrelas: 70% ou mais.</p>
    <div class="acoes" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" data-acao="repetir">↻ De novo</button>
      ${prox?'<button class="btn ipe" data-acao="prox" data-foco>Próxima missão ➔</button>':'<button class="btn ipe" data-ir="relatorio" data-foco>📊 Desempenho</button>'}</div>`);
}

/* ---------- RELATÓRIO ---------- */
function linhasRel(){ return Object.keys(CATS).filter(k=>S.stats[k]&&S.stats[k].total).map(k=>({k,nome:CATS[k],ok:S.stats[k].ok,total:S.stats[k].total,pct:Math.round(100*S.stats[k].ok/S.stats[k].total)})); }
function textoRel(){ const L=linhasRel(); const f=MISSOES.filter(m=>(S.missoes[m.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60).map(l=>l.nome);
  return ['EXPEDIÇÃO CORPO HUMANO — Relatório',`Estudante: ${S.nome||'(sem nome)'} · Turma: ${S.turma||'-'} · ${new Date().toLocaleDateString('pt-BR')}`,`Título: ${patente().replace(/^\S+\s/,'')} · Estrelas: ${totalEst()}/${MAXEST} · Missões: ${f}/${MISSOES.length}`,'Acertos na 1ª tentativa:',
    ...(L.length?L.map(l=>`- ${l.nome}: ${l.ok}/${l.total} (${l.pct}%)`):['- (ainda sem dados)']),`Retomar: ${ret.length?ret.join('; '):'nada urgente'}`].join('\n'); }
function telaRelatorio(){
  const L=linhasRel(); const f=MISSOES.filter(m=>(S.missoes[m.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60);
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="home" aria-label="Início">←</button><div class="tit"><h2>Meu desempenho</h2><small>${S.nome?esc(S.nome):'Estudante'}${S.turma?' · '+esc(S.turma):''}</small></div><button class="btn" data-ir="mapa">🧭 Missões</button></header>
  <section class="pg"><div class="resumo" style="justify-content:flex-start"><div><b>${patente()}</b>título</div><div><b>★ ${totalEst()}/${MAXEST}</b>estrelas</div><div><b>${f}/${MISSOES.length}</b>missões</div></div>
    <div class="cartao"><h3>Acertos na 1ª tentativa</h3>${L.length?L.map(l=>`<div class="cat"><span>${esc(l.nome)}</span><div class="bar"><i style="width:${l.pct}%"></i></div><span class="n">${l.ok}/${l.total} · ${l.pct}%</span></div>`).join(''):'<p class="mini">Faça algumas missões para ver seus resultados aqui.</p>'}</div>
    ${ret.length?`<div class="cartao" style="background:#FFF7D6;border-color:#F6D776"><b>Para treinar mais:</b> ${ret.map(l=>esc(l.nome)).join(', ')}.</div>`:''}
    <div class="cartao"><h3>Enviar para o professor</h3><p class="mini">Copie o relatório e cole no grupo da turma ou onde o professor indicar.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn ipe" data-acao="copiar-rel">📋 Copiar relatório</button><button class="btn" data-acao="apagar" id="btn-apagar">🗑️ Apagar meu progresso</button></div></div></section>`;
}

/* ---------- CONFIG / AJUDA ---------- */
function telaConfig(){
  const l=(k,t,d)=>`<div class="cfg-linha"><span>${t}<small>${d}</small></span><button class="troca" role="switch" aria-checked="${!!S.cfg[k]}" data-cfg="${k}" aria-label="${t}"></button></div>`;
  abrirModal(`<h2>Configurações</h2>${l('som','Efeitos sonoros','')}${l('livre','Liberar todas as missões','Para o professor escolher a missão da aula.')}<div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Pronto</button></div>`);
}
function telaAjuda(){
  abrirModal(`<h2>Como jogar</h2><div class="lista">
    <div>🔬 <b>Do pequeno ao grande:</b> toque nas cartas da célula até o organismo, na ordem.</div>
    <div>🧠 <b>Central de comando:</b> diga se a ação é voluntária ou involuntária e que parte do sistema nervoso comanda.</div>
    <div>👁️ <b>Clínica do olhar:</b> reconheça as partes do olho e escolha a lente certa para cada paciente.</div>
    <div>🦴 <b>Corpo em movimento:</b> responda sobre ossos, músculos, articulações e postura.</div>
    <div>⭐ As estrelas contam os acertos de primeira e sobem o seu título na expedição.</div></div>
    <div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Entendi!</button></div>`);
}
function copiar(txt){ const ok=()=>toast('Copiado! 📋'); const fb=()=>{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');ok();}catch(e){toast('Não deu para copiar.');} t.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok).catch(fb); else fb(); }

/* ---------- EVENTOS ---------- */
let armado=false;
document.addEventListener('click',e=>{
  const q=s=>{ const el=e.target.closest(s); return el&&!el.disabled?el:null; };
  let el;
  if(el=e.target.closest('[data-ir]')){ if(modalAberto()) fecharModal(); ir(el.dataset.ir); return; }
  if(el=q('[data-missao]')){ ir('missao',+el.dataset.missao); return; }
  if(el=q('[data-carta]')){ colocar(+el.dataset.carta); return; }
  if(el=q('[data-slot]')){ tirar(+el.dataset.slot); return; }
  if(el=q('[data-nivel]')){ responderNivel(+el.dataset.nivel); return; }
  if(el=q('[data-sn]')){ responderAto(+el.dataset.sn); return; }
  if(el=q('[data-sn-parte]')){ responderParte(el.dataset.snParte); return; }
  if(el=q('[data-parte]')){ responderParteOlho(el.dataset.parte); return; }
  if(el=q('[data-diag]')){ responderDiag(el.dataset.diag); return; }
  if(el=q('[data-lente]')){ responderLente(el.dataset.lente); return; }
  if(el=q('[data-mov]')){ responderMov(+el.dataset.mov); return; }
  if(el=e.target.closest('[data-cfg]')){ const k=el.dataset.cfg; S.cfg[k]=!S.cfg[k]; el.setAttribute('aria-checked',S.cfg[k]); salvar(); if(TELA==='mapa') telaMapa(); return; }
  const ac=q('[data-acao]'); if(!ac) return; const a=ac.dataset.acao;
  if(a==='fechar') fecharModal();
  else if(a==='ajuda') telaAjuda();
  else if(a==='config') telaConfig();
  else if(a==='seguir') seguir();
  else if(a==='conferir') conferir();
  else if(a==='limpar'){ const it=item(); it.slots=it.slots.map(()=>null); it.erradas=[]; it.msg=''; desenharNiveis(); }
  else if(a==='repetir'){ fecharModal(); ir('missao', M.m.idx); }
  else if(a==='prox'){ fecharModal(); ir('missao', M.m.idx+1); }
  else if(a==='copiar-rel') copiar(textoRel());
  else if(a==='apagar'){ if(!armado){ armado=true; ac.textContent='⚠️ Clique de novo para confirmar'; setTimeout(()=>{armado=false; const b=$('#btn-apagar'); if(b) b.textContent='🗑️ Apagar meu progresso';},3500); } else { const c=S.cfg; S=padrao(); S.cfg=c; salvar(); armado=false; toast('Progresso apagado.'); telaRelatorio(); } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modalAberto()) fecharModal(); });

telaHome();
</script>
</body>
</html>
