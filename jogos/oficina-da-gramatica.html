<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina da Gramática</title>
<meta name="description" content="Jogo de Língua Portuguesa do 6º ao 9º ano: classes de palavras, modos verbais, concordância, sujeito e predicado, complementos, vozes verbais, conjunções e regência.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>

:root{
  --agua:#0B5563; --agua2:#0E7490; --agua-claro:#CFF0F2; --mata:#2F6B2A; --mata2:#4D8B31; --ipe:#F5B700; --ipe-e:#C78F00;
  --terra:#9A3412; --creme:#FFFBF0; --borda:#E6DABC; --tinta:#1B2A26; --suave:#56645E;
  --ok:#15803D; --ok-f:#DCFCE7; --erro:#DC2626; --erro-f:#FEE2E2;
  --titulo:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --texto:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;font-family:var(--texto);font-size:17px;color:var(--tinta);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,#E3F4EE 0%,#F6F1DF 100%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.btn{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .12s;text-decoration:none;color:var(--tinta)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ipe{background:var(--ipe);border-color:var(--ipe-e);box-shadow:0 4px 0 var(--ipe-e)}
.btn.agua{background:var(--agua2);border-color:var(--agua);color:#fff;box-shadow:0 4px 0 var(--agua)}
.btn.grande{font-size:20px;padding:16px 26px;font-family:var(--titulo)}
.btn.icone{padding:10px 14px}
.selo{display:inline-block;font-family:var(--titulo);font-weight:800;letter-spacing:2px;font-size:12px;color:var(--terra);background:#9A341214;padding:5px 12px;border-radius:30px}

/* HOME */
.home{max-width:1100px;margin:auto;padding:22px 20px 34px}
.voltar-plat{font-weight:700;color:var(--agua);text-decoration:none;font-size:15px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;margin-top:10px}
.hero h1{font-size:clamp(44px,7vw,76px);font-weight:800;margin:12px 0 8px;letter-spacing:-1px;color:var(--agua)}
.hero h1 span{color:var(--mata2)}
.lead{font-size:19px;line-height:1.6;max-width:540px;margin:0 0 16px;color:#34463F}
.campos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;color:var(--suave)}
.campos input{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:10px 12px;width:190px;font-size:17px}
.campos label:last-child input{width:110px}
.acoes{display:flex;flex-wrap:wrap;gap:10px}
.cena{border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 40px #0b556333}
.cena svg{display:block;width:100%;height:auto}
.info{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.info div{flex:1;min-width:150px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--suave)}
.info b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.rodape{font-size:13px;color:var(--suave);line-height:1.6;margin-top:12px}

/* TOPO */
.topo{position:sticky;top:0;z-index:25;background:#F2F8F2ee;backdrop-filter:blur(6px);border-bottom:2px solid #CFE3D6;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topo .tit{flex:1;min-width:0}
.topo h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{color:var(--suave);font-size:13px}
.topo .btn{min-height:42px;padding:8px 12px}
.chip-topo{font-family:var(--titulo);font-weight:800;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:6px 12px;white-space:nowrap}

/* MAPA */
.mapa{max-width:1000px;margin:auto;padding:22px 16px 40px}
.missoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.missao{position:relative;text-align:left;background:#fff;border:3px solid var(--borda);border-radius:22px;padding:18px;min-height:210px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.missao:hover:not(:disabled){transform:translateY(-3px)}
.missao:disabled{opacity:.5;cursor:not-allowed}
.missao .ic{font-size:40px;line-height:1}
.missao .num{font-family:var(--titulo);font-weight:800;color:var(--terra);letter-spacing:1px;font-size:14px}
.missao h3{font-size:24px}
.missao p{margin:0;color:var(--suave);font-size:15px}
.missao .hab{font-size:12px;color:var(--suave)}
.missao .est{margin-top:auto;font-size:22px;letter-spacing:3px;color:#E2D8C2}
.missao .est .on{color:var(--ipe)}
.missao .cad{position:absolute;top:14px;right:16px;font-size:20px}
.missao.atual{border-color:var(--mata2);box-shadow:0 0 0 4px #4D8B3133}
.nota{color:var(--suave);font-size:13px;margin-top:16px;line-height:1.5}

/* JOGO */
.jogo{max-width:880px;margin:auto;padding:14px 16px 40px}
.barra{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--suave)}
.trilho{flex:1;height:10px;border-radius:10px;background:#D9E7DD;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--mata2);transition:width .3s}
.painel{background:var(--creme);border:3px solid var(--borda);border-radius:22px;padding:18px}
.enunciado{font-family:var(--titulo);font-size:22px;margin:0 0 4px}
.legenda{font-size:14px;color:var(--suave);margin:0 0 12px}

/* cadeia */
.cadeia{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.elo{width:118px;min-height:118px;border-radius:16px;border:3px dashed #B9CBBE;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.elo .em{font-size:38px;line-height:1.1}
.elo.sol{border-style:solid;border-color:#F6D776;background:#FFF8DA}
.elo.cheio{border-style:solid;border-color:var(--agua2)}
.elo.certo{border-color:var(--ok);background:var(--ok-f)}
.elo.errado{border-color:var(--erro);background:var(--erro-f);animation:treme .3s}
.elo .papel{font-size:11px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.3px}
.elo .vz{font-size:30px;color:#B9CBBE}
.seta{display:flex;align-items:center;font-size:26px;color:var(--agua2);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;border-radius:18px;background:#EEF6F0;border:2px solid #D3E6D8}
.carta{width:118px;min-height:110px;border-radius:16px;border:2px solid var(--borda);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-weight:700;font-size:14px;line-height:1.2;text-align:center;box-shadow:0 4px 0 #E2D6BB;transition:transform .1s}
.carta .em{font-size:38px;line-height:1.1}
.carta:hover:not(:disabled){transform:translateY(-3px)}
.carta:disabled{visibility:hidden}
.decomp{margin-top:12px;font-size:15px;background:#F3EBDD;border-radius:12px;padding:10px 12px}
@keyframes treme{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* classificar / situação */
.ficha{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--borda);border-radius:18px;padding:18px;margin-bottom:14px}
.ficha .em{font-size:56px;line-height:1;flex:none}
.ficha .txt{font-size:clamp(20px,3vw,25px);font-weight:700;line-height:1.35}
.biomas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bioma{border:0;border-radius:16px;padding:14px 10px;color:#fff;font-family:var(--titulo);font-weight:800;font-size:22px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 #0003;transition:transform .1s}
.bioma small{font-family:var(--texto);font-weight:400;font-size:12px;opacity:.9}
.bioma:hover:not(:disabled){transform:translateY(-3px)}
.bioma.p{background:var(--agua2)}.bioma.c{background:#B45309}.bioma.d{background:var(--mata)}
.bioma:disabled{opacity:.4;cursor:default}
.bioma.marcado{opacity:1;outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
.contexto{background:#E6F2F4;border-left:6px solid var(--agua2);border-radius:0 16px 16px 0;padding:14px 16px;margin-bottom:12px;font-size:18px;line-height:1.5}
.contexto b.ev{display:block;font-family:var(--titulo);font-size:21px;color:var(--agua);margin-bottom:2px}
.teia{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:15px}
.teia span{background:#fff;border:1.5px solid #B7D3DA;border-radius:10px;padding:2px 8px;white-space:nowrap}
.pergunta{font-family:var(--titulo);font-size:21px;margin:6px 0 10px}
.opcoes{display:grid;gap:8px}
.op{text-align:left;border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.op b{flex:none;width:28px;height:28px;border-radius:8px;background:#EEF6F0;display:grid;place-items:center;font-family:var(--titulo)}
.op:hover:not(:disabled){border-color:var(--agua2)}
.op.certa{border-color:var(--ok);background:var(--ok-f)}
.op.errada{border-color:var(--erro);background:var(--erro-f);text-decoration:line-through;opacity:.8}
.op:disabled{cursor:default}
.retorno{margin-top:14px;border-radius:16px;padding:14px 16px;line-height:1.55;border:2px solid var(--borda);background:#fff}
.retorno.ok{border-color:#86EFAC;background:#F0FDF4}
.retorno.no{border-color:#FCA5A5;background:#FFF5F5}
.retorno .t{display:block;font-family:var(--titulo);font-size:21px;margin-bottom:4px}
.seguir{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:#0b2a2ab8;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--creme);border-radius:24px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:24px;border:3px solid var(--borda);box-shadow:0 30px 80px #0006}
.modal h2{font-size:30px;margin-bottom:8px}
.modal p{line-height:1.6;margin:8px 0}
.modal .acoes{margin-top:18px}
.lista{display:grid;gap:8px;margin-top:10px}
.lista div{background:#fff;border:2px solid var(--borda);border-radius:12px;padding:9px 12px;line-height:1.45}
.mini{font-size:13px;color:var(--suave)}
.big-est{font-size:58px;letter-spacing:8px;text-align:center}
.big-est span{display:inline-block;color:#E2D8C2;opacity:0;transform:scale(.4);animation:surge .5s forwards}
.big-est span.on{color:var(--ipe)}
.big-est span:nth-child(2){animation-delay:.25s}.big-est span:nth-child(3){animation-delay:.5s}
@keyframes surge{to{opacity:1;transform:scale(1)}}
.resumo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.resumo div{background:#fff;border:2px solid var(--borda);border-radius:14px;padding:8px 14px;text-align:center;font-size:13px;color:var(--suave)}
.resumo b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.cfg-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 14px;margin:8px 0}
.cfg-linha small{display:block;color:var(--suave);font-size:13px}
.troca{position:relative;width:56px;height:32px;flex:none;border-radius:20px;border:0;background:#D6CAB5}
.troca::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.troca[aria-checked="true"]{background:var(--ok)}
.troca[aria-checked="true"]::after{left:28px}

/* RELATÓRIO */
.pg{max-width:860px;margin:auto;padding:20px 16px 40px}
.cartao{background:#fff;border:3px solid var(--borda);border-radius:20px;padding:18px;margin-bottom:16px}
.cartao h3{font-size:22px;margin-bottom:10px}
.cat{display:grid;grid-template-columns:minmax(190px,1.3fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}
.cat:last-child{border-bottom:0}
.bar{height:14px;border-radius:10px;background:#EEE6D3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--mata2)}
.cat .n{font-weight:700;white-space:nowrap}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:60;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .cena{order:-1}
  .topo{padding:8px 10px;gap:6px}
  .topo small{display:none}
  .topo h2{font-size:17px}
  .chip-topo{padding:4px 8px;font-size:14px}
  .elo,.carta{width:96px;min-height:96px;font-size:13px}
  .elo .em,.carta .em{font-size:30px}
  .seta{font-size:20px}
  .biomas{grid-template-columns:1fr}
  .bioma{min-height:60px;flex-direction:row;gap:10px;font-size:20px}
  .ficha{padding:14px;gap:12px}
  .ficha .em{font-size:44px}
  .cat{grid-template-columns:1fr auto}
  .cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- motor da matemática ---- */
.enun-linha{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.enun-linha .enunciado{margin:4px 0 0}
.falar{flex:none}
.vis{background:#fff;border:2px solid var(--borda);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center}
.vis svg{max-width:100%;height:auto}
.vis .grande{font-family:var(--titulo);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1.1}
.emojis{display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center;font-size:clamp(30px,6vw,42px);line-height:1.15;max-width:560px}
.emojis .grupo{display:inline-flex;gap:2px;padding:2px 6px;border-radius:12px;background:#F6F1DF}
.emojis .riscado{opacity:.35;position:relative}
.emojis .riscado::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;border-top:4px solid var(--erro);transform:rotate(-30deg)}
.opcoes.grade{grid-template-columns:repeat(4,1fr)}
.opcoes.grade .op{justify-content:center;text-align:center;font-family:var(--titulo);font-weight:800;font-size:clamp(24px,4.4vw,32px);padding:12px 6px;min-height:72px;align-items:center}
.opcoes.grandes .op{font-size:20px}
.resp-num{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px}
.resp-num input{width:180px;max-width:48vw;font-family:var(--titulo);font-weight:800;font-size:30px;text-align:center;border:3px solid var(--agua2);border-radius:14px;padding:4px 10px;background:#F8FFFE}
.resp-num input:disabled{border-color:var(--ok);background:var(--ok-f);color:var(--tinta)}
.resp-num .un{font-family:var(--titulo);font-weight:800;font-size:24px}
.niveis{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.niveis button{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:8px 16px;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.niveis button small{font-weight:400;color:var(--suave);font-size:12px}
.niveis button[aria-checked="true"]{border-color:var(--agua2);background:var(--agua-claro);box-shadow:0 0 0 3px #0E749033}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:800;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor;padding-bottom:2px}
.fr i:last-child{padding-top:2px}
.pot sup{font-size:.6em}
mark{background:#FDE68A;border-radius:4px;padding:0 3px;color:inherit;font-weight:700}
.frase-toque{font-size:clamp(22px,4.6vw,28px);line-height:2.1;margin:0;text-align:center}
.frase-toque .pal{font:inherit;border:2px solid var(--borda);background:#fff;border-radius:10px;padding:0 8px;line-height:1.5;cursor:pointer;color:var(--tinta);transition:transform .1s}
.frase-toque .pal:hover:not(:disabled){transform:translateY(-2px);border-color:var(--agua2)}
.frase-toque .pal.sel{background:var(--agua-claro);border-color:var(--agua2);box-shadow:0 0 0 2px var(--agua2)}
.frase-toque .pal.errada{background:var(--erro-f,#FEE2E2);border-color:var(--erro);text-decoration:line-through}
.frase-toque .pal.certa{background:var(--ok-f);border-color:var(--ok);font-weight:700}
.frase-toque .pal:disabled{cursor:default}
.frase-toque .pont{margin-left:2px}
.frase-toque.junto{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.frase-toque.junto .pal{font-family:var(--titulo);font-weight:800;font-size:clamp(28px,7vw,40px);padding:4px 14px;min-width:64px}
@media (max-width:820px){
  .opcoes.grade{grid-template-columns:repeat(2,1fr)}
}

:root{--agua:#7C2D12;--agua2:#C2410C;--agua-claro:#FFEDD5;--mata2:#0F766E}
body{background:linear-gradient(180deg,#FFEDD5 0%,#F0FDFA 100%)}
.topo{background:#FFF7EDee;border-bottom-color:#FED7AA}
.trilho{background:#FED7AA}
.trilho i,.bar i{background:var(--mata2)}
.missao.atual{border-color:var(--mata2);box-shadow:0 0 0 4px #0F766E33}
.citacao{font-size:clamp(20px,4.4vw,26px);font-weight:700;text-align:center;line-height:1.5;margin:0}
.ficha-cl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ficha-cl span{background:#fff;border:2px solid var(--borda);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   MOTOR DOS JOGOS DE MATEMÁTICA — JRM • Aventuras Educativas
   Cada jogo define o objeto JOGO e chama iniciarJogo().
   ========================================================= */
const $=(q,el=document)=>el.querySelector(q), $$=(q,el=document)=>[...el.querySelectorAll(q)];
const app=$('#app');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function embaralhar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nf=n=>{ const r=Math.round(n*1e6)/1e6; return String(r).replace('-','−').replace('.',','); };
const real=v=>'R$ '+v.toFixed(2).replace('.',',');
const mdc=(a,b)=>b?mdc(b,a%b):Math.abs(a);
/* monta uma questão de múltipla escolha: certo + erradas (sem repetir) */
function mc(base, certo, erradas){
  const vistos=new Set([String(certo)]); const err=[];
  for(const e of erradas){ const k=String(e); if(!vistos.has(k)&&err.length<3){ vistos.add(k); err.push(e); } }
  const op=embaralhar([certo,...err]);
  return Object.assign({tipo:'mc'}, base, {op, certo:op.indexOf(certo)});
}

  let x=AC.currentTime; N.forEach(([f,d])=>{ const o=AC.createOscillator(),g=AC.createGain(); o.type=t==='erro'?'triangle':'sine'; o.frequency.value=f; g.gain.setValueAtTime(.08,x); g.gain.exponentialRampToValueAtTime(.001,x+d); o.connect(g); g.connect(AC.destination); o.start(x); o.stop(x+d+.02); x+=d*.9; }); }catch(e){} }

function lerNum(s){ s=String(s).trim().replace(/R\$|\s/g,'').replace(/[−–]/g,'-').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); if(!/^-?\d*\.?\d+$/.test(s)) return NaN; return Number(s); }

/* ---------- TIPO EMBUTIDO: tocar palavras (ou sílabas) ----------
   frase('O [tuiuiú] voou.') → {tokens, alvo}; colchetes marcam a resposta. */
function frase(txt){ const tokens=[], alvo=[]; let dentro=false; const L='A-Za-zÀ-ÖØ-öø-ÿ0-9';
  const re=new RegExp(`\\[|\\]|[${L}][${L}\\-]*|[^\\s${L}\\[\\]]+`,'g'); let m;
  while((m=re.exec(txt))){ const t=m[0]; if(t==='[') dentro=true; else if(t===']') dentro=false; else { const w=new RegExp(`[${L}]`).test(t); if(w&&dentro) alvo.push(tokens.length); tokens.push({t,w}); } }
  return {tokens, alvo}; }
const PALAVRAS={
  desenhar(it){ it.sel=it.sel||[]; const ok=new Set(it.alvo);
    const h=it.tokens.map((k,i)=>{ if(!k.w) return `<span class="pont">${esc(k.t)}</span>`;
      const c=it.feito?(ok.has(i)?'certa':''):(it.sel.includes(i)?(it.multi?'sel':'errada'):'');
      return `${it.junto||i===0?'':' '}<button class="pal ${c}" data-x="${i}" ${it.feito?'disabled':''}>${esc(k.t)}</button>`; }).join('');
    return `<div class="vis"><p class="frase-toque ${it.junto?'junto':''}">${h}</p></div>${it.multi&&!it.feito?'<div class="seguir"><button class="btn" data-x="limpar">↺ Limpar</button><button class="btn agua" data-acao="conferir">Conferir</button></div>':''}`; },
  acao(it,x){ if(x==='limpar'){ it.sel=[]; return desenhar(); } const i=+x;
    if(!it.multi){ it.sel=[i]; return PALAVRAS.conferir(it); }
    it.sel=it.sel.includes(i)?it.sel.filter(v=>v!==i):it.sel.concat(i); som('bip'); desenhar(); },
  conferir(it){ if(!it.sel||!it.sel.length) return toast(it.junto?'Toque em uma sílaba.':'Toque nas palavras.');
    const a=[...it.sel].sort((x,y)=>x-y).join(), b=[...it.alvo].sort((x,y)=>x-y).join();
    if(it.mostrar==null) it.mostrar=it.alvo.map(i=>it.tokens[i].t).join(it.junto?'':' ');
    responder(a===b, typeof it.dica==='function'?it.dica(it.sel.map(i=>it.tokens[i].t).join(' ')):null); },
  revelar(it){ it.sel=it.alvo.slice(); },
  auto(it){ it.sel=it.alvo.slice(); PALAVRAS.conferir(it); }
};
const TIPOS_BASE={palavras:PALAVRAS};
/* ---------- AUTOTESTE (usado pelos testes automáticos) ---------- */
window.__auto=function(errar){
  const it=item(); if(it.feito) return;
  if(it.tipo==='mc') return responderMC(errar?(it.certo+1)%it.op.length:it.certo);
  if(it.tipo==='num'){ $('#num').value=errar?'98765':String([].concat(it.resp)[0]).replace('.',','); return conferirNum(); }
  const T=tipoDe(it); if(errar) return responder(false); return T.auto(it);
};

const cit=t=>`<div class="vis"><p class="citacao">${t}</p></div>`;

/* ---- 1. classes de palavras (toque) ---- */
const CLASSES=[
  ['substantivo','A [onça] desapareceu rapidamente.','nomeia seres, objetos, lugares e sentimentos'],
  ['substantivo','A [alegria] contagiou todos.','“alegria” é um substantivo abstrato: nomeia um sentimento'],
  ['adjetivo','O tuiuiú [elegante] pousou no alto do ninho.','caracteriza o substantivo “tuiuiú”'],
  ['adjetivo','As águas de Bonito são muito [cristalinas].','dá uma característica às águas'],
  ['verbo','Os turistas [fotografaram] os jacarés na beira da estrada.','indica a ação praticada pelos turistas'],
  ['verbo','O pantaneiro [conduzia] a comitiva pela estrada de terra.','indica a ação, no pretérito imperfeito'],
  ['advérbio','A chuva chegou [cedo] ao Pantanal neste ano.','modifica o verbo, indicando tempo'],
  ['advérbio','A arara voou [rapidamente] sobre o campo.','modifica o verbo, indicando modo'],
  ['advérbio','A comitiva [não] parou na estrada.','modifica o verbo, indicando negação'],
  ['pronome','[Ela] preparou um tereré bem gelado para os amigos.','substitui o nome de uma pessoa (pronome pessoal)'],
  ['pronome','[Aquela] comitiva levava mais de mil cabeças de gado.','indica a posição da comitiva em relação a quem fala (pronome demonstrativo)'],
  ['conjunção','O peão chegou cansado, [mas] feliz.','liga duas ideias com sentido de oposição'],
  ['conjunção','Comprei chipa [e] sobá na feira central.','liga duas palavras com sentido de adição'],
  ['preposição','O barco saiu [de] Corumbá logo cedo.','liga palavras, indicando origem'],
  ['preposição','Os estudantes leram o conto [com] muita atenção.','liga “leram” a “muita atenção”, indicando modo'],
  ['artigo','Meu avô contou [uma] história de assombração.','“uma” é artigo indefinido: acompanha o substantivo “história”']
];
const LOCUCOES=[['luz do sol','solar'],['água de rio','fluvial'],['amor de mãe','materno'],['noite de chuva','chuvosa'],['olhar de criança','infantil'],['período da tarde','vespertino']];
function gerarClasses(){
  const it=embaralhar(CLASSES).slice(0,6).map(([cl,f,ex])=>Object.assign({tipo:'palavras', cat:'classes', enun:`Toque no <b>${cl.toUpperCase()}</b> da frase.`, x:`A palavra destacada é ${/ção$/.test(cl)?'uma':'um'} <b>${cl}</b>: ${ex}.`, dica:t=>`“${t}” não é ${cl}. Releia a frase e pense na função de cada palavra.`}, frase(f)));
  embaralhar(LOCUCOES).slice(0,2).forEach(([l,a])=>it.push(mc({cat:'classes', grade:true, enun:`A <b>locução adjetiva</b> “${l}” pode ser trocada por qual adjetivo?`, x:`“${l}” = <b>${a}</b>. Locução adjetiva é um grupo de palavras com valor de adjetivo.`, dica:'Pense em um adjetivo com o mesmo sentido.'}, a, embaralhar(LOCUCOES.map(x=>x[1]).filter(x=>x!==a)))));
  return it;
}
/* ---- 2. modos verbais ---- */
const MODOS=[
  ['Misture o açúcar e <mark>mexa</mark> bem a massa.','Imperativo','instrução, como numa receita'],
  ['<mark>Não jogue</mark> lixo nos rios do Pantanal!','Imperativo','ordem ou pedido (imperativo negativo)'],
  ['<mark>Respeite</mark> a fila da cantina.','Imperativo','pedido ou ordem'],
  ['O rio Paraguai <mark>atravessa</mark> o Pantanal.','Indicativo','certeza, um fato'],
  ['Amanhã <mark>choverá</mark> em Dourados, segundo a previsão.','Indicativo','certeza sobre o futuro'],
  ['Os alunos <mark>apresentaram</mark> a pesquisa ontem.','Indicativo','um fato que aconteceu'],
  ['Talvez a professora <mark>traga</mark> o livro novo.','Subjuntivo','dúvida ou possibilidade'],
  ['Se ele <mark>estudasse</mark> mais, passaria na prova.','Subjuntivo','hipótese, uma condição'],
  ['Espero que vocês <mark>venham</mark> à festa junina.','Subjuntivo','desejo'],
  ['Quando o ipê <mark>florescer</mark>, faremos uma foto.','Subjuntivo','possibilidade no futuro']
];
function gerarModos(){
  return embaralhar(MODOS).slice(0,8).map(([f,m,ef])=>mc({cat:'modos', grandes:true, enun:'Em que <b>modo</b> está o verbo destacado?', corpo:cit(f),
    x:`Modo <b>${m}</b>: expressa ${ef}.`, dica:'Indicativo = certeza. Subjuntivo = dúvida, desejo ou hipótese. Imperativo = ordem, pedido ou instrução.'}, `${m} (${m==='Indicativo'?'certeza':m==='Subjuntivo'?'dúvida, desejo ou hipótese':'ordem, pedido ou instrução'})`,
    ['Indicativo (certeza)','Subjuntivo (dúvida, desejo ou hipótese)','Imperativo (ordem, pedido ou instrução)']));
}
/* ---- 3. concordância ---- */
const CONC=[
  ['___ muitos estudantes na quadra.','Havia',['Haviam'],'O verbo “haver” no sentido de “existir” não tem sujeito e fica no singular.'],
  ['___ dois anos que me mudei para Campo Grande.','Faz',['Fazem'],'“Fazer” indicando tempo decorrido fica no singular.'],
  ['Os meninos e a menina ___ cedo à escola.','chegaram',['chegou'],'Sujeito composto antes do verbo: o verbo vai para o plural.'],
  ['Comprei uma blusa e um short ___.','novos',['novas','nova'],'Adjetivo depois de substantivos de gêneros diferentes: masculino plural.'],
  ['Elas ___ fizeram o cartaz da feira de ciências.','mesmas',['mesmo','mesma'],'“Mesmo” concorda com o pronome: elas mesmas.'],
  ['Seguem ___ as fotos do passeio.','anexas',['anexo','anexa'],'“Anexo” é adjetivo e concorda com “fotos”.'],
  ['Saímos ao meio-dia e ___.','meia',['meio'],'Meio-dia e meia (hora): “meia” concorda com “hora”, que está subentendida.'],
  ['Ela ficou ___ preocupada com a prova.','meio',['meia'],'“Meio” com sentido de “um pouco” é advérbio e não varia.'],
  ['Fui eu que ___ o bolo de aniversário.','fiz',['fez'],'Com “eu que”, o verbo concorda com “eu”: eu fiz.'],
  ['___ casas na beira do rio.','Vendem-se',['Vende-se'],'Na norma-padrão, “casas” é o sujeito paciente: vendem-se casas (= casas são vendidas).'],
  ['A turma do 7º ano ___ a gincana.','venceu',['venceram'],'O núcleo do sujeito é “turma” (singular).'],
  ['Nós ___ ao Pantanal nas férias.','fomos',['foi','foram'],'Na norma-padrão, o verbo concorda com “nós”: nós fomos.']
];
function gerarConcordancia(){
  return embaralhar(CONC).slice(0,8).map(([f,c,e,ex])=>mc({cat:'concordancia', grade:e.length<2, grandes:true, enun:'Complete de acordo com a <b>norma-padrão</b>:', corpo:cit(f.replace('___','<mark>______</mark>')),
    x:`${f.replace('___','<b>'+c+'</b>')} ${ex}`, dica:'Ache a palavra com que o termo deve concordar.'}, c, e));
}
/* ---- 4. sujeito e predicado ---- */
const SUJ=[
  '[O tuiuiú] é a ave-símbolo do Pantanal.',
  '[Os peões da comitiva] atravessaram o rio ao amanhecer.',
  'Chegaram [os turistas] ao hotel-fazenda.',
  '[A professora e os alunos] plantaram ipês no pátio.',
  'Na feira, [minha avó] vendia chipa quentinha.',
  'Ontem à noite, [a lua cheia] iluminou a lagoa.',
  '[Eu] gosto de tereré bem gelado.',
  'No verão, [as chuvas] enchem os campos do Pantanal.'
];
const TIPOS_SUJ=[['Estudamos muito para a prova.','Oculto (desinencial): “nós”','A terminação “-amos” mostra que o sujeito é “nós”, mesmo sem aparecer.'],
  ['Choveu muito em Campo Grande.','Oração sem sujeito','Verbos de fenômenos da natureza não têm sujeito.'],
  ['Roubaram a bicicleta do Pedro.','Indeterminado','Não se sabe (ou não se quer dizer) quem praticou a ação.'],
  ['O sobá e a chipa fazem parte da culinária de MS.','Composto','Há dois núcleos: “sobá” e “chipa”.']];
function gerarSujeito(){
  const it=embaralhar(SUJ).slice(0,5).map(f=>Object.assign({tipo:'palavras', multi:true, cat:'sujeito', enun:'Toque em <b>todas as palavras do sujeito</b> e depois em Conferir.',
    x:'O sujeito é o termo sobre o qual se declara algo. Pergunte ao verbo: “<b>quem</b>…?” ou “<b>o que</b>…?”.', dica:'Pergunte ao verbo “quem?” ou “o quê?”. O sujeito pode vir depois do verbo e pode ter mais de uma palavra.'}, frase(f)));
  it.push(Object.assign({tipo:'palavras', cat:'sujeito', enun:'Toque no <b>verbo</b>, o núcleo do predicado.', x:'O verbo é o centro do predicado: ele declara o que o sujeito faz ou como ele é.', dica:'Procure a palavra que indica a ação.'}, frase(pick(['Os alunos [visitaram] o museu da cidade.','A boiada [atravessou] a ponte devagar.','O vento [derrubou] as mangas do quintal.']))));
  embaralhar(TIPOS_SUJ).slice(0,2).forEach(([f,c,ex])=>it.push(mc({cat:'sujeito', grandes:true, enun:'Como se classifica o sujeito desta oração?', corpo:cit(f), x:`<b>${c}</b>. ${ex}`, dica:'Procure quem pratica a ação. Ele aparece? Dá para saber quem é?'}, c, TIPOS_SUJ.map(t=>t[1]).filter(t=>t!==c))));
  return it;
}
/* ---- 5. complementos e vozes ---- */
const COMP=[
  ['O pescador vendeu <mark>o pacu</mark> na feira.','Objeto direto','“vendeu” o quê? O complemento vem sem preposição.'],
  ['A turma gosta <mark>de música sertaneja</mark>.','Objeto indireto','“gosta” de quê? O complemento vem com preposição (de).'],
  ['Entreguei o convite <mark>aos professores</mark>.','Objeto indireto','entreguei a quem? O complemento vem com preposição (a + os).'],
  ['O vento quebrou <mark>a janela da sala</mark>.','Objeto direto','quebrou o quê? Sem preposição.'],
  ['Os meninos nadaram <mark>no rio Aquidauana</mark>.','Adjunto adverbial de lugar','indica onde a ação aconteceu; não é complemento do verbo.'],
  ['<mark>Durante a seca</mark>, o rio baixou muito.','Adjunto adverbial de tempo','indica quando a ação aconteceu.']
];
const VOZES=[
  ['Os alunos organizaram a feira.','A feira foi organizada pelos alunos.',['A feira organizou os alunos.','Os alunos foram organizados pela feira.','A feira foi organizada para os alunos.']],
  ['O fogo destruiu parte da mata.','Parte da mata foi destruída pelo fogo.',['O fogo foi destruído pela mata.','Parte da mata destruiu o fogo.','Parte da mata foi destruída no fogo.']],
  ['A diretora assinou os certificados.','Os certificados foram assinados pela diretora.',['Os certificados assinaram a diretora.','A diretora foi assinada pelos certificados.','Os certificados foram assinados para a diretora.']]
];
function gerarComplementos(){
  const it=embaralhar(COMP).slice(0,4).map(([f,c,ex])=>mc({cat:'complementos', grandes:true, enun:'O termo destacado é:', corpo:cit(f), x:`<b>${c}</b>: ${ex}`, dica:'Pergunte ao verbo “o quê?” (sem preposição) ou “de quê? a quem?” (com preposição). Se indicar lugar, tempo ou modo, é adjunto adverbial.'}, c, ['Objeto direto','Objeto indireto','Sujeito','Adjunto adverbial de lugar','Adjunto adverbial de tempo'].filter(x=>x!==c).slice(0,3)));
  const v=pick(VOZES); it.push(mc({cat:'vozes', grandes:true, enun:'Qual é a <b>voz passiva</b> desta frase?', corpo:cit(v[0]), x:`<b>${v[1]}</b> O objeto direto vira sujeito (paciente), o verbo vai para “ser + particípio” e quem praticou a ação vira agente da passiva (“pelo/pela…”).`, dica:'Na voz passiva, quem sofre a ação vira o sujeito, e o verbo fica com “ser + particípio”.'}, v[1], v[2]));
  it.push(mc({cat:'vozes', grandes:true, enun:'Na frase abaixo, <b>quem pratica</b> a ação?', corpo:cit('O jacaré foi fotografado pela turista.'), x:'<b>A turista</b>, o agente da passiva. “O jacaré” é o sujeito, mas ele <b>sofre</b> a ação (sujeito paciente).', dica:'Na voz passiva, o sujeito sofre a ação.'}, 'A turista (agente da passiva)', ['O jacaré (sujeito agente)','Ninguém: a oração não tem sujeito','O jacaré e a turista juntos']));
  const vz=pick([['Vendem-se chipas quentinhas.','Passiva sintética (com “se”)'],['A ponte foi construída em 2001.','Passiva analítica (ser + particípio)'],['O time venceu o campeonato.','Ativa']]);
  it.push(mc({cat:'vozes', grandes:true, enun:'Em que <b>voz</b> está o verbo?', corpo:cit(vz[0]), x:`<b>${vz[1]}</b>.${vz[1].startsWith('Passiva sint')?' Equivale a “Chipas quentinhas são vendidas”.':''}`, dica:'Ativa: o sujeito pratica a ação. Passiva: o sujeito sofre a ação (com “ser + particípio” ou com “se”).'}, vz[1], ['Ativa','Passiva analítica (ser + particípio)','Passiva sintética (com “se”)','Reflexiva'].filter(x=>x!==vz[1])));
  it.push(Object.assign({tipo:'palavras', multi:true, cat:'complementos', enun:'Toque em todas as palavras do <b>adjunto adverbial de lugar</b>.', x:'O adjunto adverbial indica a circunstância (aqui, o lugar) em que a ação ocorre.', dica:'Pergunte ao verbo: “onde?”.'}, frase(pick(['As capivaras descansavam [na beira da lagoa].','Os alunos apresentaram a peça [no auditório da escola].','O tuiuiú construiu o ninho [no alto da árvore].']))));
  return it;
}
/* ---- 6. orações e conjunções ---- */
const CONJ=[
  ['Não fui à aula <mark>porque</mark> estava doente.','Causa'],['<mark>Embora</mark> chovesse, o jogo aconteceu.','Concessão'],['Estudou tanto <mark>que</mark> passou em primeiro lugar.','Consequência'],
  ['<mark>À medida que</mark> a seca avança, o rio baixa.','Proporção'],['<mark>Se</mark> fizer sol, iremos a Bonito.','Condição'],['Leve o guarda-chuva, <mark>pois</mark> vai chover.','Explicação'],
  ['<mark>Ou</mark> você estuda agora, <mark>ou</mark> perde o filme.','Alternância'],['Trabalhou muito, <mark>mas</mark> não terminou o projeto.','Oposição (adversidade)'],['Saiu cedo <mark>para que</mark> chegasse a tempo.','Finalidade'],
  ['<mark>Quando</mark> a comitiva chegou, todos aplaudiram.','Tempo'],['Choveu muito; <mark>portanto</mark>, a estrada ficou interditada.','Conclusão']
];
const RELS=['Causa','Concessão','Consequência','Proporção','Condição','Explicação','Alternância','Oposição (adversidade)','Finalidade','Tempo','Conclusão'];
function gerarConjuncoes(){
  const it=embaralhar(CONJ).slice(0,6).map(([f,r])=>mc({cat:'conjuncoes', grandes:true, enun:'Que relação de sentido a conjunção destacada estabelece?', corpo:cit(f), x:`<b>${r}</b>. As conjunções ligam orações e mostram como as ideias se relacionam.`, dica:'Tente trocar a conjunção por outra de sentido parecido (porque = já que; embora = mesmo que; se = caso…).'}, r, embaralhar(RELS.filter(x=>x!==r))));
  it.push(mc({cat:'conjuncoes', grandes:true, enun:'O período abaixo é composto por:', corpo:cit('Cheguei em casa, tomei banho e fui dormir.'), x:'<b>Coordenação</b>: são três orações independentes, ligadas por vírgulas e pela conjunção “e”.', dica:'Cada oração tem sentido completo sozinha?'}, 'Coordenação (orações independentes)', ['Subordinação (uma oração depende da outra)','Uma única oração (período simples)']));
  it.push(mc({cat:'conjuncoes', grandes:true, enun:'O período abaixo é composto por:', corpo:cit('Os alunos perceberam que a ponte estava quebrada.'), x:'<b>Subordinação</b>: “que a ponte estava quebrada” completa o sentido de “perceberam” (é o que eles perceberam).', dica:'Uma das orações completa o sentido da outra?'}, 'Subordinação (uma oração depende da outra)', ['Coordenação (orações independentes)','Uma única oração (período simples)']));
  return it;
}
/* ---- 7. regência e predicativo ---- */
const REG=[
  ['Ontem assisti ___ filme sobre o Pantanal.','ao',['o','no'],'“Assistir”, no sentido de ver, pede a preposição “a”: assistir <b>ao</b> filme.'],
  ['Prefiro tereré ___ refrigerante.','a',['do que','que'],'“Preferir” pede a preposição “a”: prefiro uma coisa <b>a</b> outra.'],
  ['Obedeça ___ sinalização da estrada.','à',['a'],'“Obedecer” pede a preposição “a”; com o artigo “a”, forma crase: <b>à</b> sinalização.'],
  ['Os alunos chegaram ___ escola às 7 horas.','à',['na','em a'],'Na norma-padrão, quem chega, chega <b>a</b> algum lugar: chegaram <b>à</b> escola.'],
  ['Ele aspira ___ cargo de diretor.','ao',['o','pelo'],'“Aspirar”, no sentido de desejar, pede a preposição “a”: aspira <b>ao</b> cargo.'],
  ['Sempre simpatizei ___ os meus vizinhos.','com',['a','de'],'“Simpatizar” pede a preposição “com”.']

function gerarRegencia(){
  const it=embaralhar(REG).slice(0,5).map(([f,c,e,ex])=>mc({cat:'regencia', grade:true, enun:'Complete de acordo com a <b>norma-padrão</b>:', corpo:cit(f.replace('___','<mark>____</mark>')), x:ex, dica:'Pense em qual preposição o verbo pede.'}, c, e));
  const pv=pick([['O rio está <mark>cheio</mark> depois das chuvas.','cheio'],['A professora ficou <mark>orgulhosa</mark> da turma.','orgulhosa'],['O tereré parece <mark>gelado</mark>.','gelado']]);
  it.push(mc({cat:'regencia', grandes:true, enun:'A palavra destacada exerce que função?', corpo:cit(pv[0]), x:`<b>Predicativo do sujeito</b>: “${pv[1]}” atribui uma característica ao sujeito por meio de um verbo de ligação.`, dica:'Ela dá uma característica a quem? Ligada por qual verbo?'}, 'Predicativo do sujeito', ['Objeto direto','Adjunto adverbial','Sujeito']));
  it.push(mc({cat:'regencia', grandes:true, enun:'Em qual frase há um <b>verbo de ligação</b>?', x:'Em “A menina <b>parece</b> cansada”, o verbo não indica ação: ele liga o sujeito a uma característica (cansada).', dica:'Verbos de ligação: ser, estar, parecer, ficar, permanecer, continuar…'}, 'A menina parece cansada.', ['A menina comeu bolo.','A menina correu no parque.','A menina escreveu um poema.']));
  it.push(mc({cat:'regencia', grandes:true, enun:'Na frase abaixo, o verbo “ficou” é:', corpo:cit('O céu <mark>ficou</mark> escuro de repente.'), x:'<b>De ligação</b>: indica mudança de estado e liga o sujeito “o céu” ao predicativo “escuro”.', dica:'O verbo indica uma ação ou um estado do sujeito?'}, 'De ligação', ['Transitivo direto','Transitivo indireto','Intransitivo, de ação']));
  return it;
}

  AJUDA:['👆 Em algumas questões você toca nas palavras da frase. Quando pedir “todas as palavras”, toque em cada uma e depois em <b>Conferir</b>.','🟨 Palavras destacadas em amarelo são o foco da pergunta.','📚 Sugestão de uso: bancadas 1 a 3 para o 6º e o 7º ano; 4 e 5 para o 7º e o 8º; 6 e 7 para o 8º e o 9º.','💡 Professor(a): as frases são sorteadas a cada partida. Use ⚙️ para liberar todas as bancadas.'],
  MISSOES:[
    {id:'m1', titulo:'Classes de palavras', ic:'🧩', hab:'MS.EF06LP04.s.04 · MS.EF07LP08.s.08 · MS.EF07LP09.s.09', desc:'Encontre substantivos, adjetivos, verbos, advérbios, pronomes e conectivos.', gerar:gerarClasses,
      intro:'<p>Cada palavra tem uma função: o <b>substantivo</b> nomeia, o <b>adjetivo</b> caracteriza, o <b>verbo</b> indica ação ou estado, o <b>advérbio</b> modifica o verbo, o <b>pronome</b> substitui ou acompanha o nome e a <b>preposição</b> e a <b>conjunção</b> ligam.</p>'},
    {id:'m2', titulo:'Modos verbais', ic:'🎭', hab:'MS.EF06LP04.s.04 · MS.EF06LP05.s.05', desc:'Certeza, dúvida ou ordem? Indicativo, subjuntivo e imperativo.', gerar:gerarModos,
      intro:'<p><b>Indicativo</b>: certeza (“O rio <b>sobe</b>”). <b>Subjuntivo</b>: dúvida, desejo, hipótese (“Talvez o rio <b>suba</b>”). <b>Imperativo</b>: ordem, pedido, instrução (“<b>Suba</b> no barco”).</p>'},
    {id:'m3', titulo:'Concordância', ic:'🤝', hab:'MS.EF06LP06.s.06 · MS.EF07LP06.s.06', desc:'Verbo com sujeito, adjetivo com substantivo, e os casos que confundem.', gerar:gerarConcordancia,
      intro:'<p>Na norma-padrão, o <b>verbo</b> concorda com o sujeito e o <b>adjetivo</b> concorda com o substantivo. Atenção aos casos especiais, como “haver” e “fazer”, que ficam no singular!</p>'},
    {id:'m4', titulo:'Sujeito e predicado', ic:'🎯', hab:'MS.EF07LP04.s.04 · MS.EF07LP05.s.05 · MS.EF07LP07.s.07', desc:'Toque no sujeito, ache o verbo e classifique o sujeito.', gerar:gerarSujeito,
      intro:'<p>O <b>sujeito</b> é o termo sobre o qual se declara algo; o <b>predicado</b> é o que se declara, e o <b>verbo</b> é o centro dele. Dica: pergunte ao verbo “quem?” ou “o quê?”.</p>'},
    {id:'m5', titulo:'Complementos e vozes', ic:'🔁', hab:'MS.EF08LP07.s.07 · MS.EF08LP08.s.08 · MS.EF08LP10.s.10', desc:'Objeto direto e indireto, adjuntos adverbiais e voz ativa e passiva.', gerar:gerarComplementos,
      intro:'<p>O <b>objeto direto</b> completa o verbo sem preposição; o <b>indireto</b>, com preposição. Na <b>voz passiva</b>, o sujeito sofre a ação: “A feira <b>foi organizada</b> pelos alunos”.</p>'},
    {id:'m6', titulo:'Orações e conjunções', ic:'🔗', hab:'MS.EF08LP12.s.12 · MS.EF08LP13.s.13 · MS.EF09LP08.s.08', desc:'Causa, concessão, condição, finalidade… e coordenação ou subordinação.', gerar:gerarConjuncoes,
      intro:'<p>As <b>conjunções</b> mostram a relação entre as ideias: “<b>porque</b>” indica causa, “<b>embora</b>” indica concessão, “<b>se</b>” indica condição, “<b>para que</b>” indica finalidade.</p>'},
    {id:'m7', titulo:'Regência e predicativo', ic:'🧭', hab:'MS.EF09LP05.s.05 · MS.EF09LP06.s.06 · MS.EF09LP07.s.07', desc:'Que preposição o verbo pede? Verbos de ligação e predicativo do sujeito.', gerar:gerarRegencia,
      intro:'<p><b>Regência</b> é a relação entre um verbo (ou nome) e seus complementos: “assistir <b>ao</b> filme”, “obedecer <b>às</b> regras”. Verbos de <b>ligação</b> (ser, estar, ficar, parecer) ligam o sujeito a uma característica, o <b>predicativo</b>.</p>'}
