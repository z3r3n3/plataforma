<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feirinha do Pantanal</title>
<meta name="description" content="Jogo de Matemática para o 1º e o 2º ano: contagem, comparação, juntar e retirar, sequências e dinheiro na feira, com leitura em voz alta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>

:root{
  --agua:#0B5563; --agua2:#0E7490; --agua-claro:#CFF0F2; --mata:#2F6B2A; --mata2:#4D8B31; --ipe:#F5B700; --ipe-e:#C78F00;
  --terra:#9A3412; --creme:#FFFBF0; --borda:#E6DABC; --tinta:#1B2A26; --suave:#56645E;
  --ok:#15803D; --ok-f:#DCFCE7; --erro:#DC2626; --erro-f:#FEE2E2;
  --titulo:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --texto:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;font-family:var(--texto);font-size:17px;color:var(--tinta);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,#E3F4EE 0%,#F6F1DF 100%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.btn{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .12s;text-decoration:none;color:var(--tinta)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ipe{background:var(--ipe);border-color:var(--ipe-e);box-shadow:0 4px 0 var(--ipe-e)}
.btn.agua{background:var(--agua2);border-color:var(--agua);color:#fff;box-shadow:0 4px 0 var(--agua)}
.btn.grande{font-size:20px;padding:16px 26px;font-family:var(--titulo)}
.btn.icone{padding:10px 14px}
.selo{display:inline-block;font-family:var(--titulo);font-weight:800;letter-spacing:2px;font-size:12px;color:var(--terra);background:#9A341214;padding:5px 12px;border-radius:30px}

/* HOME */
.home{max-width:1100px;margin:auto;padding:22px 20px 34px}
.voltar-plat{font-weight:700;color:var(--agua);text-decoration:none;font-size:15px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;margin-top:10px}
.hero h1{font-size:clamp(44px,7vw,76px);font-weight:800;margin:12px 0 8px;letter-spacing:-1px;color:var(--agua)}
.hero h1 span{color:var(--mata2)}
.lead{font-size:19px;line-height:1.6;max-width:540px;margin:0 0 16px;color:#34463F}
.campos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;color:var(--suave)}
.campos input{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:10px 12px;width:190px;font-size:17px}
.campos label:last-child input{width:110px}
.acoes{display:flex;flex-wrap:wrap;gap:10px}
.cena{border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 40px #0b556333}
.cena svg{display:block;width:100%;height:auto}
.info{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.info div{flex:1;min-width:150px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--suave)}
.info b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.rodape{font-size:13px;color:var(--suave);line-height:1.6;margin-top:12px}

/* TOPO */
.topo{position:sticky;top:0;z-index:25;background:#F2F8F2ee;backdrop-filter:blur(6px);border-bottom:2px solid #CFE3D6;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topo .tit{flex:1;min-width:0}
.topo h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{color:var(--suave);font-size:13px}
.topo .btn{min-height:42px;padding:8px 12px}
.chip-topo{font-family:var(--titulo);font-weight:800;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:6px 12px;white-space:nowrap}

/* MAPA */
.mapa{max-width:1000px;margin:auto;padding:22px 16px 40px}
.missoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.missao{position:relative;text-align:left;background:#fff;border:3px solid var(--borda);border-radius:22px;padding:18px;min-height:210px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.missao:hover:not(:disabled){transform:translateY(-3px)}
.missao:disabled{opacity:.5;cursor:not-allowed}
.missao .ic{font-size:40px;line-height:1}
.missao .num{font-family:var(--titulo);font-weight:800;color:var(--terra);letter-spacing:1px;font-size:14px}
.missao h3{font-size:24px}
.missao p{margin:0;color:var(--suave);font-size:15px}
.missao .hab{font-size:12px;color:var(--suave)}
.missao .est{margin-top:auto;font-size:22px;letter-spacing:3px;color:#E2D8C2}
.missao .est .on{color:var(--ipe)}
.missao .cad{position:absolute;top:14px;right:16px;font-size:20px}
.missao.atual{border-color:var(--mata2);box-shadow:0 0 0 4px #4D8B3133}
.nota{color:var(--suave);font-size:13px;margin-top:16px;line-height:1.5}

/* JOGO */
.jogo{max-width:880px;margin:auto;padding:14px 16px 40px}
.barra{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--suave)}
.trilho{flex:1;height:10px;border-radius:10px;background:#D9E7DD;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--mata2);transition:width .3s}
.painel{background:var(--creme);border:3px solid var(--borda);border-radius:22px;padding:18px}
.enunciado{font-family:var(--titulo);font-size:22px;margin:0 0 4px}
.legenda{font-size:14px;color:var(--suave);margin:0 0 12px}

/* cadeia */
.cadeia{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.elo{width:118px;min-height:118px;border-radius:16px;border:3px dashed #B9CBBE;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.elo .em{font-size:38px;line-height:1.1}
.elo.sol{border-style:solid;border-color:#F6D776;background:#FFF8DA}
.elo.cheio{border-style:solid;border-color:var(--agua2)}
.elo.certo{border-color:var(--ok);background:var(--ok-f)}
.elo.errado{border-color:var(--erro);background:var(--erro-f);animation:treme .3s}
.elo .papel{font-size:11px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.3px}
.elo .vz{font-size:30px;color:#B9CBBE}
.seta{display:flex;align-items:center;font-size:26px;color:var(--agua2);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;border-radius:18px;background:#EEF6F0;border:2px solid #D3E6D8}
.carta{width:118px;min-height:110px;border-radius:16px;border:2px solid var(--borda);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-weight:700;font-size:14px;line-height:1.2;text-align:center;box-shadow:0 4px 0 #E2D6BB;transition:transform .1s}
.carta .em{font-size:38px;line-height:1.1}
.carta:hover:not(:disabled){transform:translateY(-3px)}
.carta:disabled{visibility:hidden}
.decomp{margin-top:12px;font-size:15px;background:#F3EBDD;border-radius:12px;padding:10px 12px}
@keyframes treme{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* classificar / situação */
.ficha{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--borda);border-radius:18px;padding:18px;margin-bottom:14px}
.ficha .em{font-size:56px;line-height:1;flex:none}
.ficha .txt{font-size:clamp(20px,3vw,25px);font-weight:700;line-height:1.35}
.biomas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bioma{border:0;border-radius:16px;padding:14px 10px;color:#fff;font-family:var(--titulo);font-weight:800;font-size:22px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 #0003;transition:transform .1s}
.bioma small{font-family:var(--texto);font-weight:400;font-size:12px;opacity:.9}
.bioma:hover:not(:disabled){transform:translateY(-3px)}
.bioma.p{background:var(--agua2)}.bioma.c{background:#B45309}.bioma.d{background:var(--mata)}
.bioma:disabled{opacity:.4;cursor:default}
.bioma.marcado{opacity:1;outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
.contexto{background:#E6F2F4;border-left:6px solid var(--agua2);border-radius:0 16px 16px 0;padding:14px 16px;margin-bottom:12px;font-size:18px;line-height:1.5}
.contexto b.ev{display:block;font-family:var(--titulo);font-size:21px;color:var(--agua);margin-bottom:2px}
.teia{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:15px}
.teia span{background:#fff;border:1.5px solid #B7D3DA;border-radius:10px;padding:2px 8px;white-space:nowrap}
.pergunta{font-family:var(--titulo);font-size:21px;margin:6px 0 10px}
.opcoes{display:grid;gap:8px}
.op{text-align:left;border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.op b{flex:none;width:28px;height:28px;border-radius:8px;background:#EEF6F0;display:grid;place-items:center;font-family:var(--titulo)}
.op:hover:not(:disabled){border-color:var(--agua2)}
.op.certa{border-color:var(--ok);background:var(--ok-f)}
.op.errada{border-color:var(--erro);background:var(--erro-f);text-decoration:line-through;opacity:.8}
.op:disabled{cursor:default}
.retorno{margin-top:14px;border-radius:16px;padding:14px 16px;line-height:1.55;border:2px solid var(--borda);background:#fff}
.retorno.ok{border-color:#86EFAC;background:#F0FDF4}
.retorno.no{border-color:#FCA5A5;background:#FFF5F5}
.retorno .t{display:block;font-family:var(--titulo);font-size:21px;margin-bottom:4px}
.seguir{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:#0b2a2ab8;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--creme);border-radius:24px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:24px;border:3px solid var(--borda);box-shadow:0 30px 80px #0006}
.modal h2{font-size:30px;margin-bottom:8px}
.modal p{line-height:1.6;margin:8px 0}
.modal .acoes{margin-top:18px}
.lista{display:grid;gap:8px;margin-top:10px}
.lista div{background:#fff;border:2px solid var(--borda);border-radius:12px;padding:9px 12px;line-height:1.45}
.mini{font-size:13px;color:var(--suave)}
.big-est{font-size:58px;letter-spacing:8px;text-align:center}
.big-est span{display:inline-block;color:#E2D8C2;opacity:0;transform:scale(.4);animation:surge .5s forwards}
.big-est span.on{color:var(--ipe)}
.big-est span:nth-child(2){animation-delay:.25s}.big-est span:nth-child(3){animation-delay:.5s}
@keyframes surge{to{opacity:1;transform:scale(1)}}
.resumo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.resumo div{background:#fff;border:2px solid var(--borda);border-radius:14px;padding:8px 14px;text-align:center;font-size:13px;color:var(--suave)}
.resumo b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.cfg-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 14px;margin:8px 0}
.cfg-linha small{display:block;color:var(--suave);font-size:13px}
.troca{position:relative;width:56px;height:32px;flex:none;border-radius:20px;border:0;background:#D6CAB5}
.troca::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.troca[aria-checked="true"]{background:var(--ok)}
.troca[aria-checked="true"]::after{left:28px}

/* RELATÓRIO */
.pg{max-width:860px;margin:auto;padding:20px 16px 40px}
.cartao{background:#fff;border:3px solid var(--borda);border-radius:20px;padding:18px;margin-bottom:16px}
.cartao h3{font-size:22px;margin-bottom:10px}
.cat{display:grid;grid-template-columns:minmax(190px,1.3fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}
.cat:last-child{border-bottom:0}
.bar{height:14px;border-radius:10px;background:#EEE6D3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--mata2)}
.cat .n{font-weight:700;white-space:nowrap}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:60;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .cena{order:-1}
  .topo{padding:8px 10px;gap:6px}
  .topo small{display:none}
  .topo h2{font-size:17px}
  .chip-topo{padding:4px 8px;font-size:14px}
  .elo,.carta{width:96px;min-height:96px;font-size:13px}
  .elo .em,.carta .em{font-size:30px}
  .seta{font-size:20px}
  .biomas{grid-template-columns:1fr}
  .bioma{min-height:60px;flex-direction:row;gap:10px;font-size:20px}
  .ficha{padding:14px;gap:12px}
  .ficha .em{font-size:44px}
  .cat{grid-template-columns:1fr auto}
  .cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- motor da matemática ---- */
.enun-linha{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.enun-linha .enunciado{margin:4px 0 0}
.falar{flex:none}
.vis{background:#fff;border:2px solid var(--borda);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center}
.vis svg{max-width:100%;height:auto}
.vis .grande{font-family:var(--titulo);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1.1}
.emojis{display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center;font-size:clamp(30px,6vw,42px);line-height:1.15;max-width:560px}
.emojis .grupo{display:inline-flex;gap:2px;padding:2px 6px;border-radius:12px;background:#F6F1DF}
.emojis .riscado{opacity:.35;position:relative}
.emojis .riscado::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;border-top:4px solid var(--erro);transform:rotate(-30deg)}
.opcoes.grade{grid-template-columns:repeat(4,1fr)}
.opcoes.grade .op{justify-content:center;text-align:center;font-family:var(--titulo);font-weight:800;font-size:clamp(24px,4.4vw,32px);padding:12px 6px;min-height:72px;align-items:center}
.opcoes.grandes .op{font-size:20px}
.resp-num{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px}
.resp-num input{width:180px;max-width:48vw;font-family:var(--titulo);font-weight:800;font-size:30px;text-align:center;border:3px solid var(--agua2);border-radius:14px;padding:4px 10px;background:#F8FFFE}
.resp-num input:disabled{border-color:var(--ok);background:var(--ok-f);color:var(--tinta)}
.resp-num .un{font-family:var(--titulo);font-weight:800;font-size:24px}
.niveis{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.niveis button{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:8px 16px;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.niveis button small{font-weight:400;color:var(--suave);font-size:12px}
.niveis button[aria-checked="true"]{border-color:var(--agua2);background:var(--agua-claro);box-shadow:0 0 0 3px #0E749033}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:800;margin:0 2px}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor;padding-bottom:2px}
.fr i:last-child{padding-top:2px}
.pot sup{font-size:.6em}
@media (max-width:820px){
  .opcoes.grade{grid-template-columns:repeat(2,1fr)}
}

:root{--agua:#9A3412;--agua2:#EA580C;--agua-claro:#FFEDD5;--mata2:#16A34A}
body{background:linear-gradient(180deg,#FEF3C7 0%,#FFF7ED 100%)}
.topo{background:#FFFBEBee;border-bottom-color:#FDE68A}
.trilho{background:#FDE68A}
.trilho i,.bar i{background:var(--mata2)}
.missao.atual{border-color:var(--mata2);box-shadow:0 0 0 4px #16A34A33}
.enunciado{font-size:24px}
.barracas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%;min-width:0}
.barraca{border:3px solid var(--borda);border-radius:18px;padding:10px;background:#FFFBEB;display:flex;flex-direction:column;align-items:center;gap:6px}
.barraca b{font-family:var(--titulo);font-size:20px}
.barraca .emojis{font-size:clamp(20px,4.2vw,34px)}
.barraca .emojis .grupo{padding:2px 3px;gap:0}
.cesto{display:inline-flex;flex-direction:column;align-items:center;background:#FDE68A;border:2px solid #D97706;border-radius:14px;padding:4px 8px;font-size:30px;line-height:1}
.cesto small{font-family:var(--titulo);font-weight:800;font-size:15px;color:#92400E}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.seq span{min-width:58px;height:58px;display:grid;place-items:center;border-radius:14px;background:#FFFBEB;border:2px solid var(--borda);font-family:var(--titulo);font-weight:800;font-size:28px;padding:0 6px}
.seq span.q{background:var(--ipe);border-color:var(--ipe-e);animation:pul 1.2s infinite}
@keyframes pul{50%{transform:scale(1.08)}}
.produto{display:flex;align-items:center;gap:14px;justify-content:center}
.produto .em{font-size:64px;line-height:1}
.produto .preco{background:#fff;border:3px dashed #D97706;border-radius:14px;padding:6px 14px;font-family:var(--titulo);font-weight:800;font-size:clamp(28px,6vw,40px);color:#9A3412}
.din{border:0;background:none;padding:0;display:inline-grid;place-items:center;font-family:var(--titulo);font-weight:800;color:#fff;text-shadow:0 1px 2px #0006;transition:transform .1s;vertical-align:middle}
.din:hover:not(:disabled){transform:translateY(-3px)}
.din.moeda{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#D9D9D9 0 52%,#E8B44A 53% 100%);color:#5B4200;text-shadow:none;font-size:18px;border:2px solid #B8860B}
.din.ced{width:96px;height:52px;border-radius:8px;font-size:17px;border:2px solid #0003;position:relative;line-height:1;justify-items:start;padding-left:9px}
.din.ced i{position:absolute;right:4px;top:3px;font-style:normal;font-size:18px;text-shadow:none}
.din.c2{background:#4F7FAF}.din.c5{background:#8B67B5}.din.c10{background:#C0504D}.din.c20{background:#D69A1C}.din.c50{background:#B5651D}
.din.mini{transform:scale(.72);margin:-8px -12px}
.carteira,.balcao{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:10px;border-radius:16px;min-height:76px}
.carteira{background:#ECFDF5;border:2px solid #A7F3D0}
.balcao{background:#FFF7ED;border:3px dashed #FDBA74}
.balcao:empty::before{content:'Toque no dinheiro para colocar aqui no balcão';color:var(--suave);font-size:15px}
.rot{font-family:var(--titulo);font-weight:800;font-size:18px;margin:10px 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.combo{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-start}
@media (max-width:820px){ .din.ced{width:84px;height:46px;font-size:15px} .din.moeda{width:52px;height:52px} .produto .em{font-size:52px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   MOTOR DOS JOGOS DE MATEMÁTICA — JRM • Aventuras Educativas
   Cada jogo define o objeto JOGO e chama iniciarJogo().
   ========================================================= */
const $=(q,el=document)=>el.querySelector(q), $$=(q,el=document)=>[...el.querySelectorAll(q)];
const app=$('#app');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function embaralhar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nf=n=>{ const r=Math.round(n*1e6)/1e6; return String(r).replace('-','−').replace('.',','); };
const real=v=>'R$ '+v.toFixed(2).replace('.',',');
const mdc=(a,b)=>b?mdc(b,a%b):Math.abs(a);
/* monta uma questão de múltipla escolha: certo + erradas (sem repetir) */
function mc(base, certo, erradas){
  const vistos=new Set([String(certo)]); const err=[];
  for(const e of erradas){ const k=String(e); if(!vistos.has(k)&&err.length<3){ vistos.add(k); err.push(e); } }
  const op=embaralhar([certo,...err]);
  return Object.assign({tipo:'mc'}, base, {op, certo:op.indexOf(certo)});
}
/* distratores numéricos próximos */
function vizinhos(n, deltas=[1,-1,2,-2,10,-10,3,5], min=0){ return embaralhar(deltas).map(d=>n+d).filter(v=>v>=min); }

/* ---------- ESTADO ---------- */
let S;
function padrao(){ return {nome:'',turma:'',nivel:JOGO.NIVEIS?JOGO.NIVEIS[0].k:null,missoes:{},stats:{},cfg:{som:true,livre:false}}; }
function carregar(){ S=padrao(); try{ const g=JSON.parse(localStorage.getItem(JOGO.CHAVE)); if(g&&typeof g==='object') S=Object.assign(padrao(),g,{cfg:Object.assign(padrao().cfg,g.cfg||{})}); }catch(e){} }
function salvar(){ try{ localStorage.setItem(JOGO.CHAVE,JSON.stringify(S)); }catch(e){} }

/* ---------- UTIL ---------- */
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }
function estrelasHtml(n){ return [0,1,2].map(i=>`<span class="${i<n?'on':''}">★</span>`).join(''); }
const totalEst=()=>JOGO.MISSOES.reduce((a,m)=>a+((S.missoes[m.id]||{}).estrelas||0),0);
const maxEst=()=>JOGO.MISSOES.length*3;
function patente(){ const e=totalEst(); let p=JOGO.PATENTES[0][1]; JOGO.PATENTES.forEach(([min,n])=>{ if(e>=min) p=n; }); return p; }
const liberada=m=>S.cfg.livre||m.idx===0||!!(S.missoes[JOGO.MISSOES[m.idx-1].id]||{}).feita;

let AC=null;
function som(t){ if(!S.cfg.som) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  const N={ok:[[523,.07],[659,.07],[784,.14]],erro:[[220,.12],[180,.18]],bip:[[880,.06]],moeda:[[1319,.05],[1760,.12]],fim:[[392,.09],[523,.09],[659,.09],[784,.09],[1047,.28]]}[t]||[];
  let x=AC.currentTime; N.forEach(([f,d])=>{ const o=AC.createOscillator(),g=AC.createGain(); o.type=t==='erro'?'triangle':'sine'; o.frequency.value=f; g.gain.setValueAtTime(.08,x); g.gain.exponentialRampToValueAtTime(.001,x+d); o.connect(g); g.connect(AC.destination); o.start(x); o.stop(x+d+.02); x+=d*.9; }); }catch(e){} }
/* leitura em voz alta (útil para quem ainda está aprendendo a ler) */
function falar(txt){ try{ if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined') return toast('Seu navegador não tem leitura em voz alta.');
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt.replace(/R\$\s?/g,'').replace(/−/g,'menos ')); u.lang='pt-BR'; u.rate=.92;
  const v=speechSynthesis.getVoices().find(v=>/^pt(-|_)BR/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }
const semTags=h=>{ const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); };

function abrirModal(h){ $('#modal').innerHTML=h; $('#overlay').classList.remove('hidden'); const b=$('#modal [data-foco]')||$('#modal button'); if(b) b.focus(); }
function fecharModal(){ $('#overlay').classList.add('hidden'); $('#modal').innerHTML=''; }
const modalAberto=()=>!$('#overlay').classList.contains('hidden');
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') fecharModal(); });

/* ---------- NAVEGAÇÃO ---------- */
let TELA='home';
function ir(t,arg){ TELA=t; window.scrollTo(0,0); try{ speechSynthesis.cancel(); }catch(e){}
  if(t==='home') telaHome(); else if(t==='mapa') telaMapa(); else if(t==='missao') iniciar(arg); else if(t==='relatorio') telaRelatorio(); }
const T_=k=>Object.assign({missao:'Missão',missoes:'Missões',mapa:'Mapa das missões',entrar:'Começar 🚀',icMapa:'🗺️',valendo:'Valendo! 🚀',fim:'Missão cumprida! 🎉'},JOGO.TXT||{})[k];

function telaHome(){
  const H=JOGO.HOME;
  app.innerHTML=`<section class="home"><a class="voltar-plat" href="../index.html">← Todos os jogos</a><div class="hero"><div>
    <span class="selo">JRM • AVENTURAS EDUCATIVAS · MATEMÁTICA</span>
    <h1>${H.h1}</h1><p class="lead">${H.lead}</p>
    <div class="campos"><label>Seu primeiro nome<input id="in-nome" maxlength="20" autocomplete="off" value="${esc(S.nome)}"></label><label>Turma<input id="in-turma" maxlength="10" autocomplete="off" placeholder="${H.turma||'ex.: 7º A'}" value="${esc(S.turma)}"></label></div>
    ${JOGO.NIVEIS?`<div class="niveis" role="radiogroup" aria-label="Nível">${JOGO.NIVEIS.map(n=>`<button role="radio" aria-checked="${S.nivel===n.k}" data-nivel="${n.k}">${n.n}${n.d?`<small>${n.d}</small>`:''}</button>`).join('')}</div>`:''}
    <div class="acoes"><button class="btn ipe grande" data-ir="mapa">${T_('entrar')}</button><button class="btn" data-ir="relatorio">📊 Desempenho</button><button class="btn" data-acao="ajuda">❓ Como jogar</button><button class="btn icone" data-acao="config" aria-label="Configurações">⚙️</button></div>
  </div><div class="cena">${H.cena}</div></div>
  <div class="info">${H.info.map(([b,t])=>`<div><b>${b}</b>${t}</div>`).join('')}<div><b>${patente()}</b>★ ${totalEst()}/${maxEst()}</div></div>
  <p class="rodape">${H.rodape} · Progresso salvo neste navegador.</p></section>`;
  $('#in-nome').oninput=e=>{S.nome=e.target.value.trim();salvar();};
  $('#in-turma').oninput=e=>{S.turma=e.target.value.trim();salvar();};
}
function telaMapa(){
  const atual=JOGO.MISSOES.find(m=>liberada(m)&&!(S.missoes[m.id]||{}).feita);
  const niv=JOGO.NIVEIS?JOGO.NIVEIS.find(n=>n.k===S.nivel):null;
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="home" aria-label="Início">←</button><div class="tit"><h2>${T_('mapa')}</h2><small>${patente()}${niv?' · '+niv.n:''}</small></div><span class="chip-topo">★ ${totalEst()}/${maxEst()}</span><button class="btn icone" data-acao="config" aria-label="Configurações">⚙️</button></header>
  <section class="mapa"><div class="missoes">${JOGO.MISSOES.map(m=>{ const r=S.missoes[m.id]||{}; const lib=liberada(m);
    return `<button class="missao ${atual&&atual.id===m.id?'atual':''}" data-missao="${m.idx}" ${lib?'':'disabled'}>${lib?'':'<span class="cad">🔒</span>'}
      <span class="ic" aria-hidden="true">${m.ic}</span><span class="num">${T_('missao').toUpperCase()} ${m.idx+1}</span><h3>${esc(m.titulo)}</h3><p>${esc(m.desc)}</p><span class="hab">${m.hab}</span>
      <span class="est">${estrelasHtml(r.estrelas||0)}</span></button>`; }).join('')}</div>
  <p class="nota">Complete uma ${T_('missao').toLowerCase()} para liberar a próxima. Professor(a): em ⚙️ dá para liberar todas.${JOGO.NIVEIS?' O nível muda na tela inicial.':''}</p></section>`;
}

/* ---------- MISSÃO ---------- */
let M=null;
function iniciar(idx){
  const m=JOGO.MISSOES[idx];
  M={m, itens:m.gerar(S.nivel), i:0, ok:0, total:0, primeira:{}};
  telaMissao();
  abrirModal(`<span class="selo">${T_('missao').toUpperCase()} ${m.idx+1} · ${m.hab}</span><h2 style="margin-top:10px">${m.ic} ${esc(m.titulo)}</h2>${m.intro||`<p>${esc(m.desc)}</p>`}<div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>${T_('valendo')}</button></div>`);
}
function registrar(chave, cat, ok){
  if(M.primeira[chave]!=null) return; M.primeira[chave]=ok; M.total++; if(ok) M.ok++;
  S.stats[cat]=S.stats[cat]||{ok:0,total:0}; S.stats[cat].total++; if(ok) S.stats[cat].ok++; salvar();
}
function telaMissao(){
  const m=M.m;
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="mapa" aria-label="Voltar">←</button><div class="tit"><h2>${m.ic} ${esc(m.titulo)}</h2><small>${T_('missao')} ${m.idx+1} · ${m.hab}</small></div><button class="btn icone" data-acao="config" aria-label="Configurações">⚙️</button></header>
  <section class="jogo"><div class="barra"><span id="cont"></span><div class="trilho"><i id="trilho"></i></div></div><div class="painel" id="area"></div></section>`;
  desenhar();
}
const item=()=>M.itens[M.i];
const tipoDe=it=>JOGO.TIPOS&&JOGO.TIPOS[it.tipo]||{};
function desenhar(){
  const it=item();
  $('#cont').textContent=`${M.i+1}/${M.itens.length}`; $('#trilho').style.width=(100*M.i/M.itens.length)+'%';
  const T=tipoDe(it);
  const resp=it.tipo==='mc'?mcHtml(it):it.tipo==='num'?numHtml(it):T.desenhar(it);
  $('#area').innerHTML=`<div class="enun-linha"><p class="enunciado">${it.enun}</p>${JOGO.FALA?`<button class="btn icone falar" data-acao="falar" aria-label="Ouvir a pergunta">🔊</button>`:''}</div>${it.corpo||''}${resp}<div id="ret">${it.feito?okBox(it):(it.msg||'')}</div>`;
  if(T.depois) T.depois(it);
  const b=$('[data-acao="seguir"]'); if(b) b.focus({preventScroll:true});
  else if(it.tipo==='num'&&!it.feito&&matchMedia('(pointer:fine)').matches){ const n=$('#num'); if(n) n.focus({preventScroll:true}); }
}
function botaoSeguir(){ return `<div class="seguir"><button class="btn agua" data-acao="seguir">${M.i<M.itens.length-1?'Próximo ➔':'Concluir ✔'}</button></div>`; }
function okBox(it){ return `<div class="retorno ok"><span class="t">${it.revelado?'👀 Veja a resposta':'✅ '+(it.okt||'Isso mesmo!')}</span>${it.x||''}</div>${botaoSeguir()}`; }
function seguir(){ M.i++; if(M.i>=M.itens.length) return concluir(); desenhar(); window.scrollTo(0,0); }
const ELOGIOS=['Isso mesmo!','Muito bem!','Mandou bem!','Certinho!','Excelente!','Perfeito!'];
/* ponto único de correção para todos os tipos de questão */
function responder(ok, dica){
  const it=item(); if(it.feito) return;
  registrar('i'+M.i, it.cat, ok);
  if(ok){ it.feito=true; it.msg=''; it.okt=pick(ELOGIOS); som('ok'); }
  else { it.tent=(it.tent||0)+1; som('erro');
    const rev=it.tipo!=='mc'&&it.tent>=2&&it.mostrar!=null;
    it.msg=`<div class="retorno no"><span class="t">Ainda não.</span>${dica||it.dica||'Confira com calma e tente de novo.'}${rev?`<div class="seguir" style="justify-content:flex-start"><button class="btn" data-acao="revelar">👀 Ver a resposta</button></div>`:''}</div>`; }
  desenhar();
}
function revelar(){ const it=item(); it.feito=true; it.revelado=true; it.msg=''; if(it.tipo==='num') it.dig=String([].concat(it.resp)[0]).replace('.',','); it.x=`A resposta é <b>${it.mostrar}</b>. ${it.x||''}`; const T=tipoDe(it); if(T.revelar) T.revelar(it); desenhar(); }

/* múltipla escolha */
function mcHtml(it){
  return `<div class="opcoes ${it.grade?'grade':''} ${it.grandes?'grandes':''}">${it.op.map((o,j)=>{ const er=(it.err||[]).includes(j);
    return `<button class="op ${er?'errada':''} ${it.feito&&j===it.certo?'certa':''}" data-op="${j}" ${er||it.feito?'disabled':''}>${it.grade?'':`<b>${'ABCDEF'[j]}</b>`}<span>${it.html?o:esc(o)}</span></button>`; }).join('')}</div>`;
}
function responderMC(j){ const it=item(); if(it.feito) return; if(j!==it.certo) it.err=(it.err||[]).concat(j); responder(j===it.certo, typeof it.dica==='function'?it.dica(it.op[j]):null); }

/* resposta numérica */
function numHtml(it){
  return `<div class="resp-num">${it.antes?`<span class="un">${it.antes}</span>`:''}<input id="num" type="text" inputmode="${it.sinal?'text':'decimal'}" autocomplete="off" aria-label="Sua resposta" ${it.feito?'disabled':''} value="${esc(it.dig||'')}" placeholder="?">${it.un?`<span class="un">${it.un}</span>`:''}
    ${it.feito?'':`${it.sinal?'<button class="btn" data-acao="sinal" aria-label="Trocar o sinal">±</button>':''}<button class="btn agua" data-acao="conferir">Conferir</button>`}</div>`;
}
function lerNum(s){ s=String(s).trim().replace(/R\$|\s/g,'').replace(/[−–]/g,'-').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); if(!/^-?\d*\.?\d+$/.test(s)) return NaN; return Number(s); }
function conferirNum(){
  const it=item(), el=$('#num'); if(!el) return; it.dig=el.value; const v=lerNum(el.value);
  if(isNaN(v)){ toast('Digite um número.'); el.focus(); return; }
  const aceitas=[].concat(it.resp); const ok=aceitas.some(r=>Math.abs(r-v)<1e-9);
  responder(ok, typeof it.dica==='function'?it.dica(v):null);
}

function concluir(){
  const acc=M.total? M.ok/M.total : 1; const est=acc>=.9?3:acc>=.7?2:1;
  const m=M.m, a=S.missoes[m.id]||{}; S.missoes[m.id]={feita:true, estrelas:Math.max(a.estrelas||0,est), vezes:(a.vezes||0)+1}; salvar();
  som('fim');
  const prox=m.idx<JOGO.MISSOES.length-1;
  abrirModal(`<h2 style="text-align:center">${T_('fim')}</h2><div class="big-est">${estrelasHtml(est)}</div>
    <div class="resumo"><div><b>${M.ok}/${M.total}</b>acertos de primeira</div><div><b>${patente().split(' ').slice(1).join(' ')}</b>seu título</div></div>
    <p class="mini" style="text-align:center">3 estrelas: 90% ou mais de primeira · 2 estrelas: 70% ou mais. As questões mudam a cada vez que você joga.</p>
    <div class="acoes" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" data-acao="repetir">↻ De novo</button>
      ${prox?`<button class="btn ipe" data-acao="prox" data-foco>Próxima ${T_('missao').toLowerCase()} ➔</button>`:'<button class="btn ipe" data-ir="relatorio" data-foco>📊 Desempenho</button>'}</div>`);
}

/* ---------- RELATÓRIO ---------- */
function linhasRel(){ return Object.keys(JOGO.CATS).filter(k=>S.stats[k]&&S.stats[k].total).map(k=>({k,nome:JOGO.CATS[k],ok:S.stats[k].ok,total:S.stats[k].total,pct:Math.round(100*S.stats[k].ok/S.stats[k].total)})); }
function textoRel(){ const L=linhasRel(); const f=JOGO.MISSOES.filter(m=>(S.missoes[m.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60).map(l=>l.nome);
  const niv=JOGO.NIVEIS?JOGO.NIVEIS.find(n=>n.k===S.nivel):null;
  return [JOGO.NOME.toUpperCase()+' — Relatório',`Estudante: ${S.nome||'(sem nome)'} · Turma: ${S.turma||'-'} · ${new Date().toLocaleDateString('pt-BR')}`,`Título: ${patente().replace(/^\S+\s/,'')} · Estrelas: ${totalEst()}/${maxEst()} · ${T_('missoes')}: ${f}/${JOGO.MISSOES.length}${niv?' · Nível: '+niv.n:''}`,'Acertos na 1ª tentativa:',
    ...(L.length?L.map(l=>`- ${l.nome}: ${l.ok}/${l.total} (${l.pct}%)`):['- (ainda sem dados)']),`Retomar: ${ret.length?ret.join('; '):'nada urgente'}`].join('\n'); }
function telaRelatorio(){
  const L=linhasRel(); const ret=L.filter(l=>l.total>=3&&l.pct<60);
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="home" aria-label="Início">←</button><div class="tit"><h2>Meu desempenho</h2><small>${S.nome?esc(S.nome):'Estudante'}${S.turma?' · '+esc(S.turma):''}</small></div><button class="btn" data-ir="mapa">${T_('icMapa')} ${T_('missoes')}</button></header>
  <section class="pg"><div class="resumo" style="justify-content:flex-start"><div><b>${patente()}</b>título</div><div><b>★ ${totalEst()}/${maxEst()}</b>estrelas</div></div>
    <div class="cartao"><h3>Acertos na 1ª tentativa</h3>${L.length?L.map(l=>`<div class="cat"><span>${esc(l.nome)}</span><div class="bar"><i style="width:${l.pct}%"></i></div><span class="n">${l.ok}/${l.total} · ${l.pct}%</span></div>`).join(''):'<p class="mini">Jogue algumas missões para ver seus resultados aqui.</p>'}</div>
    ${ret.length?`<div class="cartao" style="background:#FFF7D6;border-color:#F6D776"><b>Para treinar mais:</b> ${ret.map(l=>esc(l.nome)).join(', ')}.</div>`:''}
    <div class="cartao"><h3>Enviar para o professor</h3><p class="mini">Copie o relatório e cole no grupo da turma ou onde o professor indicar.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn ipe" data-acao="copiar-rel">📋 Copiar relatório</button><button class="btn" data-acao="apagar" id="btn-apagar">🗑️ Apagar meu progresso</button></div></div></section>`;
}

/* ---------- CONFIG / AJUDA ---------- */
function telaConfig(){
  const l=(k,t,d)=>`<div class="cfg-linha"><span>${t}<small>${d}</small></span><button class="troca" role="switch" aria-checked="${!!S.cfg[k]}" data-cfg="${k}" aria-label="${t}"></button></div>`;
  abrirModal(`<h2>Configurações</h2>${l('som','Efeitos sonoros','')}${l('livre','Liberar todas as '+T_('missoes').toLowerCase(),'Para o professor escolher a da aula.')}<div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Pronto</button></div>`);
}
function telaAjuda(){ abrirModal(`<h2>Como jogar</h2><div class="lista">${JOGO.AJUDA.map(t=>`<div>${t}</div>`).join('')}</div><div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Entendi!</button></div>`); }
function copiar(txt){ const okk=()=>toast('Copiado! 📋'); const fb=()=>{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');okk();}catch(e){toast('Não deu para copiar.');} t.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(okk).catch(fb); else fb(); }

/* ---------- EVENTOS ---------- */
let armado=false;
document.addEventListener('click',e=>{
  const q=s=>{ const el=e.target.closest(s); return el&&!el.disabled?el:null; };
  let el;
  if(el=e.target.closest('[data-ir]')){ if(modalAberto()) fecharModal(); ir(el.dataset.ir); return; }
  if(el=q('[data-missao]')){ ir('missao',+el.dataset.missao); return; }
  if(el=q('[data-nivel]')){ const v=el.dataset.nivel; S.nivel=isNaN(+v)?v:+v; salvar(); $$('[data-nivel]').forEach(b=>b.setAttribute('aria-checked',b===el)); return; }
  if(el=q('[data-op]')){ responderMC(+el.dataset.op); return; }
  if(el=q('[data-x]')){ const it=item(); const T=tipoDe(it); if(T.acao&&!it.feito) T.acao(it, el.dataset.x, el); return; }
  if(el=e.target.closest('[data-cfg]')){ const k=el.dataset.cfg; S.cfg[k]=!S.cfg[k]; el.setAttribute('aria-checked',S.cfg[k]); salvar(); if(TELA==='mapa') telaMapa(); return; }
  const ac=q('[data-acao]'); if(!ac) return; const a=ac.dataset.acao;
  if(a==='fechar') fecharModal();
  else if(a==='ajuda') telaAjuda();
  else if(a==='config') telaConfig();
  else if(a==='seguir') seguir();

   FEIRINHA DO PANTANAL — Matemática · 1º e 2º ano

   ========================================================= */
const FRUTAS=[['🥭','manga','mangas'],['🍌','banana','bananas'],['🍍','abacaxi','abacaxis'],['🍉','melancia','melancias'],['🍊','laranja','laranjas'],['🥥','coco','cocos'],['🌽','espiga de milho','espigas de milho'],['🥚','ovo','ovos']];
const NOMES=['Ana','Zé','Kauã','Maria','Pedro','Luana','Ícaro','Bia','Davi','Yara','Tainá','Caio'];
const DOIS=()=>{ const a=embaralhar(NOMES); return [a[0],a[1]]; };
function emojis(n, e, grupo=5, riscar=0){
  let h='', k=0; const gs=[]; for(let i=0;i<n;i+=grupo) gs.push(Math.min(grupo,n-i));
  gs.forEach(g=>{ h+='<span class="grupo">'; for(let j=0;j<g;j++){ h+=`<span class="${k>=n-riscar?'riscado':''}">${e}</span>`; k++; } h+='</span>'; });
  return `<div class="emojis" aria-label="${n}">${h}</div>`;
}
const ano=()=>S.nivel||1;

/* ---- 1. contar ---- */
function gerarContar(){
  const it=[]; const fr=embaralhar(FRUTAS);
  for(let i=0;i<8;i++){ const f=fr[i%fr.length];
    if(ano()===1){ const n=i<3?rnd(3,9):rnd(10,20);
      it.push(mc({cat:'contar', grade:true, enun:`Quantas ${f[2]} tem na barraca?`, corpo:`<div class="vis">${emojis(n,f[0])}</div>`,
        x:`São <b>${n}</b> ${f[2]}. Contar de 5 em 5 ajuda: os grupinhos têm 5.`, dica:'Conte devagar, tocando com o dedo em cada uma. Os grupinhos têm 5.'}, String(n), vizinhos(n,[1,-1,2,-2,5,-5],1).map(String)));
    } else { const d=rnd(1,8), u=rnd(0,9), n=10*d+u;
      it.push(mc({cat:'contar', grade:true, enun:`Cada cesto tem 10 ${f[2]}. Quantas ${f[2]} há ao todo?`,
        corpo:`<div class="vis"><div class="emojis">${Array.from({length:d},()=>`<span class="cesto">🧺<small>10 ${f[0]}</small></span>`).join('')}</div>${u?emojis(u,f[0]):''}</div>`,
        x:`${d} cesto${d>1?'s':''} de 10 = <b>${10*d}</b>, mais ${u} solta${u===1?'':'s'}: <b>${n}</b>. São ${d} dezena${d>1?'s':''} e ${u} unidade${u===1?'':'s'}.`,
        dica:'Conte os cestos de 10 em 10 (10, 20, 30…) e depois some as frutas soltas.'}, String(n), [10*u+d, n+10, n-10, n+1, n-1].filter(v=>v>0&&v!==n).map(String)));

/* ---- 2. comparar ---- */
function gerarComparar(){
  const it=[];
  for(let i=0;i<8;i++){
    if(ano()===1||i<4){ const f=pick(FRUTAS), [A,B]=DOIS(); const max=ano()===1?12:20;
      let a=rnd(2,max), b=rnd(2,max); if(i===3) b=a; const mais=Math.random()<.6;
      const certo=a===b?'As duas têm a mesma quantidade':(mais?(a>b?A:B):(a<b?A:B));
      it.push(mc({cat:'comparar', grandes:true, enun:`Qual barraca tem <b>${mais?'MAIS':'MENOS'}</b> ${f[2]}?`,
        corpo:`<div class="vis"><div class="barracas"><div class="barraca"><b>Barraca de ${A}</b>${emojis(a,f[0])}</div><div class="barraca"><b>Barraca de ${B}</b>${emojis(b,f[0])}</div></div></div>`,
        x:`${A} tem ${a} e ${B} tem ${b}. ${a===b?`${a} = ${b}: é a mesma quantidade!`:`${Math.max(a,b)} é maior que ${Math.min(a,b)}.`}`, dica:'Conte as frutas de cada barraca e compare os números.'},
        certo, [A,B,'As duas têm a mesma quantidade'].filter(o=>o!==certo)));
    } else { const t=i%4;

        it.push(mc({cat:'comparar', grade:true, enun:'Qual número é o <b>maior</b>?', x:`${m} é maior. Compare primeiro as dezenas; se forem iguais, compare as unidades.`,
          dica:'Olhe primeiro o algarismo das dezenas.'}, String(m), [String(Math.min(a,b))])); }
      else if(t===1){ const n=rnd(11,98);
        it.push(mc({cat:'comparar', grade:true, enun:`Que número vem <b>logo depois</b> de ${n}?`, x:`Depois de ${n} vem <b>${n+1}</b> (o sucessor).`, dica:'É só somar 1.'}, String(n+1), [String(n-1),String(n+10),String(n+2)])); }
      else if(t===2){ const n=rnd(11,98);
        it.push(mc({cat:'comparar', grade:true, enun:`Que número vem <b>logo antes</b> de ${n}?`, x:`Antes de ${n} vem <b>${n-1}</b> (o antecessor).`, dica:'É só tirar 1.'}, String(n-1), [String(n+1),String(n-10),String(n-2)])); }
      else { const d=rnd(2,9), u=rnd(1,9);
        it.push(mc({cat:'comparar', grade:true, enun:`Qual número tem <b>${d} dezenas</b> e <b>${u} unidade${u>1?'s':''}</b>?`, x:`${d} dezenas = ${d*10}, mais ${u}: <b>${d*10+u}</b>.`, dica:'As dezenas ficam à esquerda; as unidades, à direita.'}, String(d*10+u), [String(u*10+d),String(d+u),String(d*10)])); }
    }
  }

}
/* ---- 3. juntar e retirar ---- */
function gerarOperar(){
  const it=[];
  for(let i=0;i<8;i++){ const f=pick(FRUTAS), N=pick(NOMES), soma=i%2===0;
    if(ano()===1){
      if(soma){ const a=rnd(2,8), b=rnd(1,Math.min(7,10-a+ (i>3?6:0))), r=a+b;

      } else { const a=rnd(5,i>3?18:10), b=rnd(1,a-1), r=a-b;

      }
    } else {

        it.push(mc({cat:'operar', grade:true, enun:`Na feira havia ${a} ${f[2]}. Chegaram mais ${b}. Quantas há agora?`, x:`${a} + ${b} = <b>${r}</b>. Dica: some as dezenas e depois as unidades.`,
          dica:'Some as dezenas com as dezenas e as unidades com as unidades.'}, String(r), vizinhos(r,[1,-1,10,-10,2],1).map(String)));
      } else { const a=rnd(20,60), b=rnd(5,19), r=a-b;

          dica:'Tire primeiro as dezenas e depois as unidades. Se precisar, troque 1 dezena por 10 unidades.'}, String(r), vizinhos(r,[1,-1,10,-10,2],0).map(String)));

const PADROES=[['🍌','🥭'],['🍉','🍉','🍍'],['🍊','🥥','🌽'],['🥭','🍌','🍌'],['🍍','🍉','🍊','🍉']];
