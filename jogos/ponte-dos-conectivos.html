<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponte dos Conectivos</title>
<meta name="description" content="Jogo de conectivos para o 5º ao 9º ano: escolha a palavra que liga as ideias para a capivara atravessar o rio. Habilidades MS.EF05LP07, MS.EF08LP13 e MS.EF69LP18.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ceu:#E0F2FE; --ceu2:#F0FDF4; --tinta:#14261B; --suave:#4D5F55; --mata:#3F7D20; --mata2:#65A30D; --rio:#0EA5B7;
  --madeira:#A0682F; --madeira-e:#6F4519; --creme:#FFFBF2; --borda:#E4D7BC; --ok:#15803D; --ok-f:#DCFCE7; --erro:#DC2626; --erro-f:#FEE2E2; --ouro:#F5B700;
  --titulo:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --texto:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;font-family:var(--texto);font-size:17px;color:var(--tinta);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,var(--ceu),var(--ceu2) 60%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.btn{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.verde{background:var(--mata);border-color:#2C5A15;color:#fff;box-shadow:0 4px 0 #2C5A15}
.btn.verde:hover{background:#4A8F27}
.btn.grande{font-size:20px;padding:16px 26px;font-family:var(--titulo)}
.btn.icone{padding:10px 14px}
.selo{display:inline-block;font-family:var(--titulo);font-weight:800;letter-spacing:2px;font-size:12px;color:var(--mata);background:#3F7D2018;padding:5px 12px;border-radius:30px}

/* HOME */
.home{max-width:1100px;margin:auto;padding:28px 20px 34px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center}
.hero h1{font-size:clamp(44px,7vw,78px);font-weight:800;margin:12px 0 8px;letter-spacing:-1px}
.hero h1 span{color:var(--madeira)}
.lead{font-size:19px;line-height:1.6;color:#33473B;max-width:540px;margin:0 0 16px}
.campos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;color:var(--suave)}
.campos input{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:10px 12px;width:190px;font-size:17px}
.campos label:last-child input{width:110px}
.acoes{display:flex;flex-wrap:wrap;gap:10px}
.cena-home{border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 40px #0f3d2a33}
.info{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 8px}
.info div{flex:1;min-width:150px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--suave)}
.info b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.rodape{font-size:13px;color:var(--suave);line-height:1.6;margin-top:12px}

/* TOPO */
.topo{position:sticky;top:0;z-index:25;background:#E0F2FEee;backdrop-filter:blur(6px);border-bottom:2px solid #BAE6FD;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topo .tit{flex:1;min-width:0}
.topo h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{color:var(--suave);font-size:13px}
.topo .btn{min-height:42px;padding:8px 12px}
.chip-topo{font-family:var(--titulo);font-weight:800;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:6px 12px;white-space:nowrap}

/* MAPA */
.mapa{max-width:1000px;margin:auto;padding:22px 16px 40px}
.fases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fase{position:relative;text-align:left;background:#fff;border:3px solid var(--borda);border-radius:20px;padding:16px;min-height:170px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.fase:hover:not(:disabled){transform:translateY(-3px)}
.fase:disabled{opacity:.5;cursor:not-allowed}
.fase .num{font-family:var(--titulo);font-weight:800;color:var(--madeira);letter-spacing:1px;font-size:14px}
.fase h3{font-size:22px}
.fase .cons{font-size:14px;color:var(--suave);line-height:1.4}
.fase .est{margin-top:auto;font-size:20px;letter-spacing:2px;color:#E2D8C2}
.fase .est .on{color:var(--ouro)}
.fase .cad{position:absolute;top:12px;right:14px}
.fase.atual{border-color:var(--mata);box-shadow:0 0 0 4px #3F7D2033}
.nota{color:var(--suave);font-size:13px;margin-top:16px;line-height:1.5}

/* JOGO */
.jogo{max-width:860px;margin:auto;padding:14px 16px 40px}
.pontos{display:flex;gap:6px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.pontos i{width:12px;height:12px;border-radius:50%;background:#C7D7CB}
.pontos i.ok{background:var(--ok)}.pontos i.meio{background:var(--ouro)}.pontos i.agora{box-shadow:0 0 0 3px var(--madeira)}
.cena{border-radius:20px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 24px #0f3d2a26;background:#BAE6FD}
.cena svg{display:block;width:100%;height:auto}
.prancha{transition:opacity .25s,transform .35s;opacity:0;transform:translateY(-24px)}
.prancha.on{opacity:1;transform:translateY(0)}
.capi{transition:transform 1.5s ease-in-out}
.capi.semtrans{transition:none}
.capi.balanca{animation:balanca .5s ease 2}
@keyframes balanca{25%{transform:translateX(60px) rotate(-6deg)}75%{transform:translateX(60px) rotate(6deg)}}
.cai{animation:cai 1s ease-in forwards}
@keyframes cai{to{transform:translate(10px,110px) rotate(40deg);opacity:0}}
.respingo{animation:resp .8s ease-out forwards;transform-origin:center;transform-box:fill-box}
@keyframes resp{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.onda{animation:onda 3s linear infinite}
@keyframes onda{to{transform:translateX(-60px)}}
.frase-card{margin-top:14px;background:var(--creme);border:3px solid var(--borda);border-radius:20px;padding:18px;font-size:clamp(20px,3vw,25px);line-height:1.6}
.frase-card .lado{font-weight:400}
.vao{display:inline-block;min-width:4.2em;text-align:center;border:3px dashed var(--madeira);border-radius:10px;padding:0 .3em;margin:0 .15em;color:var(--madeira);font-weight:700;background:#fff}
.vao.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-f)}
.con{font-weight:700;color:var(--madeira);background:#FDF0DC;border-radius:6px;padding:0 1px}
.pergunta{font-family:var(--titulo);font-size:20px;margin:14px 0 8px}
.tabuas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tabua{border:0;border-radius:12px;min-height:58px;padding:10px 14px;font-family:var(--titulo);font-weight:800;font-size:21px;color:#fff;background:repeating-linear-gradient(90deg,#A0682F 0 30px,#97612B 30px 32px);box-shadow:0 5px 0 var(--madeira-e);text-shadow:0 1px 0 #0004;transition:transform .1s}
.tabua:hover:not(:disabled){transform:translateY(-3px)}
.tabua:disabled{cursor:default}
.tabua.quebrada{background:#C9B79F;box-shadow:0 5px 0 #9C8A72;text-decoration:line-through;opacity:.7}
.tabua.certa{background:var(--ok);box-shadow:0 5px 0 #0F5A2B}
.placa{border:0;border-radius:12px;min-height:54px;padding:10px 14px;font-weight:700;font-size:17px;background:#fff;border:3px solid var(--borda);text-align:left}
.placa:hover:not(:disabled){border-color:var(--madeira)}
.placa.quebrada{opacity:.5;text-decoration:line-through;border-color:var(--erro)}
.placa.certa{border-color:var(--ok);background:var(--ok-f)}
.placa small{display:block;font-weight:400;color:var(--suave);font-size:13px}
.retorno{margin-top:14px;border-radius:16px;padding:14px 16px;line-height:1.55;border:3px solid var(--borda);background:#fff}
.retorno.ok{border-color:#86EFAC;background:#F0FDF4}
.retorno.no{border-color:#FCA5A5;background:#FFF5F5}
.retorno .t{display:block;font-family:var(--titulo);font-size:21px;margin-bottom:4px}
.seguir{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
.combo{font-family:var(--titulo);font-weight:800;color:#C2410C}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:#0f2a1cb3;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--creme);border-radius:24px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:24px;border:3px solid var(--borda);box-shadow:0 30px 80px #0006}
.modal h2{font-size:30px;margin-bottom:8px}
.modal p{line-height:1.6;margin:8px 0}
.modal .acoes{margin-top:18px}
.rels{display:grid;gap:8px;margin-top:10px}
.rels div{background:#fff;border:2px solid var(--borda);border-radius:12px;padding:8px 12px;line-height:1.45}
.rels b{color:var(--madeira)}
.mini{font-size:13px;color:var(--suave)}
.big-est{font-size:58px;letter-spacing:8px;text-align:center}
.big-est span{display:inline-block;color:#E2D8C2;opacity:0;transform:scale(.4);animation:surge .5s forwards}
.big-est span.on{color:var(--ouro)}
.big-est span:nth-child(2){animation-delay:.25s}.big-est span:nth-child(3){animation-delay:.5s}
@keyframes surge{to{opacity:1;transform:scale(1)}}
.resumo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.resumo div{background:#fff;border:2px solid var(--borda);border-radius:14px;padding:8px 14px;text-align:center;font-size:13px;color:var(--suave)}
.resumo b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.texto-final{background:#fff;border:2px solid var(--borda);border-radius:14px;padding:12px 14px;line-height:1.7;margin-top:10px}
.cfg-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 14px;margin:8px 0}
.cfg-linha small{display:block;color:var(--suave);font-size:13px}
.troca{position:relative;width:56px;height:32px;flex:none;border-radius:20px;border:0;background:#D6CAB5}
.troca::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.troca[aria-checked="true"]{background:var(--ok)}
.troca[aria-checked="true"]::after{left:28px}

/* PÁGINAS */
.pg{max-width:860px;margin:auto;padding:20px 16px 40px}
.cartao{background:#fff;border:3px solid var(--borda);border-radius:20px;padding:18px;margin-bottom:16px}
.cartao h3{font-size:22px;margin-bottom:10px}
.cat{display:grid;grid-template-columns:minmax(170px,1.3fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}
.cat:last-child{border-bottom:0}
.bar{height:14px;border-radius:10px;background:#EEE6D3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--madeira)}
.cat .n{font-weight:700;white-space:nowrap}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--suave)}
.campo input,.campo textarea{border:2px solid var(--borda);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;color:var(--tinta);font-weight:400;width:100%}
.campo textarea{min-height:200px;line-height:1.6;resize:vertical}
.link-box{word-break:break-all;background:#F4EEDF;border-radius:12px;padding:10px;font-size:14px;margin-top:10px}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:60;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .cena-home{order:-1}
  .topo{padding:8px 10px;gap:6px}
  .topo small{display:none}
  .topo h2{font-size:17px}
  .chip-topo{padding:4px 8px;font-size:14px}
  .tabuas{grid-template-columns:1fr 1fr}
  .tabua{font-size:18px;min-height:52px}
  .frase-card{padding:14px}
  .cat{grid-template-columns:1fr auto}
  .cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   PONTE DOS CONECTIVOS — JRM • Aventuras Educativas (jrmapps.com)
   Habilidades: MS.EF05LP07 · MS.EF08LP13 · MS.EF69LP18
   ---------------------------------------------------------
   Itens de PONTE:  {a:'parte 1', b:'parte 2', ops:['mas:oposição*','porque:causa','e:adição~nota opcional'], nova:true?}
     * = certo (pode haver mais de um) · ~ = explicação extra para aquela opção
     nova:true = o conectivo começa uma frase nova (“Além disso, …”)
   Itens de PLACA (nomear a relação): {tipo:'rel', frase:'texto', con:'por isso', ops:['consequência*','causa','oposição']}
   ========================================================= */

const RELACOES = {
  'adição':'soma uma ideia à outra', 'oposição':'mostra uma ideia contrária à anterior', 'causa':'explica o motivo',
  'consequência':'mostra o resultado', 'conclusão':'fecha um raciocínio', 'condição':'diz o que precisa acontecer',
  'finalidade':'mostra o objetivo', 'tempo':'situa no tempo', 'concessão':'admite um obstáculo que não impede a ideia principal',
  'exemplificação':'dá um exemplo', 'explicação':'explica de outro jeito o que foi dito'
};
const VIRGULA_ANTES = new Set(['mas','porém','contudo','no entanto','todavia','pois','então','por isso','portanto','logo','de modo que','já que','visto que','embora','ainda que','mesmo que']);

const FASES = [
 {id:'f1', titulo:'Primeiras pontes', ano:'5º ano', cons:'e · mas · quando', hab:'MS.EF05LP07',
  itens:[
   {a:'A capivara nadou no rio', b:'depois descansou na margem.', ops:['e:adição*','mas:oposição','se:condição']},
   {a:'Queríamos ir ao parque', b:'começou a chover.', ops:['mas:oposição*','e:adição','quando:tempo']},
   {a:'O ipê fica todo amarelo', b:'chega o fim do inverno.', ops:['quando:tempo*','mas:oposição','e:adição']},
   {a:'Lucas estudou muito', b:'tirou nota boa na prova.', ops:['e:adição*','mas:oposição~Com “mas”, a segunda parte teria que ser uma surpresa, algo contrário. Estudar e tirar nota boa combinam!','quando:tempo']},
   {a:'Lucas estudou muito', b:'não conseguiu terminar a prova a tempo.', ops:['mas:oposição*','e:adição','quando:tempo']},
   {a:'Vovó sorriu', b:'viu os netos chegando.', ops:['quando:tempo*','mas:oposição','e:adição']},
   {a:'Na feira, comprei pão, leite', b:'frutas.', ops:['e:adição*','mas:oposição','quando:tempo']},
   {a:'O cachorro latiu muito', b:'ninguém acordou.', ops:['mas:oposição*','e:adição','quando:tempo']}]},
 {id:'f2', titulo:'Por quê? E se?', ano:'5º ano', cons:'porque · se · para', hab:'MS.EF05LP07',
  itens:[
   {a:'Levei o guarda-chuva', b:'o céu estava nublado.', ops:['porque:causa*','se:condição','para:finalidade']},
   {a:'Vamos jogar bola no recreio', b:'não chover.', ops:['se:condição*','porque:causa','para:finalidade']},
   {a:'Ana guardou dinheiro', b:'comprar uma bicicleta.', ops:['para:finalidade*','porque:causa','se:condição']},
   {a:'As plantas murcharam', b:'ninguém regou o jardim.', ops:['porque:causa*','para:finalidade','se:condição']},
   {a:'Você pode sair mais cedo', b:'terminar a tarefa.', ops:['se:condição*','porque:causa','para:finalidade']},
   {a:'Fechei a janela', b:'os mosquitos não entrarem.', ops:['para:finalidade*','porque:causa','se:condição']},
   {a:'O jacaré ficou deitado no sol', b:'precisava se aquecer.', ops:['porque:causa*','se:condição','para:finalidade']},
   {a:'Leve um casaco', b:'faça frio à noite.', ops:['caso:condição*','porque:causa~Com “porque”, o verbo seria “faz”, e a frase diria que já está fazendo frio.','para:finalidade']}]},
 {id:'f3', titulo:'Por isso…', ano:'6º ano', cons:'por isso · então · portanto · de modo que', hab:'MS.EF08LP13',
  itens:[
   {a:'Choveu a noite toda', b:'o rio encheu.', ops:['por isso:consequência*','porque:causa','mas:oposição']},
   {a:'O rio encheu', b:'choveu a noite toda.', ops:['porque:causa*','por isso:consequência~Cuidado com a ordem! Aqui a segunda parte é o MOTIVO (a causa), não o resultado.','mas:oposição']},
   {a:'A ponte estava interditada', b:'pegamos outro caminho.', ops:['então:consequência*','porque:causa','quando:tempo']},
   {tipo:'rel', frase:'O ônibus atrasou, por isso cheguei tarde à escola.', con:'por isso', ops:['consequência*','causa','oposição','condição']},
   {a:'Os metais conduzem eletricidade, e o cobre é um metal', b:'o cobre conduz eletricidade.', ops:['portanto:conclusão*','porque:causa','mas:oposição']},
   {a:'Treinei todos os dias', b:'consegui completar a corrida.', ops:['por isso:consequência*','mas:oposição','se:condição']},
   {tipo:'rel', frase:'Fiquei com fome porque pulei o lanche.', con:'porque', ops:['causa*','consequência','finalidade','tempo']},
   {a:'A loja estava fechada', b:'voltamos para casa sem comprar nada.', ops:['de modo que:consequência*','para que:finalidade','se:condição']}]},
 {id:'f4', titulo:'Pontes formais', ano:'7º ano', cons:'porém · no entanto · pois · a fim de que · assim que', hab:'MS.EF08LP13',
  itens:[
   {a:'O time jogou bem', b:'perdeu nos pênaltis.', ops:['porém:oposição*','no entanto:oposição*','pois:causa']},
   {a:'Saí mais cedo', b:'precisava pegar o ônibus das sete.', ops:['pois:causa*','já que:causa*','porém:oposição']},
   {a:'A biblioteca ficará aberta até mais tarde', b:'os alunos possam estudar para as provas.', ops:['a fim de que:finalidade*','visto que:causa','porém:oposição']},
   {a:'Eu lavava a louça', b:'meu irmão secava os pratos.', ops:['enquanto:tempo*','porém:oposição','pois:causa']},
   {tipo:'rel', frase:'A excursão foi adiada, visto que a previsão era de tempestade.', con:'visto que', ops:['causa*','oposição','finalidade','consequência']},
   {a:'O filme era longo', b:'ninguém dormiu no cinema.', ops:['contudo:oposição*','já que:causa','a fim de que:finalidade']},
   {a:'Ligue para mim', b:'chegar em casa.', ops:['assim que:tempo*','porém:oposição','visto que:causa']},
   {tipo:'rel', frase:'Estudei bastante; no entanto, a prova foi mais difícil do que eu esperava.', con:'no entanto', ops:['oposição*','causa','conclusão','tempo']}]},
 {id:'f5', titulo:'Mesmo assim…', ano:'8º ano', cons:'embora · ainda que · mesmo que', hab:'MS.EF08LP13',
  itens:[
   {a:'Fomos pescar no rio', b:'estivesse nublado.', ops:['embora:concessão*','porque:causa~Com “porque”, o verbo seria “estava”. E nublado não é motivo para pescar!','portanto:conclusão']},
   {a:'Ele vai terminar o trabalho', b:'precise ficar acordado até tarde.', ops:['ainda que:concessão*','porque:causa','então:consequência']},
   {a:'Estava nublado', b:'fomos pescar no rio.', ops:['mas:oposição*','embora:concessão~A ideia combina, mas “embora” pede o verbo no subjuntivo: “embora estivesse nublado, fomos pescar”. Aqui o verbo “fomos” não serve.','pois:causa']},
   {tipo:'rel', frase:'Mesmo que chova, o jogo vai acontecer.', con:'Mesmo que', ops:['concessão*','condição~Parece condição, mas “mesmo que” diz que a chuva NÃO vai impedir o jogo.','causa','tempo']},

    } else {
      const v=$('#vao'); v.textContent=it.nova?cap(o.con):o.con; v.classList.add('ok');
      html=`<div class="retorno ok"><span class="t">✅ A ponte aguentou!</span>${juntar(it,o.con,true)}<br><span class="mini" style="font-size:15px">${o.rel?`Relação de <b>${esc(o.rel)}</b>: o conectivo ${RELACOES[o.rel]||'liga as ideias'}.`:''}${outros.length?` Também daria certo: <b>${outros.map(x=>esc(x.con)).join(', ')}</b>.`:''}</span></div>`;
      cenaAtravessar('rio');
    }
    const fraseFala = it.tipo==='rel'? it.frase : textoPuro(it,o.con);
    $('#ret').innerHTML=html+`<div class="seguir">${VOZ.ok?`<button class="btn" data-acao="ouvir" data-frase="${esc(fraseFala)}">🔊 Ouvir</button>`:''}<button class="btn verde" data-acao="seguir" data-foco>${F.i<F.itens.length-1?'Próxima ponte ➔':'Fim da fase ✔'}</button></div>`;
    $('[data-acao="seguir"]').focus();
  } else {
    registrar(false); F.combo=0; som('erro'); btn.classList.add('quebrada'); btn.disabled=true; cenaQueda('rio');
    const certo=relCorreta(it);
    let txt;
    if(it.tipo==='rel') txt=`“${esc(cap(o.con))}” ${RELACOES[o.con]?'('+RELACOES[o.con]+')':''} não é a relação aqui. Leia a frase de novo: o que a parte com “${esc(it.con)}” faz com a outra?`;
    else txt= o.rel ? `Você escolheu “<b>${esc(o.con)}</b>”, que indica <b>${esc(o.rel)}</b>${RELACOES[o.rel]?' ('+RELACOES[o.rel]+')':''}. Aqui a relação entre as ideias é outra.` : `“<b>${esc(o.con)}</b>” não liga bem essas duas ideias. Leia as duas partes de novo e pense na relação entre elas.`;
    if(o.nota) txt+=`<br>💡 ${esc(o.nota)}`;
    $('#ret').innerHTML=`<div class="retorno no"><span class="t">💦 Splash! A tábua caiu no rio.</span>${txt}</div>`;
  }
  const c=$('#combo'); if(c) c.textContent='🔥 '+F.combo;
  desenharPontos();
}
function seguir(){ F.i++; if(F.i>=F.itens.length) return concluir(); desenharItem(); window.scrollTo(0,0); }
function concluir(){
  const ok=Object.values(F.primeira).filter(Boolean).length, n=F.itens.length; const acc=ok/n; const est=acc>=.875?3:acc>=.625?2:1;
  const f=F.f;
  if(f.id!=='custom'){ const a=S.fases[f.id]||{}; S.fases[f.id]={feita:true, estrelas:Math.max(a.estrelas||0,est), vezes:(a.vezes||0)+1}; salvar(); }
  som('fim');
  let artigo='';
  if(f.artigo){ artigo=`<div class="texto-final"><b>${esc(f.artigo)}</b><br>${F.itens.map(it=> it.tipo==='rel'? destacarCon(it.frase,it.con) : juntar(it, it.opsL.find(o=>o.ok).con, true)).join(' ')}</div><p class="mini">Repare como os conectivos organizam o artigo: somam argumentos, dão exemplos, rebatem objeções e concluem.</p>`; }
  const prox = f.id!=='custom' && f.idx<FASES.length-1;
  abrirModal(`<h2 style="text-align:center">Rio atravessado! 🦫🌉</h2><div class="big-est">${estrelasHtml(est)}</div>
    <div class="resumo"><div><b>${ok}/${n}</b>pontes de primeira</div><div><b>🔥 ${F.melhorCombo}</b>maior sequência</div></div>
    <p class="mini" style="text-align:center">3 estrelas: 7 ou 8 de primeira · 2 estrelas: 5 ou 6.</p>${artigo}
    <div class="acoes" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" data-acao="repetir">↻ De novo</button>
      ${prox?'<button class="btn verde" data-acao="prox" data-foco>Próxima fase ➔</button>':'<button class="btn verde" data-ir="relatorio" data-foco>📊 Desempenho</button>'}</div>`);
}

/* ---------- RELATÓRIO ---------- */
function linhasRel(){ return Object.keys(RELACOES).concat(['outros']).filter(k=>S.stats[k]&&S.stats[k].total).map(k=>({k,nome:k==='outros'?'Fases criadas':cap(k),hab:HAB_REL[k]||'',ok:S.stats[k].ok,total:S.stats[k].total,pct:Math.round(100*S.stats[k].ok/S.stats[k].total)})); }
function textoRel(){ const L=linhasRel(); const f=FASES.filter(x=>(S.fases[x.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60).map(l=>l.nome);
  return ['PONTE DOS CONECTIVOS — Relatório',`Estudante: ${S.nome||'(sem nome)'} · Turma: ${S.turma||'-'} · ${new Date().toLocaleDateString('pt-BR')}`,`Estrelas: ${totalEst()}/${MAXEST} · Fases: ${f}/${FASES.length}`,'Acertos na 1ª tentativa, por relação de sentido:',
    ...(L.length?L.map(l=>`- ${l.nome}${l.hab?' ('+l.hab+')':''}: ${l.ok}/${l.total} (${l.pct}%)`):['- (ainda sem dados)']),`Retomar: ${ret.length?ret.join('; '):'nada urgente'}`].join('\n'); }
function telaRelatorio(){
  const L=linhasRel(); const f=FASES.filter(x=>(S.fases[x.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60);
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="home" aria-label="Início">←</button><div class="tit"><h2>Meu desempenho</h2><small>${S.nome?esc(S.nome):'Estudante'}${S.turma?' · '+esc(S.turma):''}</small></div><button class="btn" data-ir="mapa">🌉 Fases</button></header>
  <section class="pg"><div class="resumo" style="justify-content:flex-start"><div><b>★ ${totalEst()}/${MAXEST}</b>estrelas</div><div><b>${f}/${FASES.length}</b>fases</div></div>
    <div class="cartao"><h3>Acertos na 1ª tentativa, por relação de sentido</h3>${L.length?L.map(l=>`<div class="cat"><span>${esc(l.nome)} ${l.hab?`<span class="mini">${l.hab}</span>`:''}</span><div class="bar"><i style="width:${l.pct}%"></i></div><span class="n">${l.ok}/${l.total} · ${l.pct}%</span></div>`).join(''):'<p class="mini">Jogue algumas fases para ver seus resultados aqui.</p>'}</div>
    ${ret.length?`<div class="cartao" style="background:#FFF7D6;border-color:#F6D776"><b>Para treinar mais:</b> ${ret.map(l=>esc(l.nome)).join(', ')}.</div>`:''}
    <div class="cartao"><h3>Enviar para o professor</h3><p class="mini">Copie o relatório e cole no grupo da turma ou onde o professor indicar.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn verde" data-acao="copiar-rel">📋 Copiar relatório</button><button class="btn" data-acao="apagar" id="btn-apagar">🗑️ Apagar meu progresso</button></div></div></section>`;
}

/* ---------- CRIAR ---------- */
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }
function lerCriada(txt){
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,15).map(l=>{ const p=l.split('|').map(s=>s.trim()); if(p.length<4) return null;
    const a=p[0], b=p[p.length-1], ops=p.slice(1,-1).map((o,k)=>{ const m=o.match(/^(.+?)\s*\(([^)]+)\)$/); const con=(m?m[1]:o).trim(), rel=(m?m[2]:'').trim().toLocaleLowerCase('pt-BR'); return `${con}:${rel}${k===0?'*':''}`; });
    return {a,b,ops}; }).filter(Boolean);
}
function telaCriar(){
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="home" aria-label="Início">←</button><div class="tit"><h2>Criar fase</h2><small>Monte pontes com frases da sua aula</small></div></header>
  <section class="pg"><div class="cartao">
    <div class="campo"><span>Nome da fase</span><input id="c-tit" maxlength="50" placeholder="ex.: Conectivos da notícia"></div>
    <div class="campo"><span>Uma ponte por linha: parte 1 | conectivo CERTO | errado | errado | parte 2. Se quiser, coloque a relação entre parênteses.</span>
      <textarea id="c-txt" placeholder="Fui à escola | mas (oposição) | porque (causa) | para (finalidade) | esqueci o caderno.&#10;Estudei muito | por isso (consequência) | embora (concessão) | se (condição) | passei na prova."></textarea></div>
    <p class="mini" id="c-info"></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-acao="testar">▶️ Testar</button><button class="btn verde" data-acao="gerar">🔗 Gerar link</button></div><div id="c-link"></div></div></section>`;
  $('#c-txt').oninput=()=>{ const n=lerCriada($('#c-txt').value).length; $('#c-info').textContent=n?`${n} ponte(s) reconhecida(s)`:''; };
}
function dadosCriar(){ const l=lerCriada($('#c-txt').value); if(l.length<2){ toast('Escreva pelo menos 2 pontes no formato: parte 1 | certo | errado | errado | parte 2'); return null; } return {t:$('#c-tit').value.trim()||'Fase especial', x:$('#c-txt').value}; }
function faseCustom(d){ return {id:'custom', idx:-1, titulo:d.t, ano:'', cons:'', hab:'', itens:lerCriada(d.x)}; }

/* ---------- CONFIG / AJUDA ---------- */
function telaConfig(){
  const l=(k,t,d)=>`<div class="cfg-linha"><span>${t}<small>${d}</small></span><button class="troca" role="switch" aria-checked="${!!S.cfg[k]}" data-cfg="${k}" aria-label="${t}"></button></div>`;
  abrirModal(`<h2>Configurações</h2>${l('som','Efeitos sonoros','')}${l('livre','Liberar todas as fases','Para o professor escolher a fase da aula.')}<div class="acoes"><button class="btn verde" data-acao="fechar" data-foco>Pronto</button></div>`);
}
function telaAjuda(){
  abrirModal(`<h2>Como jogar</h2><div class="rels">
    <div>🪵 <b>Pontes:</b> leia as duas partes e escolha a tábua com o conectivo que liga as ideias. Errou? A tábua cai e você tenta de novo.</div>
    <div>🪧 <b>Placas:</b> o conectivo já está na frase. Escolha o nome da relação que ele cria.</div>
    <div>🔥 <b>Sequência:</b> acertos seguidos de primeira aumentam o fogo.</div>
    <div>⭐ <b>Estrelas:</b> 7 ou 8 pontes de primeira = 3 estrelas.</div></div>
    <div class="rels" style="margin-top:14px">${Object.entries(RELACOES).map(([k,v])=>`<div><b>${cap(k)}</b> — ${v}</div>`).join('')}</div>
    <div class="acoes"><button class="btn verde" data-acao="fechar" data-foco>Entendi!</button></div>`);
}
function copiar(txt){ const ok=()=>toast('Copiado! 📋'); const fb=()=>{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');ok();}catch(e){toast('Não deu para copiar.');} t.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok).catch(fb); else fb(); }

/* ---------- EVENTOS ---------- */
let armado=false;
document.addEventListener('click',e=>{
  const irB=e.target.closest('[data-ir]'); if(irB){ if(modalAberto()) fecharModal(); ir(irB.dataset.ir); return; }
  const fb=e.target.closest('[data-fase]'); if(fb&&!fb.disabled){ ir('fase',+fb.dataset.fase); return; }
  const op=e.target.closest('[data-op]'); if(op&&!op.disabled&&F){ escolher(+op.dataset.op, op); return; }
  const cf=e.target.closest('[data-cfg]'); if(cf){ const k=cf.dataset.cfg; S.cfg[k]=!S.cfg[k]; cf.setAttribute('aria-checked',S.cfg[k]); salvar(); if(TELA==='mapa') telaMapa(); return; }
  const ac=e.target.closest('[data-acao]'); if(!ac) return; const a=ac.dataset.acao;
  if(a==='fechar') fecharModal();
  else if(a==='ajuda') telaAjuda();
  else if(a==='config') telaConfig();
  else if(a==='seguir') seguir();
  else if(a==='ouvir') falar(ac.dataset.frase||'');
  else if(a==='repetir'){ fecharModal(); ir('fase', F.f.id==='custom'?F.f:F.f.idx); }
  else if(a==='prox'){ fecharModal(); ir('fase', F.f.idx+1); }
  else if(a==='copiar-rel') copiar(textoRel());
  else if(a==='apagar'){ if(!armado){ armado=true; ac.textContent='⚠️ Clique de novo para confirmar'; setTimeout(()=>{armado=false; const b=$('#btn-apagar'); if(b) b.textContent='🗑️ Apagar meu progresso';},3500); } else { const c=S.cfg; S=padrao(); S.cfg=c; salvar(); armado=false; toast('Progresso apagado.'); telaRelatorio(); } }
  else if(a==='testar'){ const d=dadosCriar(); if(d) ir('fase', faseCustom(d)); }
  else if(a==='gerar'){ const d=dadosCriar(); if(!d) return; const url=location.href.split('#')[0]+'#d='+b64e(JSON.stringify(d)); $('#c-link').innerHTML=`<div class="link-box">${esc(url)}</div><div style="margin-top:10px"><button class="btn verde" id="c-copiar">📋 Copiar link</button></div>`; $('#c-copiar').onclick=()=>copiar(url); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalAberto()){ fecharModal(); return; }
  if(TELA!=='fase'||!F||modalAberto()) return;
  const f=document.activeElement; if(f&&/INPUT|TEXTAREA/.test(f.tagName)) return;
  if(/^[1-4]$/.test(e.key)){ const b=$$('[data-op]')[+e.key-1]; if(b&&!b.disabled) b.click(); }
});

/* ---------- INÍCIO ---------- */
(function(){
  const h=location.hash;
  if(h.startsWith('#d=')){ try{ const d=JSON.parse(b64d(h.slice(3))); if(d&&typeof d.x==='string'&&lerCriada(d.x).length){ telaHome(); TELA='fase'; iniciarFase(faseCustom(d)); return; } }catch(e){ console.warn('Link inválido'); } }
  telaHome();
})();
</script>
</body>
</html>
