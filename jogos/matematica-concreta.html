<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matemática Inclusiva - Responsivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        :root {
            --bg: #e0f7fa;
            --text: #37474f;
            --primary: #00796b;
            --sec-c: #b39ddb; /* Centena */
            --sec-d: #ef9a9a; /* Dezena */
            --sec-u: #90caf9; /* Unidade */
            --machine-bg: #fff9c4;
            --machine-border: #fbc02d;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none;
        }

        h1 {
            font-size: 2.2em; color: var(--primary); margin-bottom: 5px; font-weight: 800;
        }
        
        .instrucao {
            font-size: 1.1em; color: #546e7a; margin-bottom: 15px; font-weight: 700;
        }

        .hud {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;
        }

        select {
            font-family: 'Nunito', sans-serif; font-size: 1.1em; padding: 8px 12px;
            border-radius: 10px; border: 2px solid #b2dfdb; outline: none;
            background-color: #ffffff; color: var(--text); font-weight: 700; cursor: pointer;
        }

        .btn-pequeno {
            background-color: #9b59b6; color: #fff; border: none; padding: 8px 15px;
            border-radius: 10px; font-weight: 800; font-family: 'Nunito', sans-serif; font-size: 1.1em;
            cursor: pointer; box-shadow: 0 4px 0 #8e44ad; transition: transform 0.1s;
        }
        .btn-pequeno:active { transform: translateY(4px); box-shadow: none; }

        #desafio-container {
            font-size: 2.5em; font-weight: 800; background-color: #ffffff;
            padding: 10px 30px; border-radius: 15px; box-shadow: var(--shadow);
            display: inline-block; margin-bottom: 20px; color: var(--primary);
        }

        /* --- MÁQUINAS DE TROCA --- */
        .machines-container {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;
            max-width: 700px; margin-left: auto; margin-right: auto;
        }

        .machine {
            background-color: var(--machine-bg); border: 3px dashed var(--machine-border);
            border-radius: 15px; padding: 10px; flex: 1 1 140px; min-width: 130px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s;
            box-shadow: var(--shadow);
        }
        .machine:active { transform: scale(0.95); }
        .machine-title { font-size: 0.9em; font-weight: 800; color: #f57f17; margin-bottom: 5px; line-height: 1.2;}
        .machine-icon { font-size: 2em; margin-bottom: 5px;}

        /* --- PEÇAS CONCRETAS --- */
        .peca-u {
            width: 20px; height: 20px; border-radius: 50%; background-color: var(--sec-u);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1), 2px 2px 4px rgba(0,0,0,0.1);
            margin: 2px; display: inline-block;
        }
        .peca-d {
            width: 15px; height: 60px; border-radius: 5px; background: linear-gradient(180deg, #ffcdd2 0%, var(--sec-d) 100%);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1), 2px 2px 4px rgba(0,0,0,0.1);
            margin: 2px; display: inline-block; position: relative;
        }
        .peca-d::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to bottom, transparent 90%, rgba(255,255,255,0.5) 90%);
            background-size: 100% 10%; pointer-events: none;
        }
        .peca-c {
            width: 60px; height: 60px; border-radius: 5px; background-color: var(--sec-c);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1), 2px 2px 4px rgba(0,0,0,0.1);
            margin: 2px; display: inline-block;
        }

        /* --- QVL ELÁSTICO --- */
        .qvl-container {
            display: flex; justify-content: center; margin-bottom: 10px;
            position: relative; z-index: 10; width: 100%;
        }

        .qvl {
            width: 100%; max-width: 600px;
            background-color: #ffffff; border: 4px solid #80cbc4;
            border-radius: 20px; padding: 15px; box-shadow: var(--shadow);
            box-sizing: border-box;
        }

        .qvl-row {
            display: grid; 
            grid-template-columns: 40px repeat(3, 1fr); /* 1fr deixa elástico! */
            gap: 8px; margin-bottom: 10px; align-items: stretch;
        }

        .qvl-header div { font-weight: 800; font-size: 1.1em; color: #fff; border-radius: 10px; padding: 6px 0; }
        .cabecalho-c { background-color: var(--sec-c); } 
        .cabecalho-d { background-color: var(--sec-d); } 
        .cabecalho-u { background-color: var(--sec-u); } 

        .zone {
            background-color: #fafafa; border: 3px dashed #cfd8dc; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 8px 4px; min-height: 90px; transition: background-color 0.2s;
        }
        .zone.highlight { background-color: #e8f5e9; border-color: #81c784; }

        .zone-number { font-size: 2em; font-weight: 800; color: var(--text); margin-bottom: 5px; line-height: 1;}
        .zone-pieces { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; width: 100%; min-height: 40px;}

        .operador-sinal { font-size: 2.5em; font-weight: 800; color: #78909c; display: flex; align-items: center; justify-content: center;}
        .linha-resultado { height: 5px; background-color: #b0bec5; margin: 10px 0; border-radius: 3px; }

        /* Botões de + e - dentro da zona */
        .zone-controls { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; justify-content: center; width: 100%;}
        .btn-zone {
            width: 32px; height: 32px; border-radius: 50%; border: none; font-size: 1.4em; font-weight: 800;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1); transition: transform 0.1s; color: white; flex-shrink: 0;
        }
        .btn-zone:active { transform: translateY(3px); box-shadow: none; }
        .btn-add { background-color: #4caf50; }
        .btn-sub { background-color: #e53935; }

        .controles { margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;}
        
        .btn-grande {
            font-family: 'Nunito', sans-serif; font-size: 1.3em; padding: 12px 25px;
            border: none; border-radius: 15px; cursor: pointer; font-weight: 800; color: #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15); transition: transform 0.1s;
        }
        .btn-grande:active { transform: translateY(5px); box-shadow: none; }
        
        #btn-conferir { background-color: #00bcd4; color: #004d40; box-shadow: 0 5px 0 #0097a7; }
        #btn-novo { background-color: #81c784; color: #1b5e20; box-shadow: 0 5px 0 #66bb6a; display:none; }

        #mensagem { font-size: 1.4em; font-weight: 800; margin-top: 15px; height: 40px; color: var(--primary);}
        
        .confete-suave { position: fixed; top: -20px; z-index: 9999; animation: cair linear forwards; border-radius: 50%; opacity: 0.8; pointer-events: none; }
        @keyframes cair { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(110vh) rotate(360deg); } }

        /* REGRAS PARA CELULAR - ADAPTAÇÃO INTELIGENTE */
        @media (max-width: 650px) {
            h1 { font-size: 1.8em; }
            .instrucao { font-size: 0.9em; }
            #desafio-container { font-size: 1.8em; padding: 8px 15px; margin-bottom: 15px;}
            
            /* Máquinas em grade 2x2 no celular */
            .machines-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 5px; }
            .machine { width: auto; min-width: 0; padding: 8px 5px; }
            .machine-icon { font-size: 1.5em; }
            .machine-title { font-size: 0.75em; }
            
            .qvl { padding: 8px; border-width: 3px; border-radius: 12px; }
            .qvl-row { grid-template-columns: 25px repeat(3, 1fr); gap: 4px; margin-bottom: 6px;}
            .qvl-header div { font-size: 0.8em; padding: 4px 0;}
            
            .zone { min-height: 70px; padding: 5px 2px; border-width: 2px;}
            .zone-number { font-size: 1.5em; }
            
            /* Peças menores para caberem nas colunas apertadas */
            .peca-u { width: 14px; height: 14px; margin: 1px; }
            .peca-d { width: 10px; height: 35px; margin: 1px; }
            .peca-c { width: 35px; height: 35px; margin: 1px; }
            
            /* Botões + e - otimizados */
            .zone-controls { gap: 4px; padding-top: 5px; }
            .btn-zone { width: 26px; height: 26px; font-size: 1.2em; }
            
            .operador-sinal { font-size: 1.8em; }
            .btn-pequeno { width: 100%; margin-bottom: 5px; } /* Botão tela cheia expande */
        }
    </style>
</head>
<body>

    <h1>Matemática Concreta</h1>
    <p class="instrucao">Use os botões <span style="color:#4caf50; font-weight:900;">(+)</span> e <span style="color:#e53935; font-weight:900;">(-)</span> para colocar as peças.<br>Se precisar fazer trocas, use as Máquinas Mágicas!</p>
    
    <div class="hud">
        <button id="btn-fullscreen" class="btn-pequeno" onclick="toggleFullScreen()">Tela Cheia 🔲</button>
        <select id="seletor-op" onchange="gerarNovoDesafio()">
            <option value="+">Adição (+)</option>
            <option value="-">Subtração (-)</option>
        </select>
        <select id="seletor-nivel" onchange="gerarNovoDesafio()">
            <option value="1">1 (Dezena - Sem Troca)</option>
            <option value="2">2 (Dezena - Com Troca)</option>
            <option value="3">3 (Centena - Com Troca)</option>
        </select>
    </div>

    <div id="desafio-container">
        <span id="desafio-texto">...</span>
    </div>

    <!-- MÁQUINAS DE TROCA (Grade 2x2 no Celular) -->
    <div class="machines-container">
        <div class="machine" id="machine-dezena" onclick="fazerDezena()">
            <div class="machine-icon">✨</div>
            <div class="machine-title">Juntar 10 Unidades<br>em 1 Dezena</div>
        </div>
        <div class="machine" id="machine-unidade" onclick="desmancharDezena()">
            <div class="machine-icon">🔨</div>
            <div class="machine-title">Desmanchar 1 Dezena<br>em 10 Unidades</div>
        </div>
        <div class="machine" id="machine-centena" onclick="fazerCentena()">
            <div class="machine-icon">🌟</div>
            <div class="machine-title">Juntar 10 Dezenas<br>em 1 Centena</div>
        </div>
        <div class="machine" id="machine-desmanchar-c" onclick="desmancharCentena()">
            <div class="machine-icon">🛠️</div>
            <div class="machine-title">Desmanchar 1 Centena<br>em 10 Dezenas</div>
        </div>
    </div>

    <div class="qvl-container">
        <div class="qvl">
            <div class="qvl-row qvl-header">
                <div></div>
                <div class="cabecalho-c">C</div>
                <div class="cabecalho-d">D</div>
                <div class="cabecalho-u">U</div>
            </div>

            <!-- Fator 1 -->
            <div class="qvl-row">
                <div></div>
                <div class="zone" id="z-c1">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('c1', 1, 'c')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('c1', -1, 'c')">-</button>
                    </div>
                </div>
                <div class="zone" id="z-d1">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('d1', 1, 'd')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('d1', -1, 'd')">-</button>
                    </div>
                </div>
                <div class="zone" id="z-u1">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('u1', 1, 'u')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('u1', -1, 'u')">-</button>
                    </div>
                </div>
            </div>

            <!-- Fator 2 -->
            <div class="qvl-row">
                <div class="operador-sinal" id="sinal-operacao">+</div>
                <div class="zone" id="z-c2">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('c2', 1, 'c')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('c2', -1, 'c')">-</button>
                    </div>
                </div>
                <div class="zone" id="z-d2">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('d2', 1, 'd')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('d2', -1, 'd')">-</button>
                    </div>
                </div>
                <div class="zone" id="z-u2">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('u2', 1, 'u')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('u2', -1, 'u')">-</button>
                    </div>
                </div>
            </div>

            <div class="linha-resultado"></div>

            <!-- Resultado -->
            <div class="qvl-row">
                <div></div>
                <div class="zone" id="z-cr">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('cr', 1, 'c')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('cr', -1, 'c')">-</button>
                    </div>
                </div>
                <div class="zone" id="z-dr">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('dr', 1, 'd')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('dr', -1, 'd')">-</button>
                    </div>
                </div>
                <div class="zone" id="z-ur">
                    <div class="zone-number">0</div>
                    <div class="zone-pieces"></div>
                    <div class="zone-controls">
                        <button class="btn-zone btn-add" onclick="alterarPeca('ur', 1, 'u')">+</button>
                        <button class="btn-zone btn-sub" onclick="alterarPeca('ur', -1, 'u')">-</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controles">
        <button id="btn-conferir" class="btn-grande" onclick="conferirResposta()">Tudo pronto?</button>
        <button id="btn-novo" class="btn-grande" onclick="gerarNovoDesafio()">Muito bem! Próxima ➡️</button>
    </div>

    <div id="mensagem"></div>

    <script>
        let desafioAtual = { num1: 0, num2: 0, operacao: '+', resultado: 0 };
        let jogoTravado = false; 

        let quadro = {
            c1: 0, d1: 0, u1: 0,
            c2: 0, d2: 0, u2: 0,
            cr: 0, dr: 0, ur: 0
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); } 
                else if (document.documentElement.msRequestFullscreen) { document.documentElement.msRequestFullscreen(); } 
                else if (document.documentElement.mozRequestFullScreen) { document.documentElement.mozRequestFullScreen(); } 
                else if (document.documentElement.webkitRequestFullscreen) { document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT); }
                document.getElementById('btn-fullscreen').innerHTML = "Sair Tela Cheia ✖️";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.msExitFullscreen) { document.msExitFullscreen(); } 
                else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); } 
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                document.getElementById('btn-fullscreen').innerHTML = "Tela Cheia 🔲";
            }
        }

        function inicializarAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function tocarSomSuave(tipo) {
            inicializarAudio();
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            if (tipo === 'acerto') {
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (tipo === 'aviso') {
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(349.23, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (tipo === 'troca') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function lancarConfetesSuaves() {
            const cores = ['#b39ddb', '#ef9a9a', '#90caf9', '#81c784', '#ffcc80'];
            for (let i = 0; i < 40; i++) {
                let confete = document.createElement('div'); confete.classList.add('confete-suave');
                confete.style.left = Math.random() * 100 + 'vw';
                confete.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
                let size = Math.random() * 10 + 10;
                confete.style.width = size + 'px'; confete.style.height = size + 'px';
                confete.style.animationDuration = (Math.random() * 3 + 3) + 's'; 
                confete.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confete); setTimeout(() => confete.remove(), 6000);
            }
        }

        function renderizarZona(zonaId, tipoPeca) {
            let qtd = quadro[zonaId];
            let zoneEl = document.getElementById('z-' + zonaId);
            
            zoneEl.querySelector('.zone-number').textContent = qtd;
            
            let piecesContainer = zoneEl.querySelector('.zone-pieces');
            piecesContainer.innerHTML = '';
            for (let i = 0; i < qtd; i++) {
                let p = document.createElement('div');
                p.classList.add('peca-' + tipoPeca);
                piecesContainer.appendChild(p);
            }
        }

        function alterarPeca(zonaId, valor, tipoPeca) {
            if (jogoTravado) return;
            inicializarAudio();
            let novaQtd = quadro[zonaId] + valor;
            if (novaQtd >= 0 && novaQtd <= 19) { 
                quadro[zonaId] = novaQtd;
                renderizarZona(zonaId, tipoPeca);
            }
        }

        function destacarZona(zonaId) {
            let z = document.getElementById('z-' + zonaId);
            z.classList.add('highlight');
            setTimeout(() => z.classList.remove('highlight'), 500);
        }

        function mensagemTemporaria(msg) {
            let el = document.getElementById('mensagem');
            el.textContent = msg;
            setTimeout(() => { if(!jogoTravado) el.textContent = ''; }, 3000);
        }

        function fazerDezena() {
            if (jogoTravado) return;
            let linha = null;
            if (quadro.u1 >= 10) linha = '1';
            else if (quadro.u2 >= 10) linha = '2';
            else if (quadro.ur >= 10) linha = 'r';

            if (linha) {
                quadro['u'+linha] -= 10;
                quadro['d'+linha] += 1;
                renderizarZona('u'+linha, 'u');
                renderizarZona('d'+linha, 'd');
                tocarSomSuave('troca');
                destacarZona('u'+linha); destacarZona('d'+linha);
                mensagemTemporaria('Mágica! 10 unidades viraram 1 dezena!');
            } else {
                mensagemTemporaria('Junte 10 unidades para fazer a mágica!');
            }
        }

        function desmancharDezena() {
            if (jogoTravado) return;
            let linha = null;
            if (quadro.d1 >= 1) linha = '1';
            else if (quadro.d2 >= 1) linha = '2';
            else if (quadro.dr >= 1) linha = 'r';

            if (linha) {
                quadro['d'+linha] -= 1;
                quadro['u'+linha] += 10;
                renderizarZona('d'+linha, 'd');
                renderizarZona('u'+linha, 'u');
                tocarSomSuave('troca');
                destacarZona('d'+linha); destacarZona('u'+linha);
                mensagemTemporaria('Mágica! 1 dezena quebrou em 10 unidades!');
            } else {
                mensagemTemporaria('Não há dezenas para desmanchar!');
            }
        }

        function fazerCentena() {
            if (jogoTravado) return;
            let linha = null;
            if (quadro.d1 >= 10) linha = '1';
            else if (quadro.d2 >= 10) linha = '2';
            else if (quadro.dr >= 10) linha = 'r';

            if (linha) {
                quadro['d'+linha] -= 10;
                quadro['c'+linha] += 1;
                renderizarZona('d'+linha, 'd');
                renderizarZona('c'+linha, 'c');
                tocarSomSuave('troca');
                destacarZona('d'+linha); destacarZona('c'+linha);
                mensagemTemporaria('Mágica! 10 dezenas viraram 1 centena!');
            } else {
                mensagemTemporaria('Junte 10 dezenas para fazer a mágica!');
            }
        }

        function desmancharCentena() {
            if (jogoTravado) return;
            let linha = null;
            if (quadro.c1 >= 1) linha = '1';
            else if (quadro.c2 >= 1) linha = '2';
            else if (quadro.cr >= 1) linha = 'r';

            if (linha) {
                quadro['c'+linha] -= 1;
                quadro['d'+linha] += 10;
                renderizarZona('c'+linha, 'c');
                renderizarZona('d'+linha, 'd');
                tocarSomSuave('troca');
                destacarZona('c'+linha); destacarZona('d'+linha);
                mensagemTemporaria('Mágica! 1 centena quebrou em 10 dezenas!');
            } else {
                mensagemTemporaria('Não há centenas para desmanchar!');
            }
        }

        function limparQuadro() {
            jogoTravado = false; 
            for (let z in quadro) {
                quadro[z] = 0;
                renderizarZona(z, z.charAt(0)); 
            }
            document.getElementById('mensagem').textContent = '';
            document.getElementById('btn-conferir').style.display = 'inline-block';
            document.getElementById('btn-novo').style.display = 'none';
        }

        function gerarNovoDesafio() {
            limparQuadro();
            const nivel = document.getElementById('seletor-nivel').value;
            const op = document.getElementById('seletor-op').value;
            
            let n1, n2;
            
            if (nivel === "1") { 
                let u1 = Math.floor(Math.random() * 5);
                let u2 = Math.floor(Math.random() * 5);
                let d1 = Math.floor(Math.random() * 4) + 1;
                let d2 = Math.floor(Math.random() * 4) + 1;
                n1 = (d1 * 10) + u1; n2 = (d2 * 10) + u2;
            } else if (nivel === "2") { 
                let u1 = Math.floor(Math.random() * 5) + 5; 
                let u2 = Math.floor(Math.random() * 5) + 5; 
                let d1 = Math.floor(Math.random() * 4) + 1;
                let d2 = Math.floor(Math.random() * 4) + 1;
                n1 = (d1 * 10) + u1; n2 = (d2 * 10) + u2;
            } else { 
                n1 = Math.floor(Math.random() * 400) + 100;
                n2 = Math.floor(Math.random() * 400) + 100;
            }

            if (op === '-' && n2 > n1) { let temp = n1; n1 = n2; n2 = temp; }

            desafioAtual = { num1: n1, num2: n2, operacao: op, resultado: op === '+' ? n1 + n2 : n1 - n2 };
            document.getElementById('desafio-texto').textContent = `${n1} ${op} ${n2}`;
            document.getElementById('sinal-operacao').textContent = op;
        }

        function conferirResposta() {
            if (jogoTravado) return;
            const msg = document.getElementById('mensagem');
            
            let val1 = (quadro.c1 * 100) + (quadro.d1 * 10) + quadro.u1;
            let val2 = (quadro.c2 * 100) + (quadro.d2 * 10) + quadro.u2;
            let resAluno = (quadro.cr * 100) + (quadro.dr * 10) + quadro.ur;

            if (val1 === 0 && val2 === 0) {
                tocarSomSuave('aviso'); msg.textContent = "Coloque as peças no quadro primeiro!"; return;
            }

            if (val1 !== desafioAtual.num1 || val2 !== desafioAtual.num2) {
                tocarSomSuave('aviso'); msg.textContent = "Você montou números diferentes do desafio lá de cima!"; return;
            }

            if (resAluno === 0) {
                tocarSomSuave('aviso'); msg.textContent = "Falta colocar as peças do resultado na última linha!"; return;
            }

            if (quadro.ur >= 10 || quadro.dr >= 10) {
                tocarSomSuave('aviso'); msg.textContent = "Opa! Use as Máquinas Mágicas para fazer as trocas!"; return;
            }

            if (resAluno === desafioAtual.resultado) {
                tocarSomSuave('acerto'); lancarConfetesSuaves();
                msg.textContent = "Fantástico! A quantidade está certinha!"; 
                jogoTravado = true; 
                document.getElementById('btn-conferir').style.display = 'none';
                document.getElementById('btn-novo').style.display = 'inline-block';
            } else {
                tocarSomSuave('aviso'); msg.textContent = "Quase lá! Vamos contar as peças novamente?";
            }
        }

        gerarNovoDesafio();
    </script>
</body>
