<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador MS</title>
<meta name="description" content="Jogo de Geografia de Mato Grosso do Sul (6º e 7º ano): pontos cardeais e colaterais no mapa de MS, estados e países vizinhos, bacias do Paraguai e do Paraná e paisagens do Pantanal, Cerrado e Mata Atlântica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>

:root{
  --agua:#0B5563; --agua2:#0E7490; --agua-claro:#CFF0F2; --mata:#2F6B2A; --mata2:#4D8B31; --ipe:#F5B700; --ipe-e:#C78F00;
  --terra:#9A3412; --creme:#FFFBF0; --borda:#E6DABC; --tinta:#1B2A26; --suave:#56645E;
  --ok:#15803D; --ok-f:#DCFCE7; --erro:#DC2626; --erro-f:#FEE2E2;
  --titulo:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --texto:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;font-family:var(--texto);font-size:17px;color:var(--tinta);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(180deg,#E3F4EE 0%,#F6F1DF 100%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.btn{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .12s;text-decoration:none;color:var(--tinta)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ipe{background:var(--ipe);border-color:var(--ipe-e);box-shadow:0 4px 0 var(--ipe-e)}
.btn.agua{background:var(--agua2);border-color:var(--agua);color:#fff;box-shadow:0 4px 0 var(--agua)}
.btn.grande{font-size:20px;padding:16px 26px;font-family:var(--titulo)}
.btn.icone{padding:10px 14px}
.selo{display:inline-block;font-family:var(--titulo);font-weight:800;letter-spacing:2px;font-size:12px;color:var(--terra);background:#9A341214;padding:5px 12px;border-radius:30px}

/* HOME */
.home{max-width:1100px;margin:auto;padding:22px 20px 34px}
.voltar-plat{font-weight:700;color:var(--agua);text-decoration:none;font-size:15px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;margin-top:10px}
.hero h1{font-size:clamp(44px,7vw,76px);font-weight:800;margin:12px 0 8px;letter-spacing:-1px;color:var(--agua)}
.hero h1 span{color:var(--mata2)}
.lead{font-size:19px;line-height:1.6;max-width:540px;margin:0 0 16px;color:#34463F}
.campos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;color:var(--suave)}
.campos input{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:10px 12px;width:190px;font-size:17px}
.campos label:last-child input{width:110px}
.acoes{display:flex;flex-wrap:wrap;gap:10px}
.cena{border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 40px #0b556333}
.cena svg{display:block;width:100%;height:auto}
.info{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.info div{flex:1;min-width:150px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 16px;font-size:14px;color:var(--suave)}
.info b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.rodape{font-size:13px;color:var(--suave);line-height:1.6;margin-top:12px}

/* TOPO */
.topo{position:sticky;top:0;z-index:25;background:#F2F8F2ee;backdrop-filter:blur(6px);border-bottom:2px solid #CFE3D6;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topo .tit{flex:1;min-width:0}
.topo h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{color:var(--suave);font-size:13px}
.topo .btn{min-height:42px;padding:8px 12px}
.chip-topo{font-family:var(--titulo);font-weight:800;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:6px 12px;white-space:nowrap}

/* MAPA */
.mapa{max-width:1000px;margin:auto;padding:22px 16px 40px}
.missoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.missao{position:relative;text-align:left;background:#fff;border:3px solid var(--borda);border-radius:22px;padding:18px;min-height:210px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.missao:hover:not(:disabled){transform:translateY(-3px)}
.missao:disabled{opacity:.5;cursor:not-allowed}
.missao .ic{font-size:40px;line-height:1}
.missao .num{font-family:var(--titulo);font-weight:800;color:var(--terra);letter-spacing:1px;font-size:14px}
.missao h3{font-size:24px}
.missao p{margin:0;color:var(--suave);font-size:15px}
.missao .hab{font-size:12px;color:var(--suave)}
.missao .est{margin-top:auto;font-size:22px;letter-spacing:3px;color:#E2D8C2}
.missao .est .on{color:var(--ipe)}
.missao .cad{position:absolute;top:14px;right:16px;font-size:20px}
.missao.atual{border-color:var(--mata2);box-shadow:0 0 0 4px #4D8B3133}
.nota{color:var(--suave);font-size:13px;margin-top:16px;line-height:1.5}

/* JOGO */
.jogo{max-width:880px;margin:auto;padding:14px 16px 40px}
.barra{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--suave)}
.trilho{flex:1;height:10px;border-radius:10px;background:#D9E7DD;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--mata2);transition:width .3s}
.painel{background:var(--creme);border:3px solid var(--borda);border-radius:22px;padding:18px}
.enunciado{font-family:var(--titulo);font-size:22px;margin:0 0 4px}
.legenda{font-size:14px;color:var(--suave);margin:0 0 12px}

/* cadeia */
.cadeia{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.elo{width:118px;min-height:118px;border-radius:16px;border:3px dashed #B9CBBE;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.2}
.elo .em{font-size:38px;line-height:1.1}
.elo.sol{border-style:solid;border-color:#F6D776;background:#FFF8DA}
.elo.cheio{border-style:solid;border-color:var(--agua2)}
.elo.certo{border-color:var(--ok);background:var(--ok-f)}
.elo.errado{border-color:var(--erro);background:var(--erro-f);animation:treme .3s}
.elo .papel{font-size:11px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.3px}
.elo .vz{font-size:30px;color:#B9CBBE}
.seta{display:flex;align-items:center;font-size:26px;color:var(--agua2);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;border-radius:18px;background:#EEF6F0;border:2px solid #D3E6D8}
.carta{width:118px;min-height:110px;border-radius:16px;border:2px solid var(--borda);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-weight:700;font-size:14px;line-height:1.2;text-align:center;box-shadow:0 4px 0 #E2D6BB;transition:transform .1s}
.carta .em{font-size:38px;line-height:1.1}
.carta:hover:not(:disabled){transform:translateY(-3px)}
.carta:disabled{visibility:hidden}
.decomp{margin-top:12px;font-size:15px;background:#F3EBDD;border-radius:12px;padding:10px 12px}
@keyframes treme{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* classificar / situação */
.ficha{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--borda);border-radius:18px;padding:18px;margin-bottom:14px}
.ficha .em{font-size:56px;line-height:1;flex:none}
.ficha .txt{font-size:clamp(20px,3vw,25px);font-weight:700;line-height:1.35}
.biomas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bioma{border:0;border-radius:16px;padding:14px 10px;color:#fff;font-family:var(--titulo);font-weight:800;font-size:22px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 #0003;transition:transform .1s}
.bioma small{font-family:var(--texto);font-weight:400;font-size:12px;opacity:.9}
.bioma:hover:not(:disabled){transform:translateY(-3px)}
.bioma.p{background:var(--agua2)}.bioma.c{background:#B45309}.bioma.d{background:var(--mata)}
.bioma:disabled{opacity:.4;cursor:default}
.bioma.marcado{opacity:1;outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
.contexto{background:#E6F2F4;border-left:6px solid var(--agua2);border-radius:0 16px 16px 0;padding:14px 16px;margin-bottom:12px;font-size:18px;line-height:1.5}
.contexto b.ev{display:block;font-family:var(--titulo);font-size:21px;color:var(--agua);margin-bottom:2px}
.teia{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:15px}
.teia span{background:#fff;border:1.5px solid #B7D3DA;border-radius:10px;padding:2px 8px;white-space:nowrap}
.pergunta{font-family:var(--titulo);font-size:21px;margin:6px 0 10px}
.opcoes{display:grid;gap:8px}
.op{text-align:left;border:2px solid var(--borda);background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.op b{flex:none;width:28px;height:28px;border-radius:8px;background:#EEF6F0;display:grid;place-items:center;font-family:var(--titulo)}
.op:hover:not(:disabled){border-color:var(--agua2)}
.op.certa{border-color:var(--ok);background:var(--ok-f)}
.op.errada{border-color:var(--erro);background:var(--erro-f);text-decoration:line-through;opacity:.8}
.op:disabled{cursor:default}
.retorno{margin-top:14px;border-radius:16px;padding:14px 16px;line-height:1.55;border:2px solid var(--borda);background:#fff}
.retorno.ok{border-color:#86EFAC;background:#F0FDF4}
.retorno.no{border-color:#FCA5A5;background:#FFF5F5}
.retorno .t{display:block;font-family:var(--titulo);font-size:21px;margin-bottom:4px}
.seguir{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:#0b2a2ab8;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--creme);border-radius:24px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:24px;border:3px solid var(--borda);box-shadow:0 30px 80px #0006}
.modal h2{font-size:30px;margin-bottom:8px}
.modal p{line-height:1.6;margin:8px 0}
.modal .acoes{margin-top:18px}
.lista{display:grid;gap:8px;margin-top:10px}
.lista div{background:#fff;border:2px solid var(--borda);border-radius:12px;padding:9px 12px;line-height:1.45}
.mini{font-size:13px;color:var(--suave)}
.big-est{font-size:58px;letter-spacing:8px;text-align:center}
.big-est span{display:inline-block;color:#E2D8C2;opacity:0;transform:scale(.4);animation:surge .5s forwards}
.big-est span.on{color:var(--ipe)}
.big-est span:nth-child(2){animation-delay:.25s}.big-est span:nth-child(3){animation-delay:.5s}
@keyframes surge{to{opacity:1;transform:scale(1)}}
.resumo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.resumo div{background:#fff;border:2px solid var(--borda);border-radius:14px;padding:8px 14px;text-align:center;font-size:13px;color:var(--suave)}
.resumo b{display:block;font-family:var(--titulo);font-size:24px;color:var(--tinta)}
.cfg-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--borda);border-radius:16px;padding:12px 14px;margin:8px 0}
.cfg-linha small{display:block;color:var(--suave);font-size:13px}
.troca{position:relative;width:56px;height:32px;flex:none;border-radius:20px;border:0;background:#D6CAB5}
.troca::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.troca[aria-checked="true"]{background:var(--ok)}
.troca[aria-checked="true"]::after{left:28px}

/* RELATÓRIO */
.pg{max-width:860px;margin:auto;padding:20px 16px 40px}
.cartao{background:#fff;border:3px solid var(--borda);border-radius:20px;padding:18px;margin-bottom:16px}
.cartao h3{font-size:22px;margin-bottom:10px}
.cat{display:grid;grid-template-columns:minmax(190px,1.3fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:15px}
.cat:last-child{border-bottom:0}
.bar{height:14px;border-radius:10px;background:#EEE6D3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--mata2)}
.cat .n{font-weight:700;white-space:nowrap}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:60;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .cena{order:-1}
  .topo{padding:8px 10px;gap:6px}
  .topo small{display:none}
  .topo h2{font-size:17px}
  .chip-topo{padding:4px 8px;font-size:14px}
  .elo,.carta{width:96px;min-height:96px;font-size:13px}
  .elo .em,.carta .em{font-size:30px}
  .seta{font-size:20px}
  .biomas{grid-template-columns:1fr}
  .bioma{min-height:60px;flex-direction:row;gap:10px;font-size:20px}
  .ficha{padding:14px;gap:12px}
  .ficha .em{font-size:44px}
  .cat{grid-template-columns:1fr auto}
  .cat .bar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--agua:#0C4A6E;--agua2:#0369A1;--mata2:#15803D;--terra:#0369A1}
body{background:linear-gradient(180deg,#DFF1F9 0%,#F7F3EA 100%)}
.topo{background:#EEF8FCee;border-bottom-color:#C7E3EF}
.trilho{background:#CFE6F0}
.trilho i,.bar i{background:var(--mata2)}
.selo{background:#0369A114}

.mapa-box{background:#fff;border:2px solid var(--borda);border-radius:18px;padding:8px;margin-bottom:14px}
.mapa-box svg{display:block;width:100%;max-width:520px;height:auto;margin:auto}
.mapa-box .leg{text-align:center;font-size:14px;color:var(--suave);margin:4px 0 0}
.reg{stroke:#8A8070;stroke-width:1}
.reg.ms{fill:#FDE68A;stroke:#92400E;stroke-width:2}
.reg.uf{fill:#EFE9DD}
.reg.pais{fill:#F6E3D3}
.reg.alvo{fill:#FCA5A5;stroke:#B91C1C;stroke-width:2.5;animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{fill:#FECACA}}
.rio{fill:none;stroke:#38BDF8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rio.alvo{stroke:#0369A1;stroke-width:6;animation:pisca 1.1s ease-in-out infinite}
@keyframes pisca{50%{stroke:#7DD3FC}}
.rot{font:700 12px var(--texto);fill:#57534E;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}
.cid{font:700 12px var(--texto);fill:#1C1917;paint-order:stroke;stroke:#fff;stroke-width:3.5px}

.bussola{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:380px;margin:0 auto}
.bussola button{border:2px solid var(--borda);background:#fff;border-radius:16px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--titulo);font-weight:800;font-size:22px;line-height:1;transition:transform .1s}
.bussola button small{font-family:var(--texto);font-weight:400;font-size:12px;color:var(--suave);margin-top:3px}
.bussola button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--agua2)}
.bussola button.certa{border-color:var(--ok);background:var(--ok-f)}
.bussola button.errada{border-color:var(--erro);background:var(--erro-f);opacity:.7}
.bussola .centro{border:0;background:none;font-size:40px;pointer-events:none}
.bussola button:disabled{cursor:default}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duas button{border:0;border-radius:16px;min-height:78px;color:#fff;font-family:var(--titulo);font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #0003;padding:6px}
.duas button small{font-family:var(--texto);font-weight:400;font-size:13px;opacity:.95}
.duas .py{background:#0E7490}.duas .pr{background:#4338CA}
.duas button:disabled{opacity:.4;cursor:default}
.duas button.marcado{opacity:1;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--ok)}
.duas button.errado{opacity:1;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--erro)}
.tipos3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tipo3{border:2px solid var(--borda);background:#fff;border-radius:16px;padding:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:17px;transition:transform .1s}
.tipo3 .em{font-size:34px}
.tipo3:hover:not(:disabled){transform:translateY(-3px);border-color:var(--agua2)}
.tipo3.certa{border-color:var(--ok);background:var(--ok-f)}
.tipo3.errada{border-color:var(--erro);background:var(--erro-f);opacity:.75}
.tipo3:disabled{cursor:default}
.lado-a-lado{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){
  .lado-a-lado{grid-template-columns:1fr}
  .bussola button{min-height:60px;font-size:20px}
  .tipo3{font-size:15px;padding:10px 6px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   EXPLORADOR MS — JRM • Aventuras Educativas
   Geografia · 6º e 7º ano
   MS.EF06GE00.n.05 pontos cardeais e colaterais, elementos do mapa
   MS.EF07GE00.n.01 limites e fronteiras
   MS.EF06GE12      bacias hidrográficas do Paraguai e do Paraná
   MS.EF06GE05      paisagens de MS (Pantanal, Cerrado, Mata Atlântica)

/* o = {alvo:'MT'|..., nomes:true, rios:true, rioAlvo:'taquari', pins:[{c,cor,rot}], seta:[a,b], cidades:true} */
function mapa(o={}){
  const W=MAPA.W, H=MAPA.H;
  const regs=['BO','PY','MT','GO','MG','SP','PR','MS'].map(k=>{
    const cls=['reg', k==='MS'?'ms':(k==='PY'||k==='BO')?'pais':'uf', o.alvo===k?'alvo':''].join(' ');
    return `<path class="${cls}" d="${MAPA.reg[k]}"/>`; }).join('');
  const rios=o.rios? Object.entries(MAPA.rios).map(([k,d])=>`<path class="rio ${o.rioAlvo===k?'alvo':''}" d="${d}"/>`).join('') : '';
  const nomes=Object.entries(MAPA.lab).map(([k,[x,y]])=>{ if(!o.nomes&&o.alvo!==k) return ''; const t=o.alvo===k&&!o.revela?'?':(o.nomes||o.revela?k:''); return t?`<text class="rot" x="${x.toFixed(0)}" y="${y.toFixed(0)}" style="${o.alvo===k?'font-size:20px;fill:#991B1B':''}">${t}</text>`:''; }).join('');
  let extra='';
  if(o.seta){ const [x1,y1]=proj(...CIDADES[o.seta[0]]), [x2,y2]=proj(...CIDADES[o.seta[1]]);
    extra+=`<defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#15803D" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#pt)"/>`; }
  (o.pins||[]).forEach(p=>{ const [x,y]=proj(...CIDADES[p.c]); const dir=x>W*0.72?-1:1;
    extra+=`<circle cx="${x}" cy="${y}" r="7" fill="${p.cor||'#DC2626'}" stroke="#fff" stroke-width="2.5"/><text class="cid" x="${x+dir*10}" y="${y+4}" text-anchor="${dir>0?'start':'end'}">${esc(p.rot||p.c)}</text>`; });
  const rosa=`<g transform="translate(${W-40} ${H-44})"><circle r="26" fill="#fff" stroke="#0369A1" stroke-width="2" opacity=".92"/><path d="M0 -22 L6 0 L0 22 L-6 0Z" fill="#0369A1"/><path d="M-22 0 L0 -5 L22 0 L0 5Z" fill="#7DD3FC"/><text y="-28" text-anchor="middle" class="rot" style="fill:#0369A1;font-size:13px">N</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de Mato Grosso do Sul e vizinhos"><rect width="${W}" height="${H}" fill="#CDEAF5"/>${regs}${rios}${nomes}${extra}${rosa}</svg>`;
}

/* ---------- MISSÃO ---------- */
let M=null;
function rodadasRumo(){
  const nomes=Object.keys(CIDADES), pares=[];
  nomes.forEach(a=>nomes.forEach(b=>{ if(a===b) return; const r=rumo(a,b); if(r.desvio<=13&&r.dist>=1.3) pares.push({a,b,k:r.k}); }));
  const cont=Array(8).fill(0), escolhidos=[];
  const doCG=embaralhar(pares.filter(p=>p.a==='Campo Grande'));
  for(const p of doCG){ if(escolhidos.length>=3) break; if(cont[p.k]) continue; escolhidos.push(p); cont[p.k]++; }
  for(const p of embaralhar(pares)){ if(escolhidos.length>=10) break; if(cont[p.k]>=2||escolhidos.some(q=>q.a===p.a&&q.b===p.b)) continue; escolhidos.push(p); cont[p.k]++; }
  return escolhidos;
}
function iniciar(idx){
  const m=MISSOES[idx]; let itens;
  if(m.tipo==='rumo') itens=rodadasRumo();
  else if(m.tipo==='viz'){ const ks=Object.keys(VIZ);
    itens=[...embaralhar(ks).map(k=>({tipo:'viz', k, ops:embaralhar([k,...embaralhar(ks.filter(x=>x!==k)).slice(0,3)])})),
           ...embaralhar(GEMEAS).slice(0,4).map(g=>({tipo:'gem', ...g, ops:embaralhar([g.g,...embaralhar(GEMEAS.filter(x=>x.g!==g.g).map(x=>x.g)).slice(0,3)])}))]; }
  else if(m.tipo==='rio') itens=[...embaralhar(RIOS).slice(0,8).map(r=>({tipo:'bacia',...r})), ...embaralhar(USOS).slice(0,4).map(u=>({tipo:'uso',...u, ordem:embaralhar([0,1,2,3])}))];
  else itens=embaralhar(PAISAGENS).map(p=>({...p}));
  M={m, itens, i:0, ok:0, total:0, primeira:{}};
  telaMissao();
  const intro={
    rumo:`<p>A <b>rosa dos ventos</b> mostra as direções. Os <b>pontos cardeais</b> são Norte, Sul, Leste e Oeste. Entre eles ficam os <b>colaterais</b>: Nordeste, Sudeste, Sudoeste e Noroeste.</p><p>No mapa, o <b>norte fica para cima</b>. Imagine que você está na cidade verde: para que lado precisa ir para chegar na cidade vermelha?</p>`,
    viz:`<p>Mato Grosso do Sul faz divisa com <b>5 estados</b> e fronteira com <b>2 países</b>. Descubra quem é quem e conheça as <b>cidades-gêmeas</b>: cidades de países diferentes que ficam coladinhas na fronteira.</p>`,
    rio:`<p>Uma <b>bacia hidrográfica</b> é toda a área cujas águas escorrem para o mesmo rio principal. Em MS existem duas grandes bacias:</p><div class="lista"><div>🌊 <b>Bacia do Paraguai</b>: a oeste, passa pelo Pantanal.</div><div>⚡ <b>Bacia do Paraná</b>: a leste, com grandes usinas hidrelétricas.</div></div><p class="mini">Dica: olhe no mapa onde fica a cidade por onde o rio passa.</p>`,
    pais:`<p>Uma paisagem junta <b>relevo</b>, <b>clima</b>, <b>solo</b>, <b>vegetação</b> e o que as pessoas fazem nela. MS tem três grandes biomas:</p><div class="lista">${Object.values(BIOMAS).map(b=>`<div>${b.e} <b>${b.n}</b></div>`).join('')}</div>`
  }[m.tipo];
  abrirModal(`<span class="selo">MISSÃO ${m.idx+1} · ${m.hab}</span><h2 style="margin-top:10px">${m.ic} ${esc(m.titulo)}</h2>${intro}<div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Vamos lá! 🧭</button></div>`);
}
function registrar(chave, cat, ok){
  if(M.primeira[chave]!=null) return; M.primeira[chave]=ok; M.total++; if(ok) M.ok++;
  S.stats[cat]=S.stats[cat]||{ok:0,total:0}; S.stats[cat].total++; if(ok) S.stats[cat].ok++; salvar();
}
function telaMissao(){
  const m=M.m;
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="mapa" aria-label="Voltar">←</button><div class="tit"><h2>${m.ic} ${esc(m.titulo)}</h2><small>Missão ${m.idx+1} · ${m.hab}</small></div><button class="btn icone" data-acao="config" aria-label="Configurações">⚙️</button></header>
  <section class="jogo"><div class="barra"><span id="cont"></span><div class="trilho"><i id="trilho"></i></div></div><div class="painel" id="area"></div></section>`;
  desenhar();
}
function desenhar(){
  $('#cont').textContent=`${M.i+1}/${M.itens.length}`; $('#trilho').style.width=(100*M.i/M.itens.length)+'%';
  ({rumo:desenharRumo, viz:desenharViz, rio:desenharRio, pais:desenharPais})[M.m.tipo]();
  const b=$('[data-acao="seguir"]'); if(b) b.focus();
}
function botaoSeguir(){ return `<div class="seguir"><button class="btn agua" data-acao="seguir">${M.i<M.itens.length-1?'Próximo ➔':'Concluir missão ✔'}</button></div>`; }
function seguir(){ M.i++; if(M.i>=M.itens.length) return concluir(); desenhar(); window.scrollTo(0,0); }
const item=()=>M.itens[M.i];

/* --- 1. rosa dos ventos --- */
function desenharRumo(){
  const it=item(), feito=!!it.feito, D=DIRS[it.k];
  const bt=GRADE.map(s=>{ if(s==='*') return `<button class="centro" tabindex="-1" aria-hidden="true">🧭</button>`;
    const j=DIRS.findIndex(d=>d.s===s), er=(it.err||[]).includes(j);
    return `<button class="${er?'errada':''} ${feito&&j===it.k?'certa':''}" data-dir="${j}" ${er||feito?'disabled':''} aria-label="${DIRS[j].n}">${s}<small>${DIRS[j].n}</small></button>`; }).join('');
  $('#area').innerHTML=`<div class="lado-a-lado"><div class="mapa-box">${mapa({pins:[{c:it.a,cor:'#15803D'},{c:it.b,cor:'#DC2626'}], seta:feito?[it.a,it.b]:null})}</div>
    <div><p class="enunciado">Saindo de <b style="color:#15803D">${esc(it.a)}</b>, em que direção fica <b style="color:#DC2626">${esc(it.b)}</b>?</p>
    <div class="bussola">${bt}</div>
    <div id="ret">${feito?`<div class="retorno ok"><span class="t">✅ ${D.n}!</span>${esc(it.b)} fica a ${D.n.toLowerCase()} de ${esc(it.a)}.</div>${botaoSeguir()}`:(it.msg||'')}</div></div></div>`;
}
function responderDir(j){ const it=item();
  if(j===it.k){ registrar('r'+M.i,'rumo',true); som('ok'); it.feito=true; }
  else { registrar('r'+M.i,'rumo',false); som('erro'); it.err=(it.err||[]).concat(j);
    const vert=[0,1,7].includes(it.k)?'para cima (norte)':[3,4,5].includes(it.k)?'para baixo (sul)':'nem para cima nem para baixo';
    const hor=[1,2,3].includes(it.k)?'para a direita (leste)':[5,6,7].includes(it.k)?'para a esquerda (oeste)':'nem para a direita nem para a esquerda';
    it.msg=`<div class="retorno no"><span class="t">Não é ${DIRS[j].n.toLowerCase()}.</span>Olhe o mapa: da cidade verde até a vermelha você vai ${vert} e ${hor}.</div>`; }
  desenharRumo();
}

/* --- 2. vizinhos --- */
function desenharViz(){
  const it=item(), feito=!!it.feito; let h;
  if(it.tipo==='viz'){
    h=`<div class="lado-a-lado"><div class="mapa-box">${mapa({alvo:it.k, revela:feito})}<p class="leg">Mato Grosso do Sul está em amarelo.</p></div><div>
      <p class="enunciado">Quem é este vizinho de MS?</p>
      <div class="opcoes">${it.ops.map((k,j)=>{ const er=(it.err||[]).includes(k);
        return `<button class="op ${er?'errada':''} ${feito&&k===it.k?'certa':''}" data-viz="${k}" ${er||feito?'disabled':''}><b>${'ABCD'[j]}</b><span>${VIZ[k].n} <small style="color:var(--suave)">(${VIZ[k].t})</small></span></button>`; }).join('')}</div>
      <div id="ret">${feito?`<div class="retorno ok"><span class="t">✅ ${VIZ[it.k].n}!</span>${esc(VIZ[it.k].x)}</div>${botaoSeguir()}`:(it.msg||'')}</div></div></div>`;
  } else {
    h=`<div class="lado-a-lado"><div class="mapa-box">${mapa({nomes:true, pins:[{c:it.c}]})}</div><div>
      <p class="enunciado">🤝 Cidades-gêmeas</p><p class="pergunta">${esc(it.c)} fica colada em qual cidade do outro lado da fronteira?</p>
      <div class="opcoes">${it.ops.map((g,j)=>{ const er=(it.err||[]).includes(g);
        return `<button class="op ${er?'errada':''} ${feito&&g===it.g?'certa':''}" data-gem="${esc(g)}" ${er||feito?'disabled':''}><b>${'ABCD'[j]}</b><span>${esc(g)}</span></button>`; }).join('')}</div>
      <div id="ret">${feito?`<div class="retorno ok"><span class="t">✅ ${esc(it.g)} (${it.p})!</span>${esc(it.x)}</div>${botaoSeguir()}`:(it.msg||'')}</div></div></div>`;
  }
  $('#area').innerHTML=h;
}
function responderViz(k){ const it=item();
  if(k===it.k){ registrar('v'+M.i,'viz',true); som('ok'); it.feito=true; }
  else { registrar('v'+M.i,'viz',false); som('erro'); it.err=(it.err||[]).concat(k);
    it.msg=`<div class="retorno no"><span class="t">Não é ${VIZ[k].n}.</span>Use a rosa dos ventos: o vizinho fica ao norte, ao sul, a leste ou a oeste de MS?</div>`; }
  desenharViz();
}
function responderGem(g){ const it=item();
  if(g===it.g){ registrar('g'+M.i,'gem',true); som('ok'); it.feito=true; }
  else { registrar('g'+M.i,'gem',false); som('erro'); it.err=(it.err||[]).concat(g);
    it.msg=`<div class="retorno no"><span class="t">Não é essa.</span>Veja no mapa de que país ${esc(it.c)} está perto.</div>`; }
  desenharViz();
}

/* --- 3. rios --- */
function desenharRio(){
  const it=item(), feito=!!it.feito; let h;
  if(it.tipo==='bacia'){
    const bt=Object.entries(BACIAS).map(([k,b])=>`<button class="${k} ${it.resp&&k===it.b?'marcado':''} ${it.resp===k&&k!==it.b?'errado':''}" data-bacia="${k}" ${it.resp?'disabled':''}>${b.n}<small>${b.d}</small></button>`).join('');
    h=`<div class="lado-a-lado"><div class="mapa-box">${mapa({nomes:true, rios:true, rioAlvo:it.r, pins:it.c?[{c:it.c, cor:'#0369A1', rot:it.c}]:[]})}<p class="leg">${it.r?'O rio está piscando no mapa.':'O rio passa pela cidade marcada.'}</p></div><div>
      <p class="enunciado">🏞️ ${esc(it.n)}</p><p class="pergunta">${it.c?`Passa por ${esc(it.c)}. `:''}Para qual bacia correm as suas águas?</p>
      <div class="duas">${bt}</div>
      ${it.resp?`<div class="retorno ${it.resp===it.b?'ok':'no'}"><span class="t">${it.resp===it.b?'✅ Isso!':'❌ Não é bem assim.'} ${BACIAS[it.b].n}.</span>${esc(it.x)}</div>${botaoSeguir()}`:''}</div></div>`;
  } else {
    h=`<p class="enunciado">Água em MS</p><div class="ficha"><span class="em" aria-hidden="true">${it.e}</span><span class="txt" style="font-size:clamp(18px,2.6vw,22px)">${esc(it.t)}</span></div>
      <div class="opcoes">${it.ordem.map((j,pos)=>{ const er=(it.err||[]).includes(j), ok=feito&&j===0;
        return `<button class="op ${er?'errada':''} ${ok?'certa':''}" data-uso="${j}" ${er||feito?'disabled':''}><b>${'ABCD'[pos]}</b><span>${esc(it.o[j])}</span></button>`; }).join('')}</div>
      <div id="ret">${feito?`<div class="retorno ok"><span class="t">✅ Isso mesmo!</span>${esc(it.x)}</div>${botaoSeguir()}`:(it.msg||'')}</div>`;
  }
  $('#area').innerHTML=h;
}
function responderBacia(k){ const it=item(); it.resp=k; const ok=k===it.b; registrar('b'+M.i,'bacia',ok); som(ok?'ok':'erro'); desenharRio(); }
function responderUso(j){ const it=item();
  if(j===0){ registrar('u'+M.i,'uso',true); som('ok'); it.feito=true; }
  else { registrar('u'+M.i,'uso',false); som('erro'); it.err=(it.err||[]).concat(j); it.msg=`<div class="retorno no"><span class="t">Pense de novo.</span>Elimine as respostas impossíveis e releia a pergunta.</div>`; }
  desenharRio();
}

/* --- 4. paisagens --- */
function desenharPais(){
  const it=item(), feito=!!it.feito;
  $('#area').innerHTML=`<p class="enunciado">Que paisagem é esta?</p><div class="ficha"><span class="em" aria-hidden="true">${it.e}</span><span class="txt">${esc(it.t)}</span></div>
    <div class="tipos3">${Object.entries(BIOMAS).map(([k,b])=>{ const er=(it.err||[]).includes(k);
      return `<button class="tipo3 ${er?'errada':''} ${feito&&k===it.r?'certa':''}" data-bioma="${k}" ${er||feito?'disabled':''}><span class="em" aria-hidden="true">${b.e}</span>${b.n}</button>`; }).join('')}</div>
    <div id="ret">${feito?`<div class="retorno ok"><span class="t">✅ ${BIOMAS[it.r].n}!</span>${esc(it.x)}</div>${botaoSeguir()}`:(it.msg||'')}</div>`;
}
function responderBioma(k){ const it=item();
  if(k===it.r){ registrar('p'+M.i,'bioma',true); som('ok'); it.feito=true; }
  else { registrar('p'+M.i,'bioma',false); som('erro'); it.err=(it.err||[]).concat(k);
    it.msg=`<div class="retorno no"><span class="t">Não é ${BIOMAS[k].n}.</span>Pense no relevo (planície ou planalto?), na vegetação e em que parte do estado fica.</div>`; }
  desenharPais();
}

function concluir(){
  const acc=M.total? M.ok/M.total : 1; const est=acc>=.9?3:acc>=.7?2:1;
  const m=M.m, a=S.missoes[m.id]||{}; S.missoes[m.id]={feita:true, estrelas:Math.max(a.estrelas||0,est), vezes:(a.vezes||0)+1}; salvar();
  som('fim');
  const prox=m.idx<MISSOES.length-1;
  abrirModal(`<h2 style="text-align:center">Missão concluída! 🧭</h2><div class="big-est">${estrelasHtml(est)}</div>
    <div class="resumo"><div><b>${M.ok}/${M.total}</b>acertos de primeira</div><div><b>${patente().split(' ').slice(1).join(' ')}</b>seu título</div></div>
    <p class="mini" style="text-align:center">3 estrelas: 90% ou mais de primeira · 2 estrelas: 70% ou mais.</p>
    <div class="acoes" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" data-acao="repetir">↻ De novo</button>
      ${prox?'<button class="btn ipe" data-acao="prox" data-foco>Próxima missão ➔</button>':'<button class="btn ipe" data-ir="relatorio" data-foco>📊 Desempenho</button>'}</div>`);
}

/* ---------- RELATÓRIO ---------- */
function linhasRel(){ return Object.keys(CATS).filter(k=>S.stats[k]&&S.stats[k].total).map(k=>({k,nome:CATS[k],ok:S.stats[k].ok,total:S.stats[k].total,pct:Math.round(100*S.stats[k].ok/S.stats[k].total)})); }
function textoRel(){ const L=linhasRel(); const f=MISSOES.filter(m=>(S.missoes[m.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60).map(l=>l.nome);
  return ['EXPLORADOR MS — Relatório',`Estudante: ${S.nome||'(sem nome)'} · Turma: ${S.turma||'-'} · ${new Date().toLocaleDateString('pt-BR')}`,`Título: ${patente().replace(/^\S+\s/,'')} · Estrelas: ${totalEst()}/${MAXEST} · Missões: ${f}/${MISSOES.length}`,'Acertos na 1ª tentativa:',
    ...(L.length?L.map(l=>`- ${l.nome}: ${l.ok}/${l.total} (${l.pct}%)`):['- (ainda sem dados)']),`Retomar: ${ret.length?ret.join('; '):'nada urgente'}`].join('\n'); }
function telaRelatorio(){
  const L=linhasRel(); const f=MISSOES.filter(m=>(S.missoes[m.id]||{}).feita).length; const ret=L.filter(l=>l.total>=3&&l.pct<60);
  app.innerHTML=`<header class="topo"><button class="btn" data-ir="home" aria-label="Início">←</button><div class="tit"><h2>Meu desempenho</h2><small>${S.nome?esc(S.nome):'Estudante'}${S.turma?' · '+esc(S.turma):''}</small></div><button class="btn" data-ir="mapa">🧭 Missões</button></header>
  <section class="pg"><div class="resumo" style="justify-content:flex-start"><div><b>${patente()}</b>título</div><div><b>★ ${totalEst()}/${MAXEST}</b>estrelas</div><div><b>${f}/${MISSOES.length}</b>missões</div></div>
    <div class="cartao"><h3>Acertos na 1ª tentativa</h3>${L.length?L.map(l=>`<div class="cat"><span>${esc(l.nome)}</span><div class="bar"><i style="width:${l.pct}%"></i></div><span class="n">${l.ok}/${l.total} · ${l.pct}%</span></div>`).join(''):'<p class="mini">Faça algumas missões para ver seus resultados aqui.</p>'}</div>
    ${ret.length?`<div class="cartao" style="background:#FFF7D6;border-color:#F6D776"><b>Para treinar mais:</b> ${ret.map(l=>esc(l.nome)).join(', ')}.</div>`:''}
    <div class="cartao"><h3>Enviar para o professor</h3><p class="mini">Copie o relatório e cole no grupo da turma ou onde o professor indicar.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn ipe" data-acao="copiar-rel">📋 Copiar relatório</button><button class="btn" data-acao="apagar" id="btn-apagar">🗑️ Apagar meu progresso</button></div></div></section>`;
}

/* ---------- CONFIG / AJUDA ---------- */
function telaConfig(){
  const l=(k,t,d)=>`<div class="cfg-linha"><span>${t}<small>${d}</small></span><button class="troca" role="switch" aria-checked="${!!S.cfg[k]}" data-cfg="${k}" aria-label="${t}"></button></div>`;
  abrirModal(`<h2>Configurações</h2>${l('som','Efeitos sonoros','')}${l('livre','Liberar todas as missões','Para o professor escolher a missão da aula.')}<div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Pronto</button></div>`);
}
function telaAjuda(){
  abrirModal(`<h2>Como jogar</h2><div class="lista">
    <div>🧭 <b>Rosa dos ventos:</b> saindo da cidade verde, escolha a direção da cidade vermelha.</div>
    <div>🗺️ <b>Vizinhos de MS:</b> descubra o estado ou país que está piscando no mapa e as cidades-gêmeas.</div>
    <div>🏞️ <b>Caminho das águas:</b> diga se o rio é da bacia do Paraguai ou do Paraná.</div>
    <div>🌳 <b>Paisagens de MS:</b> reconheça o Pantanal, o Cerrado e a Mata Atlântica.</div>
    <div>⭐ As estrelas contam os acertos de primeira e sobem o seu título.</div></div>
    <div class="acoes"><button class="btn ipe" data-acao="fechar" data-foco>Entendi!</button></div>`);
}
function copiar(txt){ const ok=()=>toast('Copiado! 📋'); const fb=()=>{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');ok();}catch(e){toast('Não deu para copiar.');} t.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok).catch(fb); else fb(); }

/* ---------- EVENTOS ---------- */
let armado=false;
document.addEventListener('click',e=>{
  const q=s=>{ const el=e.target.closest(s); return el&&!el.disabled?el:null; };
  let el;
  if(el=e.target.closest('[data-ir]')){ if(modalAberto()) fecharModal(); ir(el.dataset.ir); return; }
  if(el=q('[data-missao]')){ ir('missao',+el.dataset.missao); return; }
  if(el=q('[data-dir]')){ responderDir(+el.dataset.dir); return; }
  if(el=q('[data-viz]')){ responderViz(el.dataset.viz); return; }
  if(el=q('[data-gem]')){ responderGem(el.dataset.gem); return; }
  if(el=q('[data-bacia]')){ responderBacia(el.dataset.bacia); return; }
  if(el=q('[data-uso]')){ responderUso(+el.dataset.uso); return; }
  if(el=q('[data-bioma]')){ responderBioma(el.dataset.bioma); return; }
  if(el=e.target.closest('[data-cfg]')){ const k=el.dataset.cfg; S.cfg[k]=!S.cfg[k]; el.setAttribute('aria-checked',S.cfg[k]); salvar(); if(TELA==='mapa') telaMapa(); return; }
  const ac=q('[data-acao]'); if(!ac) return; const a=ac.dataset.acao;
  if(a==='fechar') fecharModal();
  else if(a==='ajuda') telaAjuda();
  else if(a==='config') telaConfig();
  else if(a==='seguir') seguir();
  else if(a==='repetir'){ fecharModal(); ir('missao', M.m.idx); }
  else if(a==='prox'){ fecharModal(); ir('missao', M.m.idx+1); }
  else if(a==='copiar-rel') copiar(textoRel());
  else if(a==='apagar'){ if(!armado){ armado=true; ac.textContent='⚠️ Clique de novo para confirmar'; setTimeout(()=>{armado=false; const b=$('#btn-apagar'); if(b) b.textContent='🗑️ Apagar meu progresso';},3500); } else { const c=S.cfg; S=padrao(); S.cfg=c; salvar(); armado=false; toast('Progresso apagado.'); telaRelatorio(); } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modalAberto()) fecharModal(); });

telaHome();
</script>
</body>
</html>
