<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica de Problemas – Matemática 6º ao 9º ano</title>
<meta name="description" content="Monte uma situação-problema escolhendo as peças, confira se ela tem todos os dados, planeje e resolva. Habilidades de resolver e elaborar problemas do Currículo de MS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#0E4D45; --verde-esc:#08332D; --verde-claro:#E7F2EF;
    --latao:#C9962B; --latao-claro:#E8C066; --latao-esc:#8C6516;
    --papel:#FFF6DC; --borda:#CDBF96; --linha:#EADDB5;
    --tinta:#1B2430; --suave:#5b5440;
    --ok:#2E9E5B; --ok-claro:#E8F5EC; --erro:#D64545; --erro-claro:#FBE3E3;
    --raio:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--tinta);
    background:var(--verde);background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0);
    background-size:22px 22px;min-height:100vh}
  h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.15}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--latao-claro);outline-offset:3px}
  .oculto{display:none!important}

  .btn{border:0;border-radius:999px;padding:.55em 1.25em;font-weight:700;background:var(--latao);color:var(--tinta);
    box-shadow:0 4px 0 var(--latao-esc);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--latao-esc)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sec{background:#fff;border:2px solid var(--borda);border-radius:999px;padding:.4em 1em;font-weight:700}
  .link{background:none;border:0;padding:0;color:#6B5A2A;text-decoration:underline;font-size:.95rem}

  header.topo{max-width:1180px;margin:0 auto;padding:26px 16px 18px;color:#fff;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .engrenagem{width:56px;height:56px;flex:none;border-radius:50%;
    background:radial-gradient(circle,var(--verde) 0 22%,var(--latao) 23% 62%,transparent 63%),
      conic-gradient(from 0deg,var(--latao) 0 10%,transparent 10% 15%,var(--latao) 15% 25%,transparent 25% 30%,var(--latao) 30% 40%,transparent 40% 45%,var(--latao) 45% 55%,transparent 55% 60%,var(--latao) 60% 70%,transparent 70% 75%,var(--latao) 75% 85%,transparent 85% 90%,var(--latao) 90% 100%)}
  header h1{margin:0;font-size:clamp(2rem,5vw,2.8rem);color:var(--latao-claro)}
  header p{margin:0;opacity:.9}
  header .voltar{margin-left:auto;color:#fff;border-color:rgba(255,255,255,.5);background:transparent}

  main{max-width:1180px;margin:0 auto;padding:0 16px 48px}
  .painel{background:var(--papel);border-radius:var(--raio);padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.18)}

  /* escolha da habilidade */
  .anos{display:grid;gap:22px}
  .ano h2{margin:0 0 10px;font-size:1.5rem;color:var(--verde)}
  .habs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .hab{background:#fff;border:2px solid var(--linha);border-radius:var(--raio);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px}
  .hab:hover{border-color:var(--latao)}
  .hab .cod{font-size:.85rem;font-weight:700;color:var(--suave)}
  .hab .tit{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.2rem;font-weight:800;line-height:1.2}
  .hab .nv{font-size:.9rem;color:var(--verde);font-weight:700}

  /* área de trabalho */
  .barra{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:18px}
  .barra .hab-atual{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.35rem;font-weight:800}
  .barra .cod{font-size:.9rem;color:var(--suave)}
  .niveis{display:flex;gap:6px;flex-wrap:wrap}
  .niveis button{border:2px solid var(--borda);background:#fff;border-radius:10px;padding:.25em .8em;font-weight:700;font-size:.95rem}
  .niveis button[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
  .progresso{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--suave)}
  .progresso .bolinhas{display:flex;gap:4px}
  .progresso .bolinhas span{width:16px;height:16px;border-radius:50%;background:var(--linha)}
  .progresso .bolinhas span.on{background:var(--ok)}

  .etapas{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none}
  .etapas li{font-size:.9rem;font-weight:700;padding:.3em .8em;border-radius:999px;background:#fff;border:2px solid var(--linha);color:var(--suave)}
  .etapas li.atual{border-color:var(--latao);background:#FBEFC8;color:var(--tinta)}
  .etapas li.feita{border-color:var(--ok);color:var(--ok)}

  /* o enunciado com lacunas: a peça central */
  .enunciado{background:#fff;border:2px dashed var(--borda);border-radius:var(--raio);padding:20px 22px;font-size:1.3rem;line-height:2.1;margin-bottom:18px}
  .enunciado .lac{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--borda);color:transparent;line-height:1.2;vertical-align:baseline}
  .enunciado .lac.agora{border-bottom-color:var(--latao);background:linear-gradient(transparent 70%,#FBEFC8 70%)}
  .peca{display:inline-block;background:linear-gradient(#f6e3b0,var(--latao-claro));border:0;border-radius:8px;padding:0 .4em;line-height:1.5;
    font-weight:700;box-shadow:0 2px 0 var(--latao-esc);margin:0 .1em}
  button.peca{font-size:inherit}
  .enunciado .pergunta{display:block;margin-top:6px;font-weight:700;color:var(--verde)}

  .bancada h3{margin:0 0 10px;font-size:1.3rem}
  .opcoes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .opcoes .peca{font-size:1.1rem;padding:.25em .8em;cursor:pointer}
  .opcoes .peca:hover{filter:brightness(1.05)}
  .cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:12px}
  .escolha{background:#fff;border:2px solid var(--linha);border-radius:var(--raio);padding:14px 16px;text-align:left;font-weight:700}
  .escolha:hover{border-color:var(--latao)}
  .escolha small{display:block;font-weight:400;color:var(--suave)}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ops{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
  .ops button{border:2px solid var(--borda);background:#fff;border-radius:10px;padding:.3em .9em;font-weight:700;min-width:3em}
  .ops button[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
  .resp{display:flex;gap:8px;max-width:480px;margin-bottom:10px}
  .resp input{flex:1;min-width:0;padding:.4em .7em;border:2px solid var(--borda);border-radius:10px;background:#fff;font-size:1.2rem}
  .unid{align-self:center;color:var(--suave)}
  .nota{margin:0 0 12px;padding:10px 14px;border-radius:10px;font-size:1rem}
  .nota.ok{background:var(--ok-claro);border-left:4px solid var(--ok)}
  .nota.erro{background:var(--erro-claro);border-left:4px solid var(--erro)}
  .nota.info{background:#FBEFC8;border-left:4px solid var(--latao)}
  .dica-txt{color:var(--suave);font-size:.95rem;margin:0 0 12px}

  .fim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
  .selo{width:120px;height:120px;border-radius:50%;border:6px double var(--ok);color:var(--ok);display:grid;place-items:center;
    text-align:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;line-height:1.1;transform:rotate(-10deg)}
  .selo.subiu{border-color:var(--latao);color:var(--latao-esc)}

  footer{color:rgba(255,255,255,.7);text-align:center;font-size:.85rem;padding:0 16px 24px}

  @media (max-width:640px){
    body{font-size:17px}
    .painel{padding:18px}
    .enunciado{font-size:1.15rem;padding:16px}
    .habs,.cartoes{grid-template-columns:minmax(0,1fr)}
    .fim{grid-template-columns:minmax(0,1fr)}
    .selo{justify-self:center}
    header .voltar{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topo">
  <div class="engrenagem" aria-hidden="true"></div>
  <div>
    <h1>Fábrica de Problemas</h1>
    <p>Escolha as peças, monte a situação-problema e resolva.</p>
  </div>
  <button class="btn-sec voltar oculto" id="voltar" type="button">Trocar de habilidade</button>
</header>

<main>
  <section class="painel" id="telaHabs" aria-labelledby="tHabs">
    <h2 id="tHabs" class="oculto">Escolha a habilidade</h2>
    <div class="anos" id="anos"></div>
  </section>

  <section class="painel oculto" id="telaTrabalho" aria-live="polite">
    <div class="barra">
      <div>
        <div class="hab-atual" id="habNome"></div>
        <div class="cod" id="habCod"></div>
      </div>
      <div class="niveis" id="niveis" role="group" aria-label="Nível"></div>
      <div class="progresso" id="progresso"></div>
    </div>
    <ol class="etapas" id="etapas"></ol>
    <div class="enunciado oculto" id="enunciado"></div>
    <div class="bancada" id="bancada"></div>
  </section>
</main>

<footer>Habilidades do Organizador Curricular de MS que pedem para resolver e elaborar problemas · Matemática em Ação</footer>

<script>
(() => {
  // ================= utilidades =================
  const $ = id => document.getElementById(id);
  function el(tag, attrs = {}, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos.flat()) if (f != null && f !== false) e.append(f instanceof Node ? f : document.createTextNode(String(f)));
    return e;
  }
  const r2 = x => Math.round(x * 100) / 100;
  const fmt = n => (n < 0 ? '−' : '') + Math.abs(r2(n)).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const money = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(r2(n)).toLocaleString('pt-BR', { minimumFractionDigits: Number.isInteger(r2(n)) ? 0 : 2, maximumFractionDigits: 2 });
  const sup = n => String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
  const embaralhar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const amostra = (arr, k = 4) => { const s = embaralhar(arr).slice(0, k); return typeof s[0] === 'number' ? s.sort((a, b) => a - b) : s; };
  function numero(s) {
    const fr = String(s || '').trim().replace(/[\u2212\u2013]/g, '-');
    let m = fr.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m && +m[3]) return (+m[1] < 0 ? -1 : 1) * (Math.abs(+m[1]) + m[2] / m[3]);
    m = fr.match(/^(-?\d+)\s*\/\s*(\d+)$/);
    if (m) return +m[2] ? m[1] / m[2] : NaN;
    s = String(s || '').replace(/[−–]/g, '-').replace(/R\$|%|°C?|\s/gi, '');
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    s = s.replace(/[^0-9.\-]/g, '');
    return s === '' || s === '-' ? NaN : Number(s);
  }
  const lerLS = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  const salvarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

  // ================= construtores de peças =================
  const O = (t, v, extra = {}) => ({ t, v: v === undefined ? t : v, ...extra });
  const nums = (arr, k) => amostra(arr, k).map(n => O(fmt(n), n));
  const reais = (arr, k) => amostra(arr, k).map(n => O(money(n), n));
  const pct = arr => arr.map(p => O(p + '%', p));
  const nomes = () => amostra(['Ana', 'Pedro', 'Júlia', 'Davi', 'Sofia', 'Lucas', 'Marina', 'Gabriel', 'Laura', 'Enzo']).map(n => O(n));
  const PRODUTOS = () => [O('um tênis'), O('uma mochila'), O('um fone de ouvido'), O('uma bicicleta'), O('um jogo de videogame')];
  const LANCHES = () => [O('salgados', 'salgados', { sg: 'salgado' }), O('sucos', 'sucos', { sg: 'suco' }), O('pastéis', 'pastéis', { sg: 'pastel' }), O('pedaços de bolo', 'pedaços de bolo', { sg: 'pedaço de bolo' })];
  const sig = n => (n < 0 ? '−' : '') + Math.abs(n);
  const frac = (n, d) => O(`${n}/${d}`, n / d, { n, d });
  const fracs = (pool, N) => amostra(pool.filter(([, d]) => N % d === 0), 4).map(([n, d]) => frac(n, d));
  const UNIT = [[1, 2], [1, 3], [1, 4], [1, 5], [1, 6]];
  const NAOUNIT = [[2, 3], [3, 4], [2, 5], [3, 5], [5, 6]];
  const ACOES = () => [O('vai ao passeio', null, { q: 'vão ao passeio' }), O('prefere futebol', null, { q: 'preferem futebol' }), O('trouxe lanche de casa', null, { q: 'trouxeram lanche de casa' })];
  const ACOES_PCT = () => [O('vão de ônibus para a escola', null, { q: 'vão de ônibus para a escola' }), O('praticam algum esporte', null, { q: 'praticam algum esporte' }), O('leem pelo menos um livro por mês', null, { q: 'leem pelo menos um livro por mês' })];
  function estrategiaPct(v, p) {
    const d = r2(v / 10), m = {
      5: `10% de ${money(v)} = ${money(d)}; 5% é a metade: ${money(r2(d / 2))}`,
      10: `10% de ${money(v)} = ${money(v)} ÷ 10 = ${money(d)}`,
      15: `10% = ${money(d)} e 5% = ${money(r2(d / 2))}; 15% = ${money(r2(d * 1.5))}`,
      20: `10% = ${money(d)}; 20% = 2 × ${money(d)} = ${money(r2(d * 2))}`,
      25: `25% é 1/4: ${money(v)} ÷ 4 = ${money(r2(v / 4))}`,
      30: `10% = ${money(d)}; 30% = 3 × ${money(d)} = ${money(r2(d * 3))}`,
      35: `10% = ${money(d)}; 30% = ${money(r2(d * 3))}; 5% = ${money(r2(d / 2))}; 35% = ${money(r2(d * 3.5))}`,
      40: `10% = ${money(d)}; 40% = 4 × ${money(d)} = ${money(r2(d * 4))}`,
      50: `50% é a metade: ${money(v)} ÷ 2 = ${money(r2(v / 2))}`,
      75: `50% = ${money(r2(v / 2))} e 25% = ${money(r2(v / 4))}; 75% = ${money(r2(v * .75))}`
    };
    return m[p] || `${p}% de ${money(v)} = ${money(r2(v * p / 100))}`;
  }
  const temRestoPool = (c, de, ate) => { const p = []; for (let x = de; x <= ate; x++) if (x % c) p.push(x); return p; };
  const mdc = (a, b) => (b ? mdc(b, a % b) : Math.abs(a));
  const mmc = (a, b) => a / mdc(a, b) * b;
  const divisores = n => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };
  const multiplosAte = (a, lim) => { const l = []; for (let x = a; x <= lim; x += a) l.push(x); return l; };
  const intervalo = (a, b) => { const l = []; for (let i = a; i <= b; i++) l.push(i); return l; };
  // frações exatas: {n, d, v, t}
  const F = (n, d) => { const g = mdc(n, d) || 1; n /= g; d /= g; return { n, d, v: n / d, t: d === 1 ? String(n) : `${n}/${d}` }; };
  const fopt = ([n, d]) => { const f = F(n, d); return O(f.t, f.v, { n: f.n, d: f.d }); };
  function contaFracoes(f1, f2, op) {
    const m = mmc(f1.d, f2.d), a = f1.n * m / f1.d, b = f2.n * m / f2.d, r = op === '+' ? a + b : Math.abs(a - b), fr = F(r, m);
    const passo = f1.d === f2.d ? '' : `Denominador comum ${m}: ${f1.t} = ${a}/${m} e ${f2.t} = ${b}/${m}. `;
    const ordem = op === '+' || a >= b ? `${a}/${m} ${op} ${b}/${m}` : `${b}/${m} − ${a}/${m}`;
    const misto = fr.n > fr.d && fr.d > 1 ? ` (ou ${Math.floor(fr.n / fr.d)} ${Math.floor(fr.n / fr.d) === 1 ? 'inteiro' : 'inteiros'} e ${fr.n % fr.d}/${fr.d})` : '';
    return { f: fr, txt: `${passo}${ordem} = ${r}/${m}` + (fr.t !== `${r}/${m}` ? ` = ${fr.t}` : '') + misto + '.' };
  }
  const hora = min => `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`;
  const outroNome = s => amostra(['Ana', 'Pedro', 'Júlia', 'Davi', 'Sofia', 'Lucas', 'Marina', 'Gabriel', 'Laura', 'Enzo'].filter(n => n !== s.nome.v)).map(n => O(n));
  const FAIXAS_FRACAO = [{ t: 'menos de 1/2', ok: x => x < 0.5 - 1e-9 }, { t: 'de 1/2 até quase 1', ok: x => x >= 0.5 - 1e-9 && x < 1 - 1e-9 },
                         { t: 'exatamente 1 inteiro', ok: x => Math.abs(x - 1) < 1e-9 }, { t: 'mais de 1 inteiro', ok: x => x > 1 + 1e-9 }];

  // ================= pacotes por habilidade =================
  // Cada cenário: peças (lacunas), texto com {id} ou {id.campo}, perguntas.
  // Pergunta com r = null é proposital: os dados não bastam e o aluno precisa perceber.
  const PACOTES = [
  {
    id: 'EF06MA03', cod: 'MS.EF06MA03.s.03', ano: '6º ano', nome: 'Problemas com números naturais',
    desc: 'Resolver e elaborar problemas com números naturais, com cálculo mental ou escrito, exato ou aproximado.',
    niveis: [
      { nome: 'Uma operação', cenarios: [
        { nome: 'Cantina', resumo: 'Vendas no intervalo',
          pecas: [{ id: 'prod', rot: 'O que a cantina vendeu?', op: LANCHES },
                  { id: 'q', rot: 'Quantos foram vendidos?', op: () => nums([24, 32, 36, 45, 48, 56, 64, 75]) },
                  { id: 'p', rot: 'Qual é o preço de cada um?', op: () => reais([2, 3, 4, 5, 6]) }],
          texto: 'No intervalo, a cantina vendeu {q} {prod}. Cada {prod.sg} custa {p}.',
          perguntas: [
            { p: 'Quanto a cantina arrecadou com os {prod}?', r: s => s.q.v * s.p.v, ops: ['×'], un: 'reais',
              res: s => `${s.q.v} × ${s.p.v} = ${s.q.v * s.p.v}. A cantina arrecadou ${money(s.q.v * s.p.v)}.` },
            { p: 'Se cada {prod.sg} custasse R$ 1 a mais, quanto a cantina teria arrecadado?', r: s => s.q.v * (s.p.v + 1), ops: ['+', '×'], un: 'reais',
              res: s => `Novo preço: ${s.p.v} + 1 = ${s.p.v + 1}. ${s.q.v} × ${s.p.v + 1} = ${s.q.v * (s.p.v + 1)} reais.` },
            { p: 'Quantos {prod} sobraram no fim do dia?', r: null, falta: 'quantos {prod} havia no começo do dia' }] },
        { nome: 'Figurinhas', resumo: 'Coleção de um estudante',
          pecas: [{ id: 'nome', rot: 'Quem é o colecionador?', op: nomes },
                  { id: 'a', rot: 'Quantas figurinhas tinha?', op: () => nums([35, 48, 56, 63, 74, 87]) },
                  { id: 'b', rot: 'Quantas ganhou?', op: () => nums([12, 15, 18, 24, 27]) }],
          texto: '{nome} tinha {a} figurinhas e ganhou {b} de um colega.',
          perguntas: [
            { p: 'Com quantas figurinhas {nome} ficou?', r: s => s.a.v + s.b.v, ops: ['+'], un: 'figurinhas', res: s => `${s.a.v} + ${s.b.v} = ${s.a.v + s.b.v} figurinhas.` },
            { p: 'Quantas figurinhas {nome} tinha a mais do que as que ganhou?', r: s => s.a.v - s.b.v, ops: ['−'], un: 'figurinhas', res: s => `${s.a.v} − ${s.b.v} = ${s.a.v - s.b.v} figurinhas.` },
            { p: 'Quantas figurinhas faltam para completar o álbum?', r: null, falta: 'quantas figurinhas cabem no álbum' }] }
      ]},
      { nome: 'Duas etapas', cenarios: [
        { nome: 'Papelaria', resumo: 'Compras e troco',
          pecas: [{ id: 'nome', rot: 'Quem foi às compras?', op: nomes },

  // ================= estado =================
  const ETAPAS = ['Cenário', 'Montar', 'Pergunta', 'Conferir', 'Planejar', 'Resolver'];
  let pac = null, nivel = 0, cen = null, sel = {}, slotAtual = 0, perg = null, prog = {};
  const chaveProg = id => 'fabrica.' + id;

  function preencher(tpl, s) {
    return tpl.replace(/\{(\w+)(?:\.(\w+))?\}/g, (_, id, k) => s[id] ? String(k ? s[id][k] : s[id].t) : '____');
  }

  // ================= telas =================
  function telaHabs() {
    $('telaTrabalho').classList.add('oculto'); $('telaHabs').classList.remove('oculto'); $('voltar').classList.add('oculto');
    const box = $('anos'); box.innerHTML = '';
    const anos = [...new Set(PACOTES.map(p => p.ano))];
    anos.forEach(ano => {
      const g = el('div', { class: 'habs' });
      PACOTES.filter(p => p.ano === ano).sort((a, b) => a.id.localeCompare(b.id)).forEach(p => {
        const pr = lerLS(chaveProg(p.id)) || { nivel: 0 };
        g.append(el('button', { class: 'hab', type: 'button', onclick: () => abrirPacote(p) },
          el('span', { class: 'cod' }, p.cod),
          el('span', { class: 'tit' }, p.nome),
          el('span', {}, p.desc),
          el('span', { class: 'nv' }, `Nível ${pr.nivel + 1} de ${p.niveis.length}`)));
      });
      box.append(el('div', { class: 'ano' }, el('h2', {}, ano), g));
    });
  }

  function abrirPacote(p) {
    pac = p; prog = lerLS(chaveProg(p.id)) || { nivel: 0, acertos: 0, falhas: 0 };
    nivel = Math.min(prog.nivel, p.niveis.length - 1);
    $('telaHabs').classList.add('oculto'); $('telaTrabalho').classList.remove('oculto'); $('voltar').classList.remove('oculto');
    $('habNome').textContent = p.nome; $('habCod').textContent = p.cod + ' · ' + p.ano;
    try { history.replaceState(null, '', '?hab=' + p.id); } catch (_) {}
    novoProblema();
  }

  function desenharNiveis() {
    const box = $('niveis'); box.innerHTML = '';
    pac.niveis.forEach((n, i) => box.append(el('button', { type: 'button', 'aria-pressed': i === nivel, title: n.nome,
      onclick: () => { nivel = i; prog.nivel = i; prog.acertos = 0; prog.falhas = 0; salvarLS(chaveProg(pac.id), prog); novoProblema(); } }, `Nível ${i + 1}: ${n.nome}`)));
    const b = el('span', { class: 'bolinhas' });
    for (let i = 0; i < 3; i++) b.append(el('span', { class: i < (prog.acertos || 0) ? 'on' : '' }));
    const pr = $('progresso'); pr.innerHTML = '';
    pr.append(b, nivel < pac.niveis.length - 1 ? '3 acertos liberam o próximo nível' : 'Último nível');
  }

  function desenharEtapas(i) {
    const box = $('etapas'); box.innerHTML = '';
    ETAPAS.forEach((t, k) => box.append(el('li', { class: k < i ? 'feita' : k === i ? 'atual' : '' }, `${k + 1}. ${t}`)));
  }

  function desenharEnunciado(comPergunta) {
    const box = $('enunciado'); box.innerHTML = ''; box.classList.remove('oculto');
    const partes = cen.texto.split(/(\{\w+(?:\.\w+)?\})/);
    partes.forEach(pt => {
      const m = pt.match(/^\{(\w+)(?:\.(\w+))?\}$/);
      if (!m) { box.append(pt); return; }
      const [, id, k] = m;
      if (sel[id]) {
        const idx = cen.pecas.findIndex(p => p.id === id);
        box.append(el('button', { class: 'peca', type: 'button', title: 'Trocar esta peça', onclick: () => { if (!comPergunta) { trocarDesde(idx); } } }, String(k ? sel[id][k] : sel[id].t)));
      } else {
        const atual = cen.pecas[slotAtual] && cen.pecas[slotAtual].id === id;
        box.append(el('span', { class: 'lac' + (atual ? ' agora' : ''), 'aria-label': 'lacuna' }, '____'));
      }
    });
    if (comPergunta && perg) box.append(el('span', { class: 'pergunta' }, preencher(perg.p, sel)));
  }

  function trocarDesde(idx) {
    // trocar uma peça apaga as que dependem dela (as seguintes)
    cen.pecas.slice(idx).forEach(p => delete sel[p.id]);
    slotAtual = idx; etapaMontar();
  }

  // ---------- etapa 1: cenário ----------
  function novoProblema() {
    cen = null; sel = {}; slotAtual = 0; perg = null;
    desenharNiveis(); desenharEtapas(0); $('enunciado').classList.add('oculto');
    const nv = pac.niveis[nivel], b = $('bancada'); b.innerHTML = '';
    const cards = el('div', { class: 'cartoes' });
    nv.cenarios.forEach(c => cards.append(el('button', { class: 'escolha', type: 'button', onclick: () => { cen = c; etapaMontar(); } }, c.nome, el('small', {}, c.resumo))));
    b.append(el('h3', {}, 'Escolha o cenário do problema'), cards);
  }

  // ---------- etapa 2: montar ----------
  function etapaMontar() {
    desenharEtapas(1); desenharEnunciado(false);
    const b = $('bancada'); b.innerHTML = '';
    if (slotAtual >= cen.pecas.length) { etapaPergunta(); return; }
    const peca = cen.pecas[slotAtual];
    const ops = el('div', { class: 'opcoes' });
    peca.op(sel).forEach(o => ops.append(el('button', { class: 'peca', type: 'button', onclick: () => { sel[peca.id] = o; slotAtual++; etapaMontar(); } }, o.t)));
    b.append(el('h3', {}, peca.rot), ops,
      el('div', { class: 'acoes' },
        el('button', { class: 'btn-sec', type: 'button', onclick: sortearRestante }, 'Sortear as peças que faltam'),
        slotAtual > 0 && el('button', { class: 'link', type: 'button', onclick: () => trocarDesde(slotAtual - 1) }, 'Voltar uma peça')),
      el('p', { class: 'dica-txt', style: 'margin-top:12px' }, 'Para trocar uma peça já escolhida, clique nela no texto.'));
  }
  function sortearRestante() {
    for (let i = slotAtual; i < cen.pecas.length; i++) { const p = cen.pecas[i]; const l = p.op(sel); sel[p.id] = l[Math.floor(Math.random() * l.length)]; }
    slotAtual = cen.pecas.length; etapaMontar();
  }

  // ---------- etapa 3: pergunta ----------
  function etapaPergunta() {
    desenharEtapas(2); desenharEnunciado(false);
    const b = $('bancada'); b.innerHTML = '';
    const cards = el('div', { class: 'cartoes' });
    embaralhar(cen.perguntas).forEach(q => cards.append(el('button', { class: 'escolha', type: 'button', onclick: () => { perg = q; etapaConferir(); } }, preencher(q.p, sel))));
    b.append(el('h3', {}, 'Agora escolha a pergunta do problema'), cards,
      el('button', { class: 'link', type: 'button', onclick: () => trocarDesde(cen.pecas.length - 1) }, 'Voltar e trocar peças'));
  }

  // ---------- etapa 4: conferir se dá para responder ----------
  function etapaConferir() {
    desenharEtapas(3); desenharEnunciado(true);
    const b = $('bancada'); b.innerHTML = '';
    const nota = el('div');
    const responder = disse => {
      const possivel = perg.r !== null;
      b.querySelectorAll('.acoes button').forEach(x => x.disabled = true);
      if (possivel && disse) { nota.replaceWith(el('p', { class: 'nota ok' }, 'Isso! O problema tem todos os dados necessários.')); setTimeout(etapaPlanejar, 900); }
      else if (!possivel && !disse) {
        b.append(el('p', { class: 'nota ok' }, `Muito bem! Para responder, faltaria saber ${preencher(perg.falta, sel)}. Um bom problema precisa trazer todos os dados.`),
          el('button', { class: 'btn', type: 'button', onclick: () => { perg = null; etapaPergunta(); } }, 'Escolher outra pergunta'));
      } else if (!possivel && disse) {
        b.append(el('p', { class: 'nota erro' }, `Releia com atenção: o problema não diz ${preencher(perg.falta, sel)}. Sem esse dado, não dá para responder.`),
          el('button', { class: 'btn', type: 'button', onclick: () => { perg = null; etapaPergunta(); } }, 'Escolher outra pergunta'));
      } else {
        b.append(el('p', { class: 'nota info' }, 'Dá para responder, sim: todos os dados necessários estão no texto. Releia e veja quais você vai usar.'),
          el('button', { class: 'btn', type: 'button', onclick: etapaPlanejar }, 'Continuar'));
      }
    };
    b.append(el('h3', {}, 'Com os dados do seu problema, dá para responder a essa pergunta?'),
      el('div', { class: 'acoes', style: 'margin-bottom:14px' },
        el('button', { class: 'btn', type: 'button', onclick: () => responder(true) }, 'Sim, dá para responder'),
        el('button', { class: 'btn-sec', type: 'button', onclick: () => responder(false) }, 'Não, falta informação')), nota);
  }

  // ---------- etapa 5: planejar ----------
  const OPERACOES = ['+', '−', '×', '÷', 'potência', '%'];
  function faixas(neg) {
    const f = [];
    if (neg) f.push({ t: 'um número negativo', ok: x => x < 0 });
    f.push({ t: 'menos de 10', ok: x => x >= 0 && x < 10 }, { t: 'de 10 a 99', ok: x => x >= 10 && x < 100 },
           { t: 'de 100 a 999', ok: x => x >= 100 && x < 1000 }, { t: '1.000 ou mais', ok: x => x >= 1000 });
    return f;
  }
  function etapaPlanejar() {
    desenharEtapas(4); desenharEnunciado(true);
    const b = $('bancada'); b.innerHTML = '';
    const marc = new Set(); let est = null;
    const opsBox = el('div', { class: 'ops', role: 'group', 'aria-label': 'Operações' });
    OPERACOES.forEach(o => { const bt = el('button', { type: 'button', 'aria-pressed': false, onclick: () => { marc.has(o) ? marc.delete(o) : marc.add(o); bt.setAttribute('aria-pressed', marc.has(o)); conf.disabled = !marc.size || !est; } }, o); opsBox.append(bt); });
    const estBox = el('div', { class: 'ops', role: 'group', 'aria-label': 'Estimativa' });
    (pac.faixas || faixas(pac.neg)).forEach(f => { const bt = el('button', { type: 'button', 'aria-pressed': false, onclick: () => { est = f; estBox.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === bt)); conf.disabled = !marc.size || !est; } }, f.t); estBox.append(bt); });
    const conf = el('button', { class: 'btn', type: 'button', disabled: true, onclick: () => {
      const certo = perg.r(sel), esperadas = new Set(perg.ops);
      const iguais = marc.size === esperadas.size && [...marc].every(o => esperadas.has(o));
      const msgs = [];
      msgs.push(iguais ? 'Operações certas!' : `A resolução usa: ${perg.ops.join(', ')}. Vocês marcaram: ${[...marc].join(', ')}.`);
      msgs.push(est.ok(certo) ? 'A estimativa também está certa.' : 'A estimativa não bateu. Pensem de novo no tamanho do resultado enquanto calculam.');
      etapaResolver(msgs.join(' '), iguais && est.ok(certo));
    } }, 'Confirmar o plano');
    b.append(el('h3', {}, 'Quais operações vocês vão usar?'), opsBox,
      el('h3', {}, 'Antes de calcular: o resultado vai ser…'), estBox, conf);
  }

  // ---------- etapa 6: resolver ----------
  function etapaResolver(msgPlano, planoOk) {
    desenharEtapas(5); desenharEnunciado(true);
    const b = $('bancada'); b.innerHTML = '';
    const certo = perg.r(sel), un = preencher(perg.un || '', sel);
    let erros = 0;
    const inp = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'Resposta', autocomplete: 'off', 'aria-label': 'Resposta' });
    const fb = el('div', { 'aria-live': 'polite' });
    const form = el('form', { class: 'resp', novalidate: true, onsubmit: ev => {
      ev.preventDefault();
      const v = numero(inp.value);
      if (isNaN(v)) { fb.replaceChildren(el('p', { class: 'nota erro' }, 'Digitem um número' + (pac.neg ? ' (use o sinal de menos para negativos).' : '.'))); return; }
      if (Math.abs(v - certo) < (perg.tol != null ? perg.tol : 0.0051)) { concluir(true, erros); return; }
      erros++;
      if (erros >= 3) { concluir(false, erros); return; }
      fb.replaceChildren(el('p', { class: 'nota erro' }, `Ainda não. Restam ${3 - erros} tentativa(s). Confiram cada passo da conta.`));
      inp.select();
    } }, inp, el('button', { class: 'btn', type: 'submit' }, 'Verificar'));
    if (un) form.insertBefore(el('span', { class: 'unid' }, un), form.lastChild);
    b.append(...[el('p', { class: 'nota ' + (planoOk ? 'ok' : 'info') }, msgPlano),
      el('h3', {}, 'Resolvam e digitem a resposta'), form,
      pac.neg ? el('p', { class: 'dica-txt' }, 'Para números negativos, use o sinal de menos. Ex.: -15') : null,
      el('p', { class: 'dica-txt' }, perg.fmt ? 'Escrevam a fração assim: 5/6. Frações equivalentes também valem.' : 'Números com vírgula podem ser escritos assim: 37,50'), fb].filter(Boolean));
    setTimeout(() => inp.focus({ preventScroll: true }), 30);
  }

  function concluir(acertou, erros) {
    const b = $('bancada'); b.innerHTML = '';
    const certo = perg.r(sel), un = preencher(perg.un || '', sel);
    let subiu = false, desceu = false;
    if (acertou) {
      prog.acertos = (prog.acertos || 0) + 1; prog.falhas = 0;
      if (prog.acertos >= 3 && nivel < pac.niveis.length - 1) { nivel++; prog.nivel = nivel; prog.acertos = 0; subiu = true; }
    } else {
      prog.falhas = (prog.falhas || 0) + 1;
      if (prog.falhas >= 2 && nivel > 0) { nivel--; prog.nivel = nivel; prog.acertos = 0; prog.falhas = 0; desceu = true; }
    }
    salvarLS(chaveProg(pac.id), prog);
    desenharNiveis(); desenharEtapas(6);

    const resposta = perg.fmt ? perg.fmt(sel) + (un ? ' ' + un : '') : (un === 'reais' ? money(certo) : fmt(certo) + (un ? ' ' + un : ''));
    const texto = `${preencher(cen.texto, sel)} ${preencher(perg.p, sel)}`;
    const copiar = el('button', { class: 'btn-sec', type: 'button', onclick: async () => {
      const t = `Enunciado: ${texto}\nResposta: ${perg.fmt ? perg.fmt(sel) : fmt(certo)}${un ? ' (' + un + ')' : ''}\nComo resolver: ${perg.res(sel)}\nHabilidade: ${pac.cod}`;
      try { await navigator.clipboard.writeText(t); copiar.textContent = 'Copiado!'; }
      catch (_) { const ta = el('textarea', {}, t); document.body.append(ta); ta.select(); try { document.execCommand('copy'); copiar.textContent = 'Copiado!'; } catch (__) { copiar.textContent = 'Não foi possível copiar'; } ta.remove(); }
    } }, 'Copiar para o Banco de Desafios');

    const info = el('div', {},
      el('h3', {}, acertou ? (erros ? 'Resposta certa!' : 'Resposta certa de primeira!') : 'Vejam como resolver'),
      el('p', { class: 'nota ' + (acertou ? 'ok' : 'info') }, `Resposta: ${resposta}. ${perg.res(sel)}`),
      subiu ? el('p', { class: 'nota ok' }, `Vocês subiram para o nível ${nivel + 1}: ${pac.niveis[nivel].nome}!`) : null,
      desceu ? el('p', { class: 'nota info' }, `Vamos treinar mais um pouco no nível ${nivel + 1}: ${pac.niveis[nivel].nome}.`) : null,
      el('div', { class: 'acoes' },
        el('button', { class: 'btn', type: 'button', onclick: novoProblema }, 'Montar outro problema'), copiar));
    const selo = el('div', { class: 'selo' + (subiu ? ' subiu' : ''), 'aria-hidden': 'true' }, subiu ? 'NOVO NÍVEL' : acertou ? 'PROBLEMA RESOLVIDO' : 'TENTEM DE NOVO');
    b.append(el('div', { class: 'fim' }, info, selo));
  }

  // ================= início =================
  $('voltar').addEventListener('click', () => { try { history.replaceState(null, '', location.pathname); } catch (_) {} telaHabs(); });
  window.__fabrica = { PACOTES, preencher, respostaAtual: () => (perg && perg.r ? perg.r(sel) : null) };
  telaHabs();
  const q = new URLSearchParams(location.search).get('hab');
  const alvo = q && PACOTES.find(p => p.id.toLowerCase() === q.toLowerCase().replace(/^ms\./, '').split('.')[0]);
  if (alvo) abrirPacote(alvo);
})();
</script>
</body>
</html>
